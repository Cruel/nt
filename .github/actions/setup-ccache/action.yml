name: Setup ccache
description: Restore bounded compiler objects for exactly one compatible target, compiler, and build mode.
inputs:
  scope:
    description: Compiler/target/ABI/flags scope, which must not be shared by incompatible variants.
    required: true
  compiler:
    description: Optional actual C++ compiler executable for the compatibility key (e.g. g++ or cl.exe).
    required: false
    default: ""
  fallback-scope:
    description: Deprecated. Incompatible scopes are never restored.
    required: false
    default: ""
outputs:
  cache-hit:
    description: Whether this run's primary key existed.
    value: ${{ steps.restore.outputs.cache-hit }}
  primary-key:
    description: Exact primary key for a later explicit trusted save.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  restore-seconds:
    description: Elapsed cache restore time, including setup.
    value: ${{ steps.timings.outputs.restore-seconds }}
runs:
  using: composite
  steps:
    - name: Resolve rolling compiler compatibility identity
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
        generation="$(node scripts/ci/cache-budget.mjs generation)"
        if [[ -n "${{ inputs.compiler }}" ]]; then
          compiler="${{ inputs.compiler }}"
        elif [[ "${{ inputs.scope }}" == emscripten* ]] && command -v em++ >/dev/null; then
          compiler=em++
        elif [[ "${{ inputs.scope }}" == android* ]] && [[ -n "${ANDROID_NDK_HOME:-}" ]] && [[ -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]]; then
          compiler="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
        elif command -v cl.exe >/dev/null; then
          compiler=cl.exe
        else
          compiler=c++
        fi
        if [[ "$compiler" == cl.exe ]]; then
          compiler_identity="$(cl.exe /Bv 2>&1 | head -n 1 || true)"
        else
          compiler_identity="$("$compiler" --version 2>&1 | head -n 1 || true)"
        fi
        test -n "$compiler_identity" || { echo "Cannot identify compiler: $compiler" >&2; exit 1; }
        compiler_hash="$(COMPILER_IDENTITY="$compiler_identity" node -p "require('node:crypto').createHash('sha256').update(process.env.COMPILER_IDENTITY).digest('hex').slice(0, 16)")"
        prefix="${{ runner.os }}-${{ runner.arch }}-ccache-v2-${{ inputs.scope }}-$compiler_hash-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake') }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$generation" >> "$GITHUB_OUTPUT"
    - name: Restore compiler outputs without publishing
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
    - name: Bound restored size and report cache observation
      id: timings
      shell: bash
      run: |
        set -euo pipefail
        ccache --max-size="${CCACHE_MAXSIZE:-256M}"
        ccache --cleanup
        # Restored ccache counters belong to prior runs. Measure this job only.
        ccache --zero-stats
        if [[ -n "${{ steps.restore.outputs.cache-matched-key }}" || "${{ steps.restore.outputs.cache-hit }}" == true ]]; then
          echo "NOVELTEA_CCACHE_RESTORED=true" >> "$GITHUB_ENV"
        else
          echo "NOVELTEA_CCACHE_RESTORED=false" >> "$GITHUB_ENV"
        fi
        elapsed="$(($(date +%s) - ${{ steps.identity.outputs.start }}))"
        echo "restore-seconds=$elapsed" >> "$GITHUB_OUTPUT"
        {
          echo "Compiler cache scope: \`${{ inputs.scope }}\`"
          echo "Exact hit: \`${{ steps.restore.outputs.cache-hit }}\`"
          echo "Matched key: \`${{ steps.restore.outputs.cache-matched-key }}\`"
          echo "Restore/setup: ${elapsed}s"
          du -sh "${CCACHE_DIR}" 2>/dev/null || true
        } >> "$GITHUB_STEP_SUMMARY"
