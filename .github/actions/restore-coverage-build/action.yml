name: Restore instrumented native coverage build
description: Set up an independent native suite runner and restore the exact-run test inputs.
inputs:
  artifact-id:
    description: Exact artifact ID output by the successful native producer.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Set up native test dependencies
      uses: ./.github/actions/setup-linux-native
      with:
        pkg-config: "true"
        autotools: "true"
        graphics: "true"
        xvfb: "true"
        extra-packages: libgl1-mesa-dri zstd
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false
    - name: Require producer artifact identity
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
    - name: Download exact-run native test build
      uses: actions/download-artifact@v7
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/noveltea-coverage-test-build
    - name: Authenticate identity and restore native test build
      shell: bash
      run: |
        bash scripts/ci/coverage-build-artifact.sh restore "$RUNNER_TEMP/noveltea-coverage-test-build"
        rm -rf "$RUNNER_TEMP/noveltea-coverage-test-build"
