name: Setup Linux vcpkg
description: Restore NovelTea's Linux vcpkg caches and bootstrap the repository-managed vcpkg checkout.
inputs:
  installed-dir:
    description: vcpkg installed tree to restore.
    required: true
  scope:
    description: Cache scope for the installed tree.
    required: true
  binary-scope:
    description: Writer scope for the vcpkg binary-package cache.
    required: true
  binary-fallback-scope:
    description: Optional compatible binary-package cache scope to seed this writer.
    required: false
    default: ""
  read-only:
    description: Restore matching pinned caches without publishing new generations.
    required: false
    default: "false"
  cache-prefix:
    description: ABI-environment cache prefix. Keep distinct compatibility environments isolated.
    required: false
    default: "ubuntu-24.04-x64"
runs:
  using: composite
  steps:
    - name: Cache vcpkg SDK
      if: inputs['read-only'] != 'true'
      uses: actions/cache@v5
      with:
        path: .cache/vcpkg
        key: ${{ inputs['cache-prefix'] }}-vcpkg-sdk-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-sdk-

    - name: Restore cache vcpkg sdk (read only)
      if: inputs['read-only'] == 'true'
      uses: actions/cache/restore@v5
      with:
        path: .cache/vcpkg
        key: ${{ inputs['cache-prefix'] }}-vcpkg-sdk-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-sdk-

    - name: Resolve bounded vcpkg cache window
      id: window
      shell: bash
      run: echo "week=$(node scripts/ci/cache-budget.mjs window)" >> "$GITHUB_OUTPUT"

    # Keep one immutable generation per week and source-pinned ABI configuration,
    # rather than uploading the complete binary-package cache on every new SHA.
    - name: Cache vcpkg binaries
      if: inputs['read-only'] != 'true'
      uses: actions/cache@v5
      with:
        path: .cache/vcpkg-binary
        key: ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}-${{ steps.window.outputs.week }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}-
          ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-
          ${{ inputs['binary-fallback-scope'] != '' && format('{0}-vcpkg-binary-{1}-', inputs['cache-prefix'], inputs['binary-fallback-scope']) || '' }}

    - name: Restore cache vcpkg binaries (read only)
      if: inputs['read-only'] == 'true'
      uses: actions/cache/restore@v5
      with:
        path: .cache/vcpkg-binary
        key: ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}-${{ steps.window.outputs.week }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}-
          ${{ inputs['cache-prefix'] }}-vcpkg-binary-${{ inputs['binary-scope'] }}-
          ${{ inputs['binary-fallback-scope'] != '' && format('{0}-vcpkg-binary-{1}-', inputs['cache-prefix'], inputs['binary-fallback-scope']) || '' }}

    - name: Cache vcpkg installed tree
      if: inputs['read-only'] != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ inputs['installed-dir'] }}
        key: ${{ inputs['cache-prefix'] }}-vcpkg-installed-${{ inputs.scope }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-installed-${{ inputs.scope }}-

    - name: Restore cache vcpkg installed tree (read only)
      if: inputs['read-only'] == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs['installed-dir'] }}
        key: ${{ inputs['cache-prefix'] }}-vcpkg-installed-${{ inputs.scope }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/NovelTeaSanitizers.cmake', 'cmake/vcpkg-triplets/**') }}
        restore-keys: |
          ${{ inputs['cache-prefix'] }}-vcpkg-installed-${{ inputs.scope }}-

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        set -euo pipefail
        node scripts/ci/pin-vcpkg.mjs
        "$VCPKG_ROOT/bootstrap-vcpkg.sh"
