name: Cache Budget Maintenance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Build, Coverage]
    types: [completed]
    branches: [master]

concurrency:
  group: cache-budget-maintenance
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  prune:
    name: Audit and prune superseded cache generations
    # Never execute cache maintenance for an untrusted PR or a foreign run.
    if: >-
      github.repository == 'Cruel/nt' && github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify safe-prune policy
        run: node --test tests/ci/cache_budget_tests.mjs
      - name: Audit and prune only superseded immutable compiler/dependency caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/cache-budget.mjs apply
