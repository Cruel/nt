name: Development toolchain snapshot

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]

# Publication and retention are one serialized writer, separate from cancellable Build runs.
concurrency:
  group: development-toolchain-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'Cruel/nt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          name: noveltea-host-cli-linux-x64
          path: build/snapshot-input/cli
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: noveltea-web-player-threads-release
          path: build/snapshot-input/player
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate snapshot inputs
        run: node .github/publish-development-snapshot.mjs --dry-run
      - name: Publish snapshot, promote current, and collect obsolete snapshots
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/publish-development-snapshot.mjs
