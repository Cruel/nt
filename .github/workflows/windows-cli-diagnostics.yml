name: Windows CLI Diagnostics

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Reproduction (certification runs the complete CLI certification once)'
        type: choice
        options:
          - empty-playback
          - feature-lab
          - certification
        default: empty-playback
      iterations:
        description: 'Cold/warm pairs, 1–50 (ignored for full certification)'
        type: number
        default: 20
      page_heap:
        description: 'Full page heap, or debugger-only comparison with normal allocation'
        type: choice
        options:
          - full
          - off
        default: full

permissions:
  contents: read
concurrency:
  group: windows-owner-lifecycle-diagnostics-${{ github.ref }}
  cancel-in-progress: false
env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 512M
  CCACHE_BASEDIR: ${{ github.workspace }}
  NOVELTEA_SHADERC_TOOLCHAIN_TAG: r6
  NOVELTEA_BUILD_IDENTITY: git:${{ github.sha }}
jobs:
  owner-lifecycle:
    name: Windows optimized CLI owner lifecycle stress (diagnostic only)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Windows compiler cache
        shell: pwsh
        run: choco install ccache --yes --no-progress
      - name: Cache compiled Windows GNU CLI dependencies
        uses: actions/cache/restore@v5
        with:
          path: .cache/vcpkg-binary
          key: windows-2025-x64-gnu-vcpkg-compiled-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
      - name: Bootstrap verified vcpkg revision
        shell: pwsh
        run: |
          node scripts/ci/pin-vcpkg.mjs
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MinGW GNU release compilers (not MSVC)
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          llvm-strip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prefetch checksum-verified Windows Lua
        shell: pwsh
        run: ./scripts/ci/prefetch-lua-source.ps1
      - name: Restore production CLI compiler objects
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: windows-gnu-cli-release
          compiler: g++
      - name: Compile actual GNU/AppleClang production CLI
        env:
          NOVELTEA_CLI_USE_CCACHE: "1"
        run: node scripts/ci/time-command.mjs windows-cli-gnu-build-and-link pnpm -C editor run noveltea:build
      - name: Certify Windows GNU CLI has no unshipped dynamic runtime DLLs
        shell: pwsh
        run: |
          foreach ($exe in @('build/cli/windows/noveltea.exe', 'build/cli/windows/noveltea-ui-test-runner.exe')) {
            $imports = & objdump -p $exe
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Windows PE imports: $exe" }
            $unsafe = @($imports | Select-String -Pattern 'DLL Name: (libgcc_s_.*|libstdc\+\+-6|libwinpthread-1)\.dll')
            if ($unsafe.Count) { throw "Unshipped GNU runtime DLL imports in $exe" }
          }
      - name: Repeat independent resident restart and pinned-worker cancellation
        shell: pwsh
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          $count = [int]$env:ITERATIONS
          if ($count -lt 1 -or $count -gt 50) { throw 'Iterations must be 1–50' }
          New-Item -ItemType Directory -Force build/owner-lifecycle-evidence | Out-Null
          for ($i = 1; $i -le $count; $i++) {
            Write-Host "=== Windows owner lifecycle $i of $count ==="
            $log = "build/owner-lifecycle-evidence/iteration-$i.log"
            node editor/scripts/certify-native-cli-owner-lifecycle.mjs build/cli/windows/noveltea.exe tests/projects/feature-lab --candidate *> $log
            $result = $LASTEXITCODE
            Get-Content $log
            if ($result -ne 0) { exit $result }
          }
      - name: Upload diagnostic executable and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-owner-lifecycle-diagnostics
          path: |
            build/owner-lifecycle-evidence
            build/cli/windows
          retention-days: 7
          if-no-files-found: error
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
