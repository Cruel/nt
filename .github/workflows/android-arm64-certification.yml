name: Android arm64 16 KiB certification

on:
  workflow_dispatch:

concurrency:
  group: android-arm64-certification
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_HOST_TRIPLET: x64-linux
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_NDK_VERSION: "28.2.13676358"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install host and Android tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ninja-build cmake curl zip unzip tar git autoconf automake autoconf-archive libtool bison flex
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" platform-tools emulator "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}" "system-images;android-${ANDROID_API_LEVEL};google_apis;arm64-v8a"
      - name: Resolve pinned build support files
        run: |
          mkdir -p android/app/libs build/tools
          curl -fL -o /tmp/sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-android.zip
          unzip -p /tmp/sdl.zip SDL3-3.4.10.aar > android/app/libs/SDL3-3.4.10.aar
          curl -fL -o build/tools/bundletool-all-1.18.1.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache vcpkg and embedded shaderc for host CLI
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
            build/linux-release/vcpkg_installed
            build/linux-release/_deps/noveltea_bgfx_shaderc_source-src
            build/linux-release/_deps/noveltea_bgfx_shaderc_source-build
            build/linux-release/tools/editor_tool/CMakeFiles/noveltea_bgfx_shaderc_embedded.dir
            build/linux-release/tools/editor_tool/libnoveltea_bgfx_shaderc_embedded.a
          key: ubuntu-24.04-x64-arm64-cert-shader-host-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**', 'cmake/NovelTeaEmbeddedShaderc.cmake', 'engine/src/render/embedded_bgfx_resources.hpp.in') }}
          restore-keys: |
            ubuntu-24.04-x64-arm64-cert-shader-host-

      - name: Build NovelTea host CLI
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"; fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          pnpm -C editor run noveltea:build

      - name: Build arm64 release player template source
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease -PnovelteaAbi=arm64-v8a -PnovelteaCli="${{ github.workspace }}/build/cli/linux/noveltea" -PbgfxShaderInclude="${{ github.workspace }}/build/linux-release/vcpkg_installed/x64-linux-noveltea/include/bgfx"
      - name: Package immutable arm64 release template
        run: cmake -DNOVELTEA_RELEASE_TAG=arm64-cert-${GITHUB_SHA} -DNOVELTEA_ANDROID_ABI=arm64-v8a -DNOVELTEA_ANDROID_FLAVOR=release -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake
      - name: Export two arm64 APK+AAB package revisions through public CLI
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          config="$RUNNER_TEMP/noveltea-arm64-export-config.json"
          pnpm android:export-config -- --output "$config"
          template="${{ github.workspace }}/dist/noveltea-player-template-arm64-cert-${GITHUB_SHA}-android-arm64-v8a-release.tar.gz"
          for revision in 1 2; do
            fixture_root="$RUNNER_TEMP/noveltea-arm64-fixture-v${revision}"
            output="$RUNNER_TEMP/arm64-v${revision}"
            pnpm -C editor run android:fixture -- --root "$fixture_root" --revision "$revision" --abi arm64-v8a --flavor release --artifact both
            export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry"
            "${{ github.workspace }}/build/cli/linux/noveltea" --json platform template install "$template" --force
            "${{ github.workspace }}/build/cli/linux/noveltea" --project "$fixture_root" --json platform export --profile canonical-android-release --output "$output" --config "$config" --allow-untrusted-template
          done
      - name: Derive debug-signed APK sets from exported AABs
        run: |
          for revision in arm64-v1 arm64-v2; do
            aab=$(find "${{ runner.temp }}/$revision" -name '*.aab' -print -quit)
            test -n "$aab"
            java -jar build/tools/bundletool-all-1.18.1.jar build-apks --bundle="$aab" --output="${{ runner.temp }}/$revision.apks" --mode=universal --overwrite
            unzip -p "${{ runner.temp }}/$revision.apks" universal.apk > "${{ runner.temp }}/$revision-universal.apk"
            test -s "${{ runner.temp }}/$revision-universal.apk"
            if unzip -l "$aab" | grep -Eiq 'sandbox|lua_demo|preview|editor[-_ ]ipc|recorder'; then
              echo 'Forbidden development surface found in exported AAB' >&2
              exit 1
            fi
          done
      - name: Launch AAB-derived APKs on the 16 KiB arm64 emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n noveltea-arm64 -k "system-images;android-${ANDROID_API_LEVEL};google_apis;arm64-v8a" --force
          "$ANDROID_HOME/emulator/emulator" -avd noveltea-arm64 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data >/tmp/noveltea-arm64-emulator.log 2>&1 &
          apk_v1="${{ runner.temp }}/arm64-v1-universal.apk"
          apk_v2="${{ runner.temp }}/arm64-v2-universal.apk"
          .github/android-emulator-smoke.sh "$apk_v1" "$apk_v2" org.noveltea.platformexportacceptance arm64-v8a
