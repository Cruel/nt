name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      preview_build_run_id:
        description: Completed exact-branch Build run ID (nonpublishing integration verification only)
        required: false
        type: string
      preview_extended_run_id:
        description: Completed exact-branch Extended run ID (nonpublishing integration verification only)
        required: false
        type: string

concurrency:
  # VERSION is resolved after checkout, so serialize release qualification/publication globally.
  group: noveltea-release
  cancel-in-progress: false

env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  # Every release job must build the exact commit that triggered the workflow; branch refs can advance between jobs.
  RELEASE_REF: ${{ github.sha }}
  EMSDK_VERSION: 6.0.0
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 256M
  CCACHE_BASEDIR: ${{ github.workspace }}
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_NDK_VERSION: "28.2.13676358"
  NOVELTEA_BUILD_IDENTITY: git:${{ github.sha }}
  # This branch-only acceptance mode is never authoritative for publishing.
  NOVELTEA_RELEASE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/build-release-refactor-641' && 'true' || 'false' }}
  PREVIEW_BUILD_RUN_ID: ${{ inputs.preview_build_run_id || '' }}
  PREVIEW_EXTENDED_RUN_ID: ${{ inputs.preview_extended_run_id || '' }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    outputs:
      release_tag: ${{ steps.release-identity.outputs.release_tag }}
      build_run_id: ${{ steps.release-authority.outputs.build_run_id }}
      extended_run_id: ${{ steps.release-authority.outputs.extended_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify the shared Build/Release candidate and cache contracts
        run: node --test tests/ci/release_candidate_tests.mjs tests/ci/cache_budget_tests.mjs tests/ci/vcpkg_pin_tests.mjs
      - name: Resolve and validate release identity
        id: release-identity
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=("$GITHUB_REF_NAME")
          fi
          release_tag="$(node .github/validate-release-version.mjs "${args[@]}")"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Authorize exact-SHA master Build artifacts and completed Extended Qualification
        id: release-authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-promotion.mjs authorize "$GITHUB_SHA"
      - name: Preserve independent release authorization evidence
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-authority
          path: build/release-authority.json
          if-no-files-found: error

  shader-assets:
    name: Restore Build-qualified Linux release CLI and shader inputs
    runs-on: ubuntu-24.04
    needs: release-metadata
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact selected master commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Restore the Debian ABI-floor native CLI, not the Ubuntu development CLI
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: linux-release-cli-x64
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Audit the exact Build CLI's Debian compatibility floor
        run: |
          cmake -DNOVELTEA_BINARY="$PWD/build/cli/linux/noveltea" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.36 -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.30 \
            -P cmake/AuditNovelTeaLinuxCompatibility.cmake
      - name: Download source-locked Build shader outputs
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build/generated-assets/shaders
      - name: Publish shader inputs for independent Release packaging qualification
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/generated-assets/shaders
          if-no-files-found: error
      - name: Publish the identical native exporter for independent Release platform smoke
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/cli/linux
          if-no-files-found: error
      - name: Publish the exact release-native CLI for other Release checks
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux
          if-no-files-found: error
      - name: Stage the verified Linux standalone CLI without compilation
        run: |
          bundle="noveltea-${RELEASE_TAG}-linux-x64"
          mkdir -p "build/release-cli/${bundle}"
          cp -a build/cli/linux/. "build/release-cli/${bundle}/"
          rm -f "build/release-cli/${bundle}/noveltea-candidate.json" \
            "build/release-cli/${bundle}/candidate-generated-contracts.json"
          tar -C build/release-cli -czf "build/release-cli/${bundle}.tar.gz" "${bundle}"
      - name: Attest exact standalone CLI release bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
      - name: Upload Linux standalone CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-linux-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
          if-no-files-found: error

  windows-cli:
    name: Assemble independently verified standalone Windows GNU CLI
    runs-on: windows-2025
    needs: release-metadata
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Restore and promote exact Windows GNU CLI Build candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: windows-release-cli-x64
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Recheck PE imports and static-runtime distribution contract
        shell: pwsh
        run: |
          foreach ($exe in @("build/cli/windows/noveltea.exe", "build/cli/windows/noveltea-ui-test-runner.exe")) {
            $imports = & objdump -p $exe
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Windows PE imports: $exe" }
            $unsafe = @($imports | Select-String -Pattern 'DLL Name: (libgcc_s_.*|libstdc\+\+-6|libwinpthread-1)\.dll' -CaseSensitive:$false)
            if ($unsafe.Count -ne 0) { throw "$exe requires unshipped GNU runtime DLLs: $($unsafe -join ', ')" }
          }
      - name: Assemble the exact released Windows CLI archive
        shell: pwsh
        run: |
          $bundle = "noveltea-$env:RELEASE_TAG-windows-x64"
          $bundleRoot = Join-Path "build/release-cli" $bundle
          New-Item -ItemType Directory -Force $bundleRoot | Out-Null
          Copy-Item build/cli/windows/* $bundleRoot -Recurse -Exclude noveltea-candidate.json,candidate-generated-contracts.json
          Compress-Archive -Path $bundleRoot -DestinationPath "build/release-cli/$bundle.zip"
      - name: Upload the source-locked native CLI for separate platform export checks
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-windows-x64
          path: build/cli/windows
          if-no-files-found: error
      - name: Attest exact Windows standalone CLI release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.zip
      - name: Upload Windows standalone CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-windows-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.zip
          if-no-files-found: error

  macos-cli:
    name: Restore and recheck exact macOS arm64 standalone CLI
    runs-on: macos-26
    needs: release-metadata
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Restore and verify exact Build-qualified macOS native authoring CLI
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: macos-release-cli-arm64
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Verify native macOS CLI deployment target
        shell: bash
        run: |
          set -euo pipefail
          minos="$(otool -l build/cli/macos/noveltea | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; next } build && $1 == "minos" { print $2; exit }')"
          test "$minos" = '14.0'
      - name: Upload exact macOS CLI for independent distribution certification
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-macos-arm64
          path: build/cli/macos
          if-no-files-found: error
      - name: Reuse the same compiled native C++ macOS export executable
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-native-cli-macos-arm64
          path: build/cli/macos
          if-no-files-found: error

  desktop-hosts:
    name: Package and certify exact Build desktop player (${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      NOVELTEA_CANONICAL_BUILD_FLAVOR: release
      NOVELTEA_NATIVE_TEST_BUILD_FLAVOR: release
      NOVELTEA_CANONICAL_PLAYER_VARIANT: ${{ matrix.variant == 'devtools' && 'devtools' || 'standard' }}
      NOVELTEA_NATIVE_TEST_PLAYER_VARIANT: ${{ matrix.variant == 'devtools' && 'devtools' || 'standard' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            preset: linux-release
            variant: release
            candidate: linux-player-x64-release
            cli_candidate: linux-release-cli-x64
          - platform: windows
            arch: x64
            runner: windows-2025
            preset: windows-release
            variant: release
            candidate: windows-player-x64-release
            cli_candidate: windows-release-cli-x64
          - platform: macos
            arch: arm64
            runner: macos-26
            preset: macos-release
            variant: release
            candidate: macos-player-arm64-release
            cli_candidate: macos-release-cli-arm64
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            preset: linux-release-devtools
            variant: devtools
            candidate: linux-player-x64-devtools
            cli_candidate: linux-release-cli-x64
          - platform: windows
            arch: x64
            runner: windows-2025
            preset: windows-release-devtools
            variant: devtools
            candidate: windows-player-x64-devtools
            cli_candidate: windows-release-cli-x64
          - platform: macos
            arch: arm64
            runner: macos-26
            preset: macos-release-devtools
            variant: devtools
            candidate: macos-player-arm64-devtools
            cli_candidate: macos-release-cli-arm64

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install Linux release smoke dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/setup-linux-native
        with:
          graphics: "true"
          xvfb: "true"
          extra-packages: weston libgl1-mesa-dri x11-utils strace
      - name: Install root JS dependencies for native export acceptance
        uses: pnpm/action-setup@v6
      - name: Set up Node.js for platform certification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pinned workspace packages
        run: pnpm install --frozen-lockfile
      - name: Restore and authenticate exact platform player candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: ${{ matrix.candidate }}
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore and authenticate exact platform CLI candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: ${{ matrix.cli_candidate }}
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore exact Windows Build tooling bridge for independent Editor export tests
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v7
        with:
          name: noveltea-build-windows-tooling-bridge-${{ matrix.variant }}
          run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build/${{ matrix.preset }}/tools/editor_tool
      - name: Restore shared Build shader inputs for standalone fixture staging
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/generated-assets/shaders
      - name: Stage fixture runtime assets without compiling a second player
        shell: pwsh
        run: |
          cmake -DNOVELTEA_SHADER_ASSET_SOURCE="${{ github.workspace }}/build/generated-assets" `
            -DNOVELTEA_RUNTIME_ASSET_ROOT="${{ github.workspace }}/build/${{ matrix.preset }}/runtime-assets" `
            -DNOVELTEA_PROJECT_ASSET_SOURCE="${{ github.workspace }}/apps/sandbox/assets" `
            -DNOVELTEA_STAGE_STAMP="${{ github.workspace }}/build/${{ matrix.preset }}/runtime-assets.stamp" `
            -P cmake/StageNovelTeaAssets.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble tagged archive, exact detached symbols, notices and SBOM from immutable Build tree
        env:
          GH_TOKEN: ${{ github.token }}
          NOVELTEA_BUILD_RUN_ID: ${{ needs.release-metadata.outputs.build_run_id }}
        run: node scripts/ci/promote-release-template.mjs ${{ matrix.candidate }} "$RELEASE_TAG"
        shell: bash
      - name: Enable Windows PE inspection with the pinned MSVC developer environment
        if: matrix.platform == 'windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Audit actual release platform dependency closure
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/build/package/noveltea-player-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}/bin/noveltea-player${{ matrix.platform == 'windows' && '.exe' || '' }}"
          $report = "${{ github.workspace }}/dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}.json"
          $extra = @()
          if ("${{ matrix.platform }}" -eq "linux") {
            $extra = @("-DNOVELTEA_MAX_GLIBC_VERSION=2.28", "-DNOVELTEA_REQUIRE_STATIC_GNU_CXX_RUNTIME=ON")
          }
          cmake "-DNOVELTEA_PLAYER=$exe" "-DNOVELTEA_AUDIT_REPORT=$report" @extra -P cmake/AuditNovelTeaPlayerDependencies.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload macOS player template for independent certification
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-macos-player-build-${{ matrix.variant }}
          path: |
            dist/*
            build/${{ matrix.preset }}/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          if-no-files-found: error

      - name: Install appimagetool for Linux export smoke
        if: matrix.platform == 'linux'
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Export and launch real Linux portable and AppImage players with native C++ CLI
        if: matrix.platform == 'linux'
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/linux/noveltea-ui-test-runner
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NOVELTEA_PLAYER_HEADLESS_ERRORS: '1'
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-${{ matrix.variant }}-fixture-evidence.json
        run: |
          xvfb-run -a python3 tests/native_cli/linux_release_smoke.py \
            "$PWD/build/cli/linux/noveltea" \
            "$PWD/dist/noveltea-player-template-${RELEASE_TAG}-linux-x64-${{ matrix.variant }}.tar.gz" \
            "$PWD" \
            "$PWD/dist/noveltea-native-linux-release-certification.json"

      - name: Finalize and launch Windows portable export
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: editor
        env:
          NOVELTEA_WINDOWS_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-${{ matrix.variant }}.zip
          NOVELTEA_WINDOWS_RUNTIME_PACKAGE: ${{ github.workspace }}\build\${{ matrix.preset }}\runtime-assets\project\projects\runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: windows
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-${{ matrix.variant }}.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}\noveltea-canonical-windows
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-${{ matrix.variant }}-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-${{ matrix.variant }}-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\noveltea-native-smoke-windows-x64-${{ matrix.variant }}.json
          NOVELTEA_PLAYER_HEADLESS_ERRORS: "1"
          NOVELTEA_NATIVE_TOOL_BRIDGE: ${{ github.workspace }}\build\${{ matrix.preset }}\tools\editor_tool\noveltea-tooling-bridge.exe
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}\build\cli\windows\noveltea-ui-test-runner.exe
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Install pinned software OpenGL for Windows player launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-software-opengl.ps1

      - name: Export and launch real Windows player through native C++ CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/windows/noveltea-ui-test-runner.exe
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-windows-${{ matrix.variant }}-fixture-evidence.json
        run: |
          python tests/native_cli/windows_release_smoke.py `
            "${{ github.workspace }}/build/cli/windows/noveltea.exe" `
            "${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-${{ matrix.variant }}.zip" `
            "${{ github.workspace }}" `
            "${{ github.workspace }}/dist/noveltea-native-windows-release-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Finalize and launch Linux portable export on X11
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/linux/noveltea-ui-test-runner
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-${{ matrix.variant }}.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/${{ matrix.preset }}/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          NOVELTEA_CANONICAL_EXPORT_TARGET: linux
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-${{ matrix.variant }}.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-linux
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-${{ matrix.variant }}-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-${{ matrix.variant }}-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-x11-${{ matrix.variant }}.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/linux/noveltea
        run: xvfb-run -a pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Finalize and launch Linux portable export on Wayland
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-${{ matrix.variant }}.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/${{ matrix.preset }}/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          SDL_VIDEODRIVER: wayland
          WAYLAND_DISPLAY: wayland-noveltea
          XDG_RUNTIME_DIR: ${{ runner.temp }}/noveltea-weston-runtime
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-wayland-${{ matrix.variant }}.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/linux/noveltea
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Generate desktop platform certification report
        if: matrix.platform != 'macos'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/noveltea-player-template-*-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}.*" | Where-Object { $_.Name -notmatch 'symbols' } | Select-Object -First 1
          if (!$archive) { throw "Player template archive was not found" }
          $results = "dist/noveltea-certification-results-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}.json"
          $collector = @(
            "scripts/platform-certification-results.mjs",
            "--archive", $archive.FullName,
            "--canonical-evidence", "dist/canonical-${{ matrix.platform }}-${{ matrix.variant }}-fixture-evidence.json",
            "--dependency-audit", "dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}.json",
            "--output", $results
          )
          if ("${{ matrix.platform }}" -eq "windows") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-windows-x64-${{ matrix.variant }}.json")
          } elseif ("${{ matrix.platform }}" -eq "linux") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-linux-x11-${{ matrix.variant }}.json", "--smoke", "dist/noveltea-native-smoke-linux-wayland-${{ matrix.variant }}.json")
          } elseif ("${{ matrix.platform }}" -eq "macos") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-macos-arm64-${{ matrix.variant }}.json")
          }
          & node @collector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = "dist/noveltea-platform-certification-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}.json"
          node scripts/platform-certification.mjs create --archive $archive.FullName --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results $results --output $report --source-revision "$env:GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive $archive.FullName --report $report

      - name: Attest player template archives
        if: matrix.platform != 'macos'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Upload desktop host release artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-host-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}-dist
          path: dist/*
          if-no-files-found: error

  macos-certify:
    name: Certify macOS player and CLI (arm64-${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            preset: macos-release
          - variant: devtools
            preset: macos-release-devtools
    runs-on: macos-26
    needs: [release-metadata, desktop-hosts, macos-cli]
    # A Windows/Linux desktop failure must not suppress independent macOS
    # certification; the macOS player artifact is required below.
    if: ${{ !cancelled() && needs.macos-cli.result == 'success' }}
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      NOVELTEA_NATIVE_TEST_BUILD_FLAVOR: release
      NOVELTEA_NATIVE_TEST_PLAYER_VARIANT: ${{ matrix.variant == 'devtools' && 'devtools' || 'standard' }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download macOS player template and runtime fixture
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-macos-player-build-${{ matrix.variant }}
          path: .
      - name: Download macOS host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-macos-arm64
          path: build/cli/macos
      - name: Download native C++ macOS export certification CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-macos-arm64
          path: build/cli/macos-native
      - name: Verify macOS build artifacts and executable bits
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-${{ matrix.variant }}.tar.gz"
          test -f build/${{ matrix.preset }}/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          test -f dist/noveltea-dependency-audit-macos-arm64-${{ matrix.variant }}.json
          test -f build/cli/macos/noveltea
          test -f build/cli/macos-native/noveltea
          test -f build/cli/macos-native/noveltea-ui-test-runner
          test -f build/cli/macos-native/assets/system/fonts/LiberationSans.ttf
          chmod +x build/cli/macos/noveltea build/cli/macos/noveltea-ui-test-runner
          chmod +x build/cli/macos-native/noveltea build/cli/macos-native/noveltea-ui-test-runner
      - name: Finalize and launch macOS app bundle export
        working-directory: editor
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/macos-native/noveltea-ui-test-runner
          NOVELTEA_MACOS_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-${{ matrix.variant }}.tar.gz
          NOVELTEA_MACOS_RUNTIME_PACKAGE: ${{ github.workspace }}/build/${{ matrix.preset }}/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: macos
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-${{ matrix.variant }}.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-macos
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/Platform Export Acceptance.app
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-macos-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-macos-arm64.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/macos/noveltea
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts
      - name: Certify native C++ macOS exporter with release template and actual app launch
        shell: bash
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/macos-native/noveltea-ui-test-runner
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-macos-fixture-evidence.json
        run: |
          set -euo pipefail
          python3 tests/native_cli/macos_release_smoke.py \
            "$PWD/build/cli/macos-native/noveltea" \
            "$PWD/dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-${{ matrix.variant }}.tar.gz" \
            "$PWD" \
            "$PWD/dist/noveltea-native-macos-release-certification.json"
      - name: Upload native macOS export/launch qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-native-macos-export-${{ env.RELEASE_TAG }}-${{ matrix.variant }}
          path: dist/noveltea-native-macos-release-certification.json
          if-no-files-found: warn
      - name: Generate macOS platform certification report
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-${{ matrix.variant }}.tar.gz"
          results="dist/noveltea-certification-results-macos-arm64-${{ matrix.variant }}.json"
          node scripts/platform-certification-results.mjs \
            --archive "$archive" \
            --canonical-evidence dist/canonical-macos-fixture-evidence.json \
            --dependency-audit dist/noveltea-dependency-audit-macos-arm64-${{ matrix.variant }}.json \
            --smoke dist/noveltea-native-smoke-macos-arm64.json \
            --output "$results"
          report="dist/noveltea-platform-certification-macos-arm64-${{ matrix.variant }}.json"
          node scripts/platform-certification.mjs create \
            --archive "$archive" \
            --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts \
            --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"
      - name: Attest macOS player template archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*
      - name: Upload macOS desktop host release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-host-macos-arm64-${{ matrix.variant }}-dist
          path: dist/*
          if-no-files-found: error

  web:
    name: Certify exact Build-derived Web release and developer variants
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Restore and verify canonical threaded Web release candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: web-player-threads-release
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore and verify canonical single-threaded Web release candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: web-player-no-threads-release
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore and verify optimized threaded Web developer candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: web-player-threads-devtools
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore and verify optimized single-threaded Web developer candidate
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: web-player-no-threads-devtools
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Attach versioned metadata without recompiling or changing WebAssembly bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NOVELTEA_BUILD_RUN_ID: ${{ needs.release-metadata.outputs.build_run_id }}
        run: |
          set -euo pipefail
          for id in web-player-threads-release web-player-no-threads-release \
            web-player-threads-devtools web-player-no-threads-devtools; do
            node scripts/ci/promote-release-template.mjs "$id" "$RELEASE_TAG"
          done
      - name: Independently recheck production WASM and scripting boundaries
        run: |
          set -euo pipefail
          for kind in web-wasm32-threads-release web-wasm32-release \
            web-wasm32-threads-devtools web-wasm32-devtools; do
            stage="build/package/noveltea-player-$kind"
            test -f "$stage/player.wasm"
            ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)' "$stage/player.js"
          done
      - name: Attest exact Web template archives after source-locked assembly
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-player-template-*-web-wasm32*.zip
      - name: Restore exact Build-generated Editor preview from the same source SHA
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-editor-preview
          run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build/web-editor-preview/apps/editor_preview

      - name: Install editor test dependencies for certification fixture
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for certification fixture
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner

      - name: Download direct native C++ platform export CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/native-export-cli-linux

      - name: Make direct native platform export CLI executable
        run: chmod +x build/native-export-cli-linux/noveltea

      - name: Validate maintained platform export acceptance fixture
        run: pnpm -C editor exec vp test run src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Certify native CLI Web publication with real release templates
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/linux/noveltea-ui-test-runner
        run: |
          threads_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print -quit)
          single_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-release.zip' -print -quit)
          test -n "$threads_archive" && test -n "$single_archive"
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$threads_archive" "$PWD" "$PWD/dist/native-web-threads" threaded /
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-nested-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$threads_archive" "$PWD" "$PWD/dist/native-web-threads-nested" threaded /nested/game/
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-single-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$single_archive" "$PWD" "$PWD/dist/native-web-single" single /
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-single-nested-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$single_archive" "$PWD" "$PWD/dist/native-web-single-nested" single /nested/game/

      - name: Boot and verify native CLI Web exports in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm web:certify-export \
            --case threads-root:/:dist/native-web-threads \
            --case threads-nested:/nested/game/:dist/native-web-threads-nested \
            --output dist/noveltea-native-web-browser-certification-threads.json
          pnpm web:certify-export \
            --case single-root:/:dist/native-web-single \
            --case single-nested:/nested/game/:dist/native-web-single-nested \
            --output dist/noveltea-native-web-browser-certification-single.json

      - name: Generate Web platform certification reports
        run: |
          threads_browser=dist/noveltea-native-web-browser-certification-threads.json
          single_browser=dist/noveltea-native-web-browser-certification-single.json

          threads_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print -quit)
          test -n "$threads_archive"
          threads_results=dist/noveltea-certification-results-web-wasm32-threads-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$threads_archive" \
            --canonical-evidence dist/canonical-web-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-nested-fixture-evidence.json \
            --web-browser "$threads_browser" \
            --web-case-prefix threads \
            --output "$threads_results"
          threads_report=dist/noveltea-platform-certification-web-wasm32-threads-release.json
          node scripts/platform-certification.mjs create --archive "$threads_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$threads_results" --output "$threads_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$threads_archive" --report "$threads_report"

          single_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-release.zip' -print -quit)
          test -n "$single_archive"
          single_results=dist/noveltea-certification-results-web-wasm32-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$single_archive" \
            --canonical-evidence dist/canonical-web-single-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-single-nested-fixture-evidence.json \
            --web-browser "$single_browser" \
            --web-case-prefix single \
            --output "$single_results"
          single_report=dist/noveltea-platform-certification-web-wasm32-release.json
          node scripts/platform-certification.mjs create --archive "$single_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$single_results" --output "$single_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$single_archive" --report "$single_report"

      - name: Canonical Web developer-template export coverage
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/linux/noveltea-ui-test-runner
          NOVELTEA_CANONICAL_BUILD_FLAVOR: release
          NOVELTEA_CANONICAL_PLAYER_VARIANT: devtools
          NOVELTEA_CANONICAL_EXPORT_TARGET: web
        run: |
          set -euo pipefail
          for kind in threads single; do
            if [[ "$kind" == threads ]]; then
              suffix="-threads"
              threaded=true
              label="web-dev"
            else
              suffix=""
              threaded=false
              label="web-single-dev"
            fi
            for placement in root nested; do
              extra_base="/"
              nested_suffix=""
              if [[ "$placement" == nested ]]; then
                extra_base="/nested/game/"
                nested_suffix="-nested"
              fi
              mode=single
              if [[ "$threaded" == true ]]; then mode=threaded; fi
              NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-${label}${nested_suffix}-fixture-evidence.json" \
                python3 tests/native_cli/web_release_smoke.py \
                  "$PWD/build/cli/linux/noveltea" \
                  "$PWD/dist/noveltea-player-template-${RELEASE_TAG}-web-wasm32${suffix}-devtools.zip" \
                  "$PWD" "$PWD/dist/canonical-${label}${nested_suffix}-export" "$mode" "$extra_base"
            done
          done

      - name: Certify finalized Web developer exports in Chromium
        run: |
          pnpm web:certify-export \
            --case threads-root:/:dist/canonical-web-dev-export \
            --case threads-nested:/nested/game/:dist/canonical-web-dev-nested-export \
            --output dist/noveltea-web-browser-certification-threads-devtools.json
          pnpm web:certify-export \
            --case single-root:/:dist/canonical-web-single-dev-export \
            --case single-nested:/nested/game/:dist/canonical-web-single-dev-nested-export \
            --output dist/noveltea-web-browser-certification-single-devtools.json

      - name: Generate developer Web platform certification reports
        run: |
          set -euo pipefail
          for kind in threads single; do
            if [[ "$kind" == threads ]]; then
              variant="web-wasm32-threads-devtools"
              evidence="web-dev"
              prefix=threads
            else
              variant="web-wasm32-devtools"
              evidence="web-single-dev"
              prefix=single
            fi
            archive="dist/noveltea-player-template-${RELEASE_TAG}-${variant}.zip"
            results="dist/noveltea-certification-results-${variant}.json"
            report="dist/noveltea-platform-certification-${variant}.json"
            node scripts/platform-certification-results.mjs \
              --archive "$archive" \
              --canonical-evidence "dist/canonical-${evidence}-fixture-evidence.json" \
              --nested-canonical-evidence "dist/canonical-${evidence}-nested-fixture-evidence.json" \
              --web-browser "dist/noveltea-web-browser-certification-${prefix}-devtools.json" \
              --web-case-prefix "$prefix" --output "$results"
            node scripts/platform-certification.mjs create --archive "$archive" \
              --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts \
              --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
            node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"
          done

      - name: Upload Web release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload Web editor preview
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview
          if-no-files-found: error

  release-examples:
    name: Release examples
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets, web]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Resolve pinned examples revision
        id: examples-pin
        shell: bash
        run: |
          revision="$(tr -d '\n' < examples/noveltea-examples.revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout exact public examples revision
        uses: actions/checkout@v6
        with:
          repository: Cruel/noveltea-examples
          ref: ${{ steps.examples-pin.outputs.revision }}
          path: build/noveltea-examples
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Linux runtime dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Download exact release host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/release-examples-toolchain

      - name: Download exact release Web player
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-release-dist
          path: build/release-examples-toolchain/player

      - name: Qualify examples against exact release
        shell: bash
        run: |
          chmod +x \
            build/release-examples-toolchain/noveltea \
            build/release-examples-toolchain/noveltea-ui-test-runner \
            build/release-examples-toolchain/tools/ffmpeg/bin/ffmpeg
          player_template="build/release-examples-toolchain/player/noveltea-player-template-${RELEASE_TAG}-web-wasm32-threads-release.zip"
          player_descriptor="build/release-examples-toolchain/player/web-wasm32-threads-release.template.json"
          test -f "$player_template"
          test -f "$player_descriptor"
          node scripts/qualify-examples.mjs \
            --examples-root build/noveltea-examples \
            --nt-revision "$GITHUB_SHA" \
            --cli build/release-examples-toolchain/noveltea \
            --player-template "$player_template" \
            --player-descriptor "$player_descriptor" \
            --player-engine-version "$RELEASE_TAG" \
            --player-build-id "${RELEASE_TAG}-web-wasm32-threads-release" \
            --output build/release-examples

      - name: Package release examples
        shell: bash
        run: |
          mkdir -p dist
          archive="noveltea-examples-${RELEASE_TAG}.zip"
          (cd build/release-examples && zip -q -r "../../dist/$archive" .)
          node -e '
            const fs = require("fs");
            const catalog = require("./build/release-examples/catalog.json");
            const value = {
              format: "noveltea.release-examples",
              version: 1,
              releaseTag: process.env.RELEASE_TAG,
              ntRevision: process.env.GITHUB_SHA,
              examplesRevision: catalog.source.revision,
              playerBuildId: catalog.toolchain.player.buildId,
              archive: `noveltea-examples-${process.env.RELEASE_TAG}.zip`,
            };
            fs.writeFileSync(`dist/noveltea-examples-${process.env.RELEASE_TAG}.json`, `${JSON.stringify(value, null, 2)}\n`);
          '

      - name: Upload release examples
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-examples-release-dist
          path: |
            dist/noveltea-examples-${{ env.RELEASE_TAG }}.zip
            dist/noveltea-examples-${{ env.RELEASE_TAG }}.json
          if-no-files-found: error

  android:
    name: Package and export exact Build-qualified Android ABI variants
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Reclaim disk for Android package/export smoke
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Set up Java for Android artifact export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Linux Android launch and inspection dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          autotools: "true"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Restore pinned SDK inputs without saving additional compiler caches
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-android-sdk-android${{ env.ANDROID_API_LEVEL }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}
      - name: Install exactly pinned Android SDK packages needed for export qualification
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Restore authenticated optimized ARM64 standard native package
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: android-player-arm64-release
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore authenticated optimized ARM64 developer native package
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: android-player-arm64-devtools
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Restore independently verified x86_64 Debug ABI-only diagnostic template
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: android-player-x64-debug
          stage: diagnose
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Assemble versioned Android release/developer/diagnostic archives without compiling native code
        env:
          GH_TOKEN: ${{ github.token }}
          NOVELTEA_BUILD_RUN_ID: ${{ needs.release-metadata.outputs.build_run_id }}
        run: |
          set -euo pipefail
          for id in android-player-arm64-release android-player-arm64-devtools android-player-x64-debug; do
            node scripts/ci/promote-release-template.mjs "$id" "$RELEASE_TAG"
          done
      - name: Recover exact checksum-pinned bundletool from the verified Android template
        run: |
          mkdir -p build/tools
          cp build/package/android-arm64-v8a-release/source/android/tools/bundletool-1.18.1.jar \
            build/tools/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -
      - name: Reverify exact native load alignment for every released Android ABI
        run: |
          readelf="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          node scripts/verify-android-load-alignment.mjs \
            --readelf "$readelf" \
            --root build/package/android-arm64-v8a-release/source/android/prebuilt-native \
            --root build/package/android-arm64-v8a-devtools/source/android/prebuilt-native \
            --root build/package/android-x86_64-debug/source/android/prebuilt-native \
            --output dist/noveltea-android-load-alignment.json

      - name: Install pnpm and editor dependencies
        uses: pnpm/action-setup@v6

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner

      - name: Download direct native C++ Android export CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/native-export-cli-linux

      - name: Make direct native Android export CLI executable
        run: chmod +x build/native-export-cli-linux/noveltea

      - name: Export and inspect release APK plus AAB through public CLI
        env:
          NOVELTEA_ANDROID_ABI: arm64-v8a
          NOVELTEA_ANDROID_FLAVOR: release
          NOVELTEA_ANDROID_ARTIFACT: both
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-arm64-v8a-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-release
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-release-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-arm64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-release-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-release-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi arm64-v8a --flavor release --artifact both
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-arm64"
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-release.tar.gz" --force
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-release \
            --output "${{ github.workspace }}/dist/android-release-fixture" \
            --config "$config" \
            --allow-untrusted-template \
            --allow-localization-warnings
          node scripts/native-canonical-export-evidence.mjs \
            --archive "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-release.tar.gz" \
            --project "$fixture_root" \
            --export "${{ github.workspace }}/dist/android-release-fixture" \
            --evidence "${{ github.workspace }}/dist/canonical-android-arm64-fixture-evidence.json"

      - name: Export and inspect x86_64 debug APK through public CLI
        env:
          NOVELTEA_ANDROID_ABI: x86_64
          NOVELTEA_ANDROID_FLAVOR: debug
          NOVELTEA_ANDROID_ARTIFACT: apk
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-x86_64-debug.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-debug
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-debug-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-x86_64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-debug-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-debug-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi x86_64 --flavor debug --artifact apk
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-x64"
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-x86_64-debug.tar.gz" --force
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-debug \
            --output "${{ github.workspace }}/dist/android-debug-fixture" \
            --config "$config" \
            --allow-untrusted-template \
            --allow-localization-warnings
          node scripts/native-canonical-export-evidence.mjs \
            --archive "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-x86_64-debug.tar.gz" \
            --project "$fixture_root" \
            --export "${{ github.workspace }}/dist/android-debug-fixture" \
            --evidence "${{ github.workspace }}/dist/canonical-android-x86_64-fixture-evidence.json"

      - name: Export and inspect optimized ARM64 developer APK plus AAB through public CLI
        env:
          NOVELTEA_ANDROID_ABI: arm64-v8a
          NOVELTEA_ANDROID_FLAVOR: release
          NOVELTEA_CANONICAL_PLAYER_VARIANT: devtools
          NOVELTEA_ANDROID_ARTIFACT: both
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-arm64-v8a-devtools.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-arm64-devtools
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-arm64-devtools-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-arm64-devtools-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-arm64-devtools-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-arm64-devtools-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi arm64-v8a --flavor release --variant devtools --artifact both
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-arm64-devtools"
          "${{ github.workspace }}/build/cli/linux/noveltea" --json platform template install \
            "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-devtools.tar.gz" --force
          "${{ github.workspace }}/build/cli/linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-release \
            --output "${{ github.workspace }}/dist/android-arm64-devtools-fixture" \
            --config "$config" --allow-untrusted-template --allow-localization-warnings
          node scripts/native-canonical-export-evidence.mjs \
            --archive "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-devtools.tar.gz" \
            --project "$fixture_root" \
            --export "${{ github.workspace }}/dist/android-arm64-devtools-fixture" \
            --evidence "${{ github.workspace }}/dist/canonical-android-arm64-devtools-fixture-evidence.json"

      - name: Generate Android platform certification reports
        run: |
          alignment=dist/noveltea-android-load-alignment.json

          archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-arm64-v8a-release.tar.gz' -print -quit)
          export_report=$(find dist/android-release-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$archive" && test -n "$export_report"
          results=dist/noveltea-certification-results-android-arm64-v8a-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$archive" \
            --canonical-evidence dist/canonical-android-arm64-fixture-evidence.json \
            --android-report "$export_report" \
            --android-alignment "$alignment" \
            --output "$results"
          report=dist/noveltea-platform-certification-android-arm64-v8a-release.json
          node scripts/platform-certification.mjs create --archive "$archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"

          debug_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-x86_64-debug.tar.gz' -print -quit)
          debug_export_report=$(find dist/android-debug-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$debug_archive" && test -n "$debug_export_report"
          debug_results=dist/noveltea-certification-results-android-x86_64-debug.json
          node scripts/platform-certification-results.mjs \
            --archive "$debug_archive" \
            --canonical-evidence dist/canonical-android-x86_64-fixture-evidence.json \
            --android-report "$debug_export_report" \
            --android-alignment "$alignment" \
            --output "$debug_results"
          debug_report=dist/noveltea-platform-certification-android-x86_64-debug.json
          node scripts/platform-certification.mjs create --archive "$debug_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$debug_results" --output "$debug_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$debug_archive" --report "$debug_report"

          arm_dev_archive=dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-devtools.tar.gz
          arm_dev_export_report=$(find dist/android-arm64-devtools-fixture -type f -name '*-export-report.json' -print -quit)
          test -f "$arm_dev_archive" && test -n "$arm_dev_export_report"
          arm_dev_results=dist/noveltea-certification-results-android-arm64-v8a-devtools.json
          node scripts/platform-certification-results.mjs \
            --archive "$arm_dev_archive" \
            --canonical-evidence dist/canonical-android-arm64-devtools-fixture-evidence.json \
            --android-report "$arm_dev_export_report" \
            --android-alignment "$alignment" \
            --output "$arm_dev_results"
          arm_dev_report=dist/noveltea-platform-certification-android-arm64-v8a-devtools.json
          node scripts/platform-certification.mjs create --archive "$arm_dev_archive" \
            --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts \
            --results "$arm_dev_results" --output "$arm_dev_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$arm_dev_archive" --report "$arm_dev_report"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-release-dist
          path: dist/*
          if-no-files-found: error

  desktop-editor:
    name: Independently certify exact Build Editor installers (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, web, desktop-hosts, windows-cli, macos-cli]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            candidate: linux-editor-x64
          - platform: windows
            arch: x64
            runner: windows-2025
            candidate: windows-editor-x64
          - platform: macos
            arch: arm64
            runner: macos-26
            candidate: macos-editor-arm64
    steps:
      - name: Checkout exact immutable release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js for installer verification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install Linux package verification/installation utilities
        if: matrix.platform == 'linux'
        uses: ./.github/actions/setup-linux-native
        with:
          extra-packages: rpm fakeroot
      - name: Restore verified original Editor installers from master Build
        uses: ./.github/actions/restore-release-candidate
        with:
          candidate: ${{ matrix.candidate }}
          build-run-id: ${{ needs.release-metadata.outputs.build_run_id }}
          token: ${{ github.token }}
      - name: Rehydrate and verify Build package pointer without modifying signed installers
        env:
          GH_TOKEN: ${{ github.token }}
          NOVELTEA_BUILD_RUN_ID: ${{ needs.release-metadata.outputs.build_run_id }}
        shell: pwsh
        run: |
          node scripts/ci/promote-editor-candidate.mjs ${{ matrix.candidate }} "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and stage exact original installers under public Release names
        shell: pwsh
        env:
          NOVELTEA_RELEASE_PLATFORM: ${{ matrix.platform }}
          NOVELTEA_RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          cmake -DNOVELTEA_PACKAGE_KIND=desktop-editor -DNOVELTEA_RELEASE_TAG="$env:RELEASE_TAG" -P cmake/PackageNovelTeaRelease.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, invoke and remove exact Linux DEB and RPM from the trusted candidate
        if: matrix.platform == 'linux'
        run: .github/linux-editor-installer-smoke.sh
      - name: Upload exact Build-qualified Editor release installers
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-editor-${{ matrix.platform }}-${{ matrix.arch }}-release-dist
          path: dist/*
          if-no-files-found: error
      - name: Attest original Editor installer bytes under their release names
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-editor-*

  release-inventory:
    name: Qualify exact release inventory
    runs-on: ubuntu-24.04
    needs:
      [release-metadata, desktop-hosts, macos-certify, web, android, desktop-editor, windows-cli, release-examples]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download independently authorized Build and Extended run identities
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-authority
          path: build
      - name: Revalidate the original selected Build and qualification receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-promotion.mjs verify "$GITHUB_SHA"

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: noveltea-*-dist
          path: dist
          merge-multiple: true

      - name: Generate player template registry index
        run: node .github/generate-template-registry.mjs dist "$RELEASE_TAG"

      - name: Enforce platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Generate public release manifest
        run: node .github/generate-public-release-manifest.mjs dist "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Generate checksums
        run: .github/package-release.sh checksums "$RELEASE_TAG"

      - name: Verify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG"

      - name: Upload qualified release
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-metadata, release-inventory]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download pinned Build/Extended authorization evidence
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-authority
          path: build
      - name: Fail closed if exact source Build or Extended evidence has changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-promotion.mjs verify "$GITHUB_SHA"

      - name: Download qualified release
        uses: actions/download-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist

      - name: Reverify platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Reverify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG" release-assets.txt

      - name: Attest complete player template set
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Initialize public distribution repository when empty
        env:
          GH_TOKEN: ${{ secrets.NOVELTEA_RELEASES_TOKEN }}
        shell: bash
        run: |
          if ! gh api repos/Cruel/noveltea-releases/git/ref/heads/main >/dev/null 2>&1; then
            content="$(printf '%s\n' '# NovelTea Releases' '' 'Public binary distribution for NovelTea. Product downloads are linked from https://noveltea.dev/download/.' | base64 -w0)"
            gh api --method PUT repos/Cruel/noveltea-releases/contents/README.md \
              -f message='Initialize NovelTea release distribution' \
              -f content="$content" >/dev/null
          fi

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ secrets.NOVELTEA_RELEASES_TOKEN }}
        run: |
          mapfile -t assets < release-assets.txt
          for index in "${!assets[@]}"; do
            assets[$index]="dist/${assets[$index]}"
          done
          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --repo Cruel/noveltea-releases
            --title "NovelTea $RELEASE_TAG"
            --notes "Qualified NovelTea release $RELEASE_TAG. Download metadata is available in noveltea-release-manifest.json."
          )
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
