name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # VERSION is resolved after checkout, so serialize release qualification/publication globally.
  group: noveltea-release
  cancel-in-progress: false

env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  # Every release job must build the exact commit that triggered the workflow; branch refs can advance between jobs.
  RELEASE_REF: ${{ github.sha }}
  EMSDK_VERSION: 6.0.0
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_BASEDIR: ${{ github.workspace }}
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_NDK_VERSION: "28.2.13676358"
  NOVELTEA_BUILD_IDENTITY: git:${{ github.sha }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release-identity.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Resolve and validate release identity
        id: release-identity
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=("$GITHUB_REF_NAME")
          fi
          release_tag="$(node .github/validate-release-version.mjs "${args[@]}")"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  shader-assets:
    name: Shader assets and Linux authoring CLI
    runs-on: ubuntu-latest
    container:
      image: node:24.18.0-bookworm@sha256:4e9cb555d708e0829c9d93e5eeae9dfab0617b832ca436a690680e0fca735ef5
    defaults:
      run:
        shell: bash
    needs: release-metadata
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          clang: "true"
          extra-packages: zstd python3-venv

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Verify pinned Node.js
        run: test "$(node --version)" = "v24.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up vcpkg
        uses: ./.github/actions/setup-linux-vcpkg
        with:
          installed-dir: build/linux-authoring-release/vcpkg_installed
          scope: linux-authoring-release
          binary-scope: linux-authoring-release
          cache-prefix: debian-12-glibc-2.36-x64

      - name: Cache embedded shaderc build outputs
        uses: actions/cache@v5
        with:
          path: |
            build/linux-authoring-release/_deps/bgfx.cmake-src
            build/linux-authoring-release/_deps/bgfx.cmake-build
            build/linux-authoring-release/tools/editor_tool/CMakeFiles/noveltea_bgfx_shaderc_embedded.dir
            build/linux-authoring-release/tools/editor_tool/libnoveltea_bgfx_shaderc_embedded.a
          key: debian-12-glibc-2.36-x64-release-shader-host-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**', 'cmake/NovelTeaEmbeddedShaderc.cmake', 'cmake/patch-bimg-texturec-entry.cmake', 'engine/src/render/embedded_bgfx_resources.hpp.in') }}
          restore-keys: |
            debian-12-glibc-2.36-x64-release-shader-host-

      - name: Build NovelTea host CLI
        run: pnpm -C editor run noveltea:build

      - name: Build renderer required by native production certification
        run: pnpm -C editor exec vp build

      - name: Certify NovelTea host CLI
        run: pnpm -C editor run noveltea:certify

      - name: Build direct C++ Linux platform-export CLI
        run: cmake --build --preset linux-authoring-release --target noveltea-native-cli

      - name: Upload direct C++ Linux platform-export CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/linux-authoring-release/tools/editor_tool/native-cli
          if-no-files-found: error

      - name: Audit Linux authoring ABI floor
        run: |
          cmake \
            -DNOVELTEA_BINARY="$PWD/build/cli/linux/noveltea" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.36 \
            -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.30 \
            -P cmake/AuditNovelTeaLinuxCompatibility.cmake

      - name: Compile and verify shader assets
        run: |
          cmake -DNOVELTEA_CLI_EXECUTABLE="$PWD/build/cli/linux/noveltea" -DNOVELTEA_SHADER_SOURCE_DIR="$PWD/engine/shaders/bgfx" -DNOVELTEA_SHADER_OUTPUT_ROOT="$PWD/build/generated-assets/shaders" '-DNOVELTEA_SHADER_VARIANTS=glsl-330;essl-300;metal' -DNOVELTEA_BGFX_SHADER_INCLUDE_DIR="$PWD/build/linux-authoring-release/_deps/bgfx.cmake-src/bgfx/src" -P "$PWD/cmake/CompileNovelTeaShaders.cmake"
          cmake -DNOVELTEA_VERIFY_ONLY=ON -DNOVELTEA_SHADER_OUTPUT_ROOT="$PWD/build/generated-assets/shaders" '-DNOVELTEA_SHADER_VARIANTS=glsl-330;essl-300;metal' -P "$PWD/cmake/CompileNovelTeaShaders.cmake"

      - name: Upload shader assets
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/generated-assets/shaders
          if-no-files-found: error

      - name: Upload NovelTea host CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux
          if-no-files-found: error

      - name: Stage standalone NovelTea CLI release asset
        run: |
          bundle="noveltea-${RELEASE_TAG}-linux-x64"
          mkdir -p "build/release-cli/${bundle}"
          cp -a build/cli/linux/. "build/release-cli/${bundle}/"
          tar -C build/release-cli -czf "build/release-cli/${bundle}.tar.gz" "${bundle}"
          rm -rf "build/release-cli/${bundle}"

      - name: Attest standalone NovelTea CLI
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64.tar.gz

      - name: Upload standalone NovelTea CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-linux-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
          if-no-files-found: error

  windows-cli-build:
    name: Build standalone CLI (windows-x64)
    runs-on: windows-2025
    needs: release-metadata
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache vcpkg SDK and binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: windows-x64-cli-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: windows-x64-cli-vcpkg-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT/.git")) { git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT" }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
      - name: Verify Windows GNU CLI tools
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          llvm-strip --version
      - name: Build Windows CLI
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
        run: pnpm -C editor run noveltea:build
      - name: Upload Windows CLI build
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-windows-cli-build
          path: build/cli/windows
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows CLI certification shader headers
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-windows-cli-certification-shader-headers
          path: build/windows-cli-gnu/_deps/bgfx.cmake-src/bgfx/src
          if-no-files-found: error
          retention-days: 1

  windows-cli:
    name: Certify standalone CLI (windows-x64)
    runs-on: windows-2025
    needs: [release-metadata, windows-cli-build]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Windows CLI build
        uses: actions/download-artifact@v7
        with:
          name: noveltea-windows-cli-build
          path: build/cli/windows
      - name: Download Windows CLI certification shader headers
        uses: actions/download-artifact@v7
        with:
          name: noveltea-windows-cli-certification-shader-headers
          path: build/windows-cli-gnu/_deps/bgfx.cmake-src/bgfx/src
      - name: Set up PE inspection environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify PE inspection tool
        shell: pwsh
        run: Get-Command dumpbin | Out-Null
      - name: Build native production bundles
        run: pnpm -C editor exec vp pack
      - name: Build renderer required by native production certification
        run: pnpm -C editor exec vp build
      - name: Certify Windows CLI
        run: pnpm -C editor run noveltea:certify
      - name: Stage standalone Windows CLI
        shell: pwsh
        run: |
          $bundle = "noveltea-$env:RELEASE_TAG-windows-x64"
          $bundleRoot = Join-Path "build/release-cli" $bundle
          New-Item -ItemType Directory -Force $bundleRoot | Out-Null
          Copy-Item build/cli/windows/* $bundleRoot -Recurse
          Compress-Archive -Path $bundleRoot -DestinationPath "build/release-cli/$bundle.zip"
          Remove-Item $bundleRoot -Recurse -Force
      - name: Upload Windows host CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-windows-x64
          path: build/cli/windows
          if-no-files-found: error
      - name: Attest standalone Windows CLI
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.zip
      - name: Upload standalone Windows CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-windows-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.zip
          if-no-files-found: error

  macos-cli:
    name: Build macOS host CLI (arm64)
    runs-on: macos-26
    needs: release-metadata
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install macOS build tools
        run: brew install ninja ccache
      - name: Cache shared vcpkg SDK and binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: macos-26-arm64-vcpkg-common-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            macos-26-arm64-vcpkg-common-
      - name: Cache macOS authoring vcpkg installed
        uses: actions/cache@v5
        with:
          path: build/macos-authoring-release/vcpkg_installed
          key: macos-26-arm64-vcpkg-installed-macos-authoring-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake', 'cmake/vcpkg-triplets/arm64-osx-authoring-noveltea.cmake') }}
          restore-keys: |
            macos-26-arm64-vcpkg-installed-macos-authoring-release-
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [[ ! -d "$VCPKG_ROOT/.git" ]]; then git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"; fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Cache macOS authoring compiler objects
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macOS-arm64-ccache-macos-authoring-release-${{ github.sha }}
          restore-keys: |
            macOS-arm64-ccache-macos-authoring-release-
            macOS-arm64-ccache-
      - name: Build NovelTea macOS host CLI
        run: pnpm -C editor run noveltea:build
      # The release executable is now the same direct C++ exporter certified
      # at the native CMake target. No second, scripting-backed host is built.
      - name: Audit macOS host CLI deployment target
        shell: bash
        run: |
          set -euo pipefail
          minos="$(otool -l build/cli/macos/noveltea | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; next } build && $1 == "minos" { print $2; exit }')"
          test "$minos" = "14.0"
          native_minos="$(otool -l build/macos-authoring-release/tools/editor_tool/native-cli/noveltea | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; next } build && $1 == "minos" { print $2; exit }')"
          test "$native_minos" = "14.0"
      - name: Upload NovelTea macOS host CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-macos-arm64
          path: build/cli/macos
          if-no-files-found: error
      - name: Upload native C++ macOS export certification CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-native-cli-macos-arm64
          path: build/macos-authoring-release/tools/editor_tool/native-cli/
          if-no-files-found: error

  desktop-hosts:
    name: Desktop hosts (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            preset: linux-release
            triplet: x64-linux-noveltea
            host_triplet: x64-linux
          - platform: windows
            arch: x64
            runner: windows-2025
            preset: windows-release
            triplet: x64-windows-static-noveltea
            host_triplet: x64-windows
          - platform: macos
            arch: arm64
            runner: macos-26
            preset: macos-release
            triplet: arm64-osx-noveltea
            host_triplet: arm64-osx

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Linux native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          xvfb: "true"
          extra-packages: weston libgl1-mesa-dri x11-utils strace

      # The Windows native CLI generates its Agent Kit during CMake build and
      # imports editor TypeScript packages. Dependencies must precede CMake.
      - name: Set up pnpm for desktop export and native tooling
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for desktop export and native tooling
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install root workspace dependencies for desktop export and native tooling
        run: pnpm install --frozen-lockfile

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Cache Linux player compatibility build state
        if: matrix.platform == 'linux'
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg-player-glibc228
            .cache/vcpkg-binary-player-glibc228
            build/linux-release/vcpkg_installed
          key: manylinux-2.28-x64-player-${{ hashFiles('.github/containers/linux-player-glibc228.Dockerfile', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/x64-linux-noveltea.cmake', 'cmake/NovelTeaLua.cmake') }}-${{ github.sha }}
          restore-keys: |
            manylinux-2.28-x64-player-${{ hashFiles('.github/containers/linux-player-glibc228.Dockerfile', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/x64-linux-noveltea.cmake', 'cmake/NovelTeaLua.cmake') }}-
            manylinux-2.28-x64-player-

      - name: Cache shared vcpkg SDK and binaries
        if: runner.os != 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-common-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-common-

      - name: Cache vcpkg installed
        if: runner.os != 'Linux'
        uses: actions/cache@v5
        with:
          path: build/${{ matrix.preset }}/vcpkg_installed
          key: ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-installed-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-installed-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT/.git")) {
            git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          }
          if ("${{ runner.os }}" -eq "Windows") {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh"
          }

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore NovelTea vcpkg root after MSVC setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_ROOT=${{ github.workspace }}/.cache/vcpkg'

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Download NovelTea host CLI
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        if: matrix.platform == 'linux'
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner

      - name: Download direct C++ Linux platform-export CLI
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/native-export-cli-linux

      - name: Make direct C++ Linux platform-export CLI executable
        if: matrix.platform == 'linux'
        run: chmod +x build/native-export-cli-linux/noveltea build/native-export-cli-linux/noveltea-ui-test-runner

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ matrix.preset }}-

      - name: Build pinned glibc 2.28 Linux player environment
        if: matrix.platform == 'linux'
        shell: bash
        run: docker build --tag noveltea-linux-player-glibc228 --file .github/containers/linux-player-glibc228.Dockerfile .

      - name: Build Linux player against glibc 2.28
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/container-home .cache/vcpkg-player-glibc228 .cache/vcpkg-binary-player-glibc228
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/workspace/.cache/container-home \
            --env VCPKG_ROOT=/workspace/.cache/vcpkg-player-glibc228 \
            --env 'VCPKG_BINARY_SOURCES=clear;files,/workspace/.cache/vcpkg-binary-player-glibc228,readwrite' \
            --env CCACHE_DIR=/workspace/.cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env CCACHE_BASEDIR=/workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            noveltea-linux-player-glibc228 \
            bash -lc '
              set -euo pipefail
              if [[ ! -d "$VCPKG_ROOT/.git" ]]; then
                git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
              fi
              "$VCPKG_ROOT/bootstrap-vcpkg.sh"
              cmake --preset linux-release -G Ninja \
                -DNOVELTEA_BUILD_HOST_TOOLS=OFF \
                -DNOVELTEA_COMPILE_SHADERS=OFF \
                -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT=/workspace/build/prebuilt-shader-assets \
                -DNOVELTEA_PROJECT_ASSET_SOURCE=/workspace/apps/sandbox/assets \
                -DNOVELTEA_CMAKE_STAGE_RUNTIME_ASSETS=ON \
                -DBUILD_TESTING=OFF \
                -DVCPKG_TARGET_TRIPLET=x64-linux-noveltea \
                -DVCPKG_HOST_TRIPLET=x64-linux \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake --build --preset linux-release --target noveltea-player cxx-policy
              closure="$(ldd build/linux-release/apps/player/noveltea-player)"
              printf "%s\n" "$closure"
              if grep -q "not found" <<<"$closure"; then
                echo "glibc 2.28 compatibility environment cannot load the player dependency closure" >&2
                exit 1
              fi
            '

      - name: Build non-Linux desktop player
        if: matrix.platform != 'linux'
        shell: pwsh
        run: |
          $ccacheArgs = @()
          if ("${{ runner.os }}" -ne "Windows") { $ccacheArgs = @("-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache") }
          $hostTools = if ("${{ matrix.platform }}" -eq "windows") { "ON" } else { "OFF" }
          cmake --preset ${{ matrix.preset }} -G Ninja `
            -DNOVELTEA_BUILD_HOST_TOOLS=$hostTools `
            -DNOVELTEA_COMPILE_SHADERS=OFF `
            -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" `
            -DNOVELTEA_PROJECT_ASSET_SOURCE="${{ github.workspace }}/apps/sandbox/assets" `
            -DNOVELTEA_CMAKE_STAGE_RUNTIME_ASSETS=ON `
            -DBUILD_TESTING=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} `
            @ccacheArgs
          $targets = @("noveltea-player", "cxx-policy")
          if ("${{ matrix.platform }}" -eq "windows") { $targets += "noveltea-tooling-bridge"; $targets += "noveltea-native-cli" }
          cmake --build --preset ${{ matrix.preset }} --target @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SDL3 X11 backend is present
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sdl_archive="${{ github.workspace }}/build/linux-release/vcpkg_installed/x64-linux-noveltea/lib/libSDL3.a"
          test -f "$sdl_archive"
          if ! ar t "$sdl_archive" | grep -q '^SDL_x11video\.c\.o$'; then
            echo "SDL3 archive is missing its X11 backend despite the x11 vcpkg feature." >&2
            ar t "$sdl_archive" | grep -Ei 'x11|xcb' || true
            exit 1
          fi

      - name: Verify production player excludes developer components
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/check-native-devtools-symbols.sh build/linux-release/apps/player/noveltea-player off

      - name: Audit Linux player dependency closure
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake \
            "-DNOVELTEA_PLAYER=${{ github.workspace }}/build/${{ matrix.preset }}/apps/player/noveltea-player" \
            "-DNOVELTEA_AUDIT_REPORT=${{ github.workspace }}/dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            "-DNOVELTEA_MAX_GLIBC_VERSION=2.28" \
            -DNOVELTEA_REQUIRE_STATIC_GNU_CXX_RUNTIME=ON \
            -P cmake/AuditNovelTeaPlayerDependencies.cmake

      - name: Audit non-Linux player dependency closure
        if: matrix.platform != 'linux'
        shell: pwsh
        run: cmake -DNOVELTEA_PLAYER="${{ github.workspace }}/build/${{ matrix.preset }}/apps/player/noveltea-player${{ matrix.platform == 'windows' && '.exe' || '' }}" -DNOVELTEA_AUDIT_REPORT="${{ github.workspace }}/dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json" -P cmake/AuditNovelTeaPlayerDependencies.cmake

      - name: Package player template and symbols
        shell: pwsh
        run: cmake -DNOVELTEA_TEMPLATE_PRESET=${{ matrix.preset }} -DNOVELTEA_TEMPLATE_PLATFORM=${{ matrix.platform }} -DNOVELTEA_TEMPLATE_ARCH=${{ matrix.arch }} -DNOVELTEA_RELEASE_TAG="$env:RELEASE_TAG" -P cmake/PackageNovelTeaPlayerTemplate.cmake

      - name: Upload macOS player template for independent certification
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-macos-player-build
          path: |
            dist/*
            build/macos-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          if-no-files-found: error

      - name: Install appimagetool for Linux export smoke
        if: matrix.platform == 'linux'
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Export and launch real Linux portable and AppImage players with native C++ CLI
        if: matrix.platform == 'linux'
        env:
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NOVELTEA_PLAYER_HEADLESS_ERRORS: '1'
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-fixture-evidence.json
        run: |
          xvfb-run -a python3 tests/native_cli/linux_release_smoke.py \
            "$PWD/build/native-export-cli-linux/noveltea" \
            "$PWD/dist/noveltea-player-template-${RELEASE_TAG}-linux-x64-release.tar.gz" \
            "$PWD" \
            "$PWD/dist/noveltea-native-linux-release-certification.json"

      - name: Finalize and launch Windows portable export
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: editor
        env:
          NOVELTEA_WINDOWS_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-release.zip
          NOVELTEA_WINDOWS_RUNTIME_PACKAGE: ${{ github.workspace }}\build\windows-release\runtime-assets\project\projects\runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: windows
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}\noveltea-canonical-windows
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\noveltea-native-smoke-windows-x64.json
          NOVELTEA_PLAYER_HEADLESS_ERRORS: "1"
          NOVELTEA_NATIVE_TOOL_BRIDGE: ${{ github.workspace }}\build\windows-release\tools\editor_tool\noveltea-tooling-bridge.exe
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Install pinned software OpenGL for Windows player launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-software-opengl.ps1

      - name: Export and launch real Windows player through native C++ CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-windows-fixture-evidence.json
        run: |
          python tests/native_cli/windows_release_smoke.py `
            "${{ github.workspace }}/build/windows-release/tools/editor_tool/native-cli/noveltea.exe" `
            "${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-release.zip" `
            "${{ github.workspace }}" `
            "${{ github.workspace }}/dist/noveltea-native-windows-release-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Finalize and launch Linux portable export on X11
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/linux-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          NOVELTEA_CANONICAL_EXPORT_TARGET: linux
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-linux
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-x11.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/linux/noveltea
        run: xvfb-run -a pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Finalize and launch Linux portable export on Wayland
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/linux-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          SDL_VIDEODRIVER: wayland
          WAYLAND_DISPLAY: wayland-noveltea
          XDG_RUNTIME_DIR: ${{ runner.temp }}/noveltea-weston-runtime
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-wayland.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/linux/noveltea
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Generate desktop platform certification report
        if: matrix.platform != 'macos'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/noveltea-player-template-*-${{ matrix.platform }}-${{ matrix.arch }}-release.*" | Where-Object { $_.Name -notmatch 'symbols' } | Select-Object -First 1
          if (!$archive) { throw "Player template archive was not found" }
          $results = "dist/noveltea-certification-results-${{ matrix.platform }}-${{ matrix.arch }}-release.json"
          $collector = @(
            "scripts/platform-certification-results.mjs",
            "--archive", $archive.FullName,
            "--canonical-evidence", "dist/canonical-${{ matrix.platform }}-fixture-evidence.json",
            "--dependency-audit", "dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json",
            "--output", $results
          )
          if ("${{ matrix.platform }}" -eq "windows") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-windows-x64.json")
          } elseif ("${{ matrix.platform }}" -eq "linux") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-linux-x11.json", "--smoke", "dist/noveltea-native-smoke-linux-wayland.json")
          } elseif ("${{ matrix.platform }}" -eq "macos") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-macos-arm64.json")
          }
          & node @collector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = "dist/noveltea-platform-certification-${{ matrix.platform }}-${{ matrix.arch }}-release.json"
          node scripts/platform-certification.mjs create --archive $archive.FullName --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results $results --output $report --source-revision "$env:GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive $archive.FullName --report $report

      - name: Attest player template archives
        if: matrix.platform != 'macos'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Upload desktop host release artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-host-${{ matrix.platform }}-${{ matrix.arch }}-release-dist
          path: dist/*
          if-no-files-found: error

  macos-certify:
    name: Certify macOS player and CLI (arm64)
    runs-on: macos-26
    needs: [release-metadata, desktop-hosts, macos-cli]
    # A Windows/Linux desktop failure must not suppress independent macOS
    # certification; the macOS player artifact is required below.
    if: ${{ !cancelled() && needs.macos-cli.result == 'success' }}
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download macOS player template and runtime fixture
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-macos-player-build
          path: .
      - name: Download macOS host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-macos-arm64
          path: build/cli/macos
      - name: Download native C++ macOS export certification CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-macos-arm64
          path: build/cli/macos-native
      - name: Verify macOS build artifacts and executable bits
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-release.tar.gz"
          test -f build/macos-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          test -f dist/noveltea-dependency-audit-macos-arm64.json
          test -f build/cli/macos/noveltea
          test -f build/cli/macos-native/noveltea
          test -f build/cli/macos-native/noveltea-ui-test-runner
          test -f build/cli/macos-native/assets/system/fonts/LiberationSans.ttf
          chmod +x build/cli/macos/noveltea build/cli/macos/noveltea-ui-test-runner
          chmod +x build/cli/macos-native/noveltea build/cli/macos-native/noveltea-ui-test-runner
      - name: Finalize and launch macOS app bundle export
        working-directory: editor
        env:
          NOVELTEA_MACOS_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-release.tar.gz
          NOVELTEA_MACOS_RUNTIME_PACKAGE: ${{ github.workspace }}/build/macos-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: macos
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-macos
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/Platform Export Acceptance.app
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-macos-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-macos-arm64.json
          NOVELTEA_CLI: ${{ github.workspace }}/build/cli/macos/noveltea
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts
      - name: Certify native C++ macOS exporter with release template and actual app launch
        shell: bash
        env:
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-macos-fixture-evidence.json
        run: |
          set -euo pipefail
          python3 tests/native_cli/macos_release_smoke.py \
            "$PWD/build/cli/macos-native/noveltea" \
            "$PWD/dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-release.tar.gz" \
            "$PWD" \
            "$PWD/dist/noveltea-native-macos-release-certification.json"
      - name: Upload native macOS export/launch qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-native-macos-export-${{ env.RELEASE_TAG }}
          path: dist/noveltea-native-macos-release-certification.json
          if-no-files-found: warn
      - name: Generate macOS platform certification report
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/noveltea-player-template-${RELEASE_TAG}-macos-arm64-release.tar.gz"
          results="dist/noveltea-certification-results-macos-arm64-release.json"
          node scripts/platform-certification-results.mjs \
            --archive "$archive" \
            --canonical-evidence dist/canonical-macos-fixture-evidence.json \
            --dependency-audit dist/noveltea-dependency-audit-macos-arm64.json \
            --smoke dist/noveltea-native-smoke-macos-arm64.json \
            --output "$results"
          report="dist/noveltea-platform-certification-macos-arm64-release.json"
          node scripts/platform-certification.mjs create \
            --archive "$archive" \
            --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts \
            --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"
      - name: Attest macOS player template archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*
      - name: Upload macOS desktop host release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-host-macos-arm64-release-dist
          path: dist/*
          if-no-files-found: error

  web:
    name: Web release
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${{ github.workspace }}/.cache/emsdk"
          cd "${{ github.workspace }}/.cache/emsdk"
          ./emsdk install $EMSDK_VERSION
          ./emsdk activate $EMSDK_VERSION

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-emscripten-${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-emscripten-${{ env.EMSDK_VERSION }}-

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Build Web release
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake --preset web-release -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-release --target noveltea-player
          node scripts/check-web-release-wasm.mjs build/web-release/apps/player/player.wasm build/web-release/apps/player/player.wasm.debug.wasm
          cmake --build --preset web-release --target cxx-policy
          emcmake cmake --preset web-release-no-threads -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-release-no-threads --target noveltea-player
          emcmake cmake --preset web-editor-preview -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-editor-preview --target noveltea-editor-preview

      - name: Verify release player surface
        run: |
          ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)' build/web-release/apps/player/player.js
          ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)|MessageChannel' build/web-release-no-threads/apps/player/player.js

      - name: Package Web player template
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          cmake -DNOVELTEA_TEMPLATE_PRESET=web-release -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake
          cmake -DNOVELTEA_TEMPLATE_PRESET=web-release-no-threads -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake

      - name: Attest Web player template
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*-web-wasm32*-release.zip

      - name: Install editor test dependencies for certification fixture
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for certification fixture
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner

      - name: Download direct native C++ platform export CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/native-export-cli-linux

      - name: Make direct native platform export CLI executable
        run: chmod +x build/native-export-cli-linux/noveltea

      - name: Validate maintained platform export acceptance fixture
        run: pnpm -C editor exec vp test run src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Certify native CLI Web publication with real release templates
        run: |
          threads_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print -quit)
          single_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-release.zip' -print -quit)
          test -n "$threads_archive" && test -n "$single_archive"
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$threads_archive" "$PWD" "$PWD/dist/native-web-threads" threaded /
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-nested-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$threads_archive" "$PWD" "$PWD/dist/native-web-threads-nested" threaded /nested/game/
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-single-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$single_archive" "$PWD" "$PWD/dist/native-web-single" single /
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT="$PWD/dist/canonical-web-single-nested-fixture-evidence.json" \
          python3 tests/native_cli/web_release_smoke.py \
            build/native-export-cli-linux/noveltea "$single_archive" "$PWD" "$PWD/dist/native-web-single-nested" single /nested/game/

      - name: Boot and verify native CLI Web exports in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm web:certify-export \
            --case threads-root:/:dist/native-web-threads \
            --case threads-nested:/nested/game/:dist/native-web-threads-nested \
            --output dist/noveltea-native-web-browser-certification-threads.json
          pnpm web:certify-export \
            --case single-root:/:dist/native-web-single \
            --case single-nested:/nested/game/:dist/native-web-single-nested \
            --output dist/noveltea-native-web-browser-certification-single.json

      - name: Generate Web platform certification reports
        run: |
          threads_browser=dist/noveltea-native-web-browser-certification-threads.json
          single_browser=dist/noveltea-native-web-browser-certification-single.json

          threads_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print -quit)
          test -n "$threads_archive"
          threads_results=dist/noveltea-certification-results-web-wasm32-threads-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$threads_archive" \
            --canonical-evidence dist/canonical-web-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-nested-fixture-evidence.json \
            --web-browser "$threads_browser" \
            --web-case-prefix threads \
            --output "$threads_results"
          threads_report=dist/noveltea-platform-certification-web-wasm32-threads-release.json
          node scripts/platform-certification.mjs create --archive "$threads_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$threads_results" --output "$threads_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$threads_archive" --report "$threads_report"

          single_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-release.zip' -print -quit)
          test -n "$single_archive"
          single_results=dist/noveltea-certification-results-web-wasm32-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$single_archive" \
            --canonical-evidence dist/canonical-web-single-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-single-nested-fixture-evidence.json \
            --web-browser "$single_browser" \
            --web-case-prefix single \
            --output "$single_results"
          single_report=dist/noveltea-platform-certification-web-wasm32-release.json
          node scripts/platform-certification.mjs create --archive "$single_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$single_results" --output "$single_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$single_archive" --report "$single_report"

      - name: Upload Web release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload Web editor preview
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview
          if-no-files-found: error

  release-examples:
    name: Release examples
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets, web]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Resolve pinned examples revision
        id: examples-pin
        shell: bash
        run: |
          revision="$(tr -d '\n' < examples/noveltea-examples.revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout exact public examples revision
        uses: actions/checkout@v6
        with:
          repository: Cruel/noveltea-examples
          ref: ${{ steps.examples-pin.outputs.revision }}
          path: build/noveltea-examples
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Linux runtime dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Download exact release host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/release-examples-toolchain

      - name: Download exact release Web player
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-release-dist
          path: build/release-examples-toolchain/player

      - name: Qualify examples against exact release
        shell: bash
        run: |
          chmod +x \
            build/release-examples-toolchain/noveltea \
            build/release-examples-toolchain/noveltea-ui-test-runner \
            build/release-examples-toolchain/tools/ffmpeg/bin/ffmpeg
          player_template="build/release-examples-toolchain/player/noveltea-player-template-${RELEASE_TAG}-web-wasm32-threads-release.zip"
          player_descriptor="build/release-examples-toolchain/player/web-wasm32-threads-release.template.json"
          test -f "$player_template"
          test -f "$player_descriptor"
          node scripts/qualify-examples.mjs \
            --examples-root build/noveltea-examples \
            --nt-revision "$GITHUB_SHA" \
            --cli build/release-examples-toolchain/noveltea \
            --player-template "$player_template" \
            --player-descriptor "$player_descriptor" \
            --player-engine-version "$RELEASE_TAG" \
            --player-build-id "${RELEASE_TAG}-web-wasm32-threads-release" \
            --output build/release-examples

      - name: Package release examples
        shell: bash
        run: |
          mkdir -p dist
          archive="noveltea-examples-${RELEASE_TAG}.zip"
          (cd build/release-examples && zip -q -r "../../dist/$archive" .)
          node -e '
            const fs = require("fs");
            const catalog = require("./build/release-examples/catalog.json");
            const value = {
              format: "noveltea.release-examples",
              version: 1,
              releaseTag: process.env.RELEASE_TAG,
              ntRevision: process.env.GITHUB_SHA,
              examplesRevision: catalog.source.revision,
              playerBuildId: catalog.toolchain.player.buildId,
              archive: `noveltea-examples-${process.env.RELEASE_TAG}.zip`,
            };
            fs.writeFileSync(`dist/noveltea-examples-${process.env.RELEASE_TAG}.json`, `${JSON.stringify(value, null, 2)}\n`);
          '

      - name: Upload release examples
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-examples-release-dist
          path: |
            dist/noveltea-examples-${{ env.RELEASE_TAG }}.zip
            dist/noveltea-examples-${{ env.RELEASE_TAG }}.json
          if-no-files-found: error

  android:
    name: Android release
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-android-sdk-android${{ env.ANDROID_API_LEVEL }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Download SDL3 Android AAR
        run: |
          mkdir -p android/app/libs .cache/sdl3-android
          curl -L -o .cache/sdl3-android/SDL3-devel-3.4.10-android.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-android.zip
          unzip -p .cache/sdl3-android/SDL3-devel-3.4.10-android.zip SDL3-3.4.10.aar > android/app/libs/SDL3-3.4.10.aar

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-android-ndk${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-ndk${{ env.ANDROID_NDK_VERSION }}-

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Build unsigned Android player template source
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PnovelteaAbi=arm64-v8a -PnovelteaCompileShaders=OFF -PnovelteaPrebuiltShaderAssetRoot="${{ github.workspace }}/build/prebuilt-shader-assets" -PnovelteaUseCcache=true
          ./gradlew --no-daemon :app:assembleDebug -PnovelteaAbi=x86_64 -PnovelteaCompileShaders=OFF -PnovelteaPrebuiltShaderAssetRoot="${{ github.workspace }}/build/prebuilt-shader-assets" -PnovelteaUseCcache=true

      - name: Download checksum-pinned bundletool
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/bundletool-all-1.18.1.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -

      - name: Package official Android player templates
        run: |
          cmake -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -DNOVELTEA_ANDROID_ABI=arm64-v8a -DNOVELTEA_ANDROID_FLAVOR=release -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake
          cmake -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -DNOVELTEA_ANDROID_ABI=x86_64 -DNOVELTEA_ANDROID_FLAVOR=debug -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake

      - name: Verify Android native 16 KiB load alignment
        run: |
          readelf="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          node scripts/verify-android-load-alignment.mjs \
            --readelf "$readelf" \
            --root build/package/android-arm64-v8a-release/source/android/prebuilt-native \
            --root build/package/android-x86_64-debug/source/android/prebuilt-native \
            --output dist/noveltea-android-load-alignment.json

      - name: Install pnpm and editor dependencies
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for Android certification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner

      - name: Download direct native C++ Android export CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-native-cli-linux-x64
          path: build/native-export-cli-linux

      - name: Make direct native Android export CLI executable
        run: chmod +x build/native-export-cli-linux/noveltea

      - name: Export and inspect release APK plus AAB through public CLI
        env:
          NOVELTEA_ANDROID_ABI: arm64-v8a
          NOVELTEA_ANDROID_FLAVOR: release
          NOVELTEA_ANDROID_ARTIFACT: both
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-arm64-v8a-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-release
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-release-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-arm64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-release-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-release-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi arm64-v8a --flavor release --artifact both
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-arm64"
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-release.tar.gz" --force
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-release \
            --output "${{ github.workspace }}/dist/android-release-fixture" \
            --config "$config" \
            --allow-untrusted-template \
            --allow-localization-warnings
          node scripts/native-canonical-export-evidence.mjs \
            --archive "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-release.tar.gz" \
            --project "$fixture_root" \
            --export "${{ github.workspace }}/dist/android-release-fixture" \
            --evidence "${{ github.workspace }}/dist/canonical-android-arm64-fixture-evidence.json"

      - name: Export and inspect x86_64 debug APK through public CLI
        env:
          NOVELTEA_ANDROID_ABI: x86_64
          NOVELTEA_ANDROID_FLAVOR: debug
          NOVELTEA_ANDROID_ARTIFACT: apk
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-x86_64-debug.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-debug
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-debug-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-x86_64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-debug-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-debug-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi x86_64 --flavor debug --artifact apk
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-x64"
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-x86_64-debug.tar.gz" --force
          "${{ github.workspace }}/build/native-export-cli-linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-debug \
            --output "${{ github.workspace }}/dist/android-debug-fixture" \
            --config "$config" \
            --allow-untrusted-template \
            --allow-localization-warnings
          node scripts/native-canonical-export-evidence.mjs \
            --archive "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-x86_64-debug.tar.gz" \
            --project "$fixture_root" \
            --export "${{ github.workspace }}/dist/android-debug-fixture" \
            --evidence "${{ github.workspace }}/dist/canonical-android-x86_64-fixture-evidence.json"

      - name: Generate Android platform certification reports
        run: |
          alignment=dist/noveltea-android-load-alignment.json

          archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-arm64-v8a-release.tar.gz' -print -quit)
          export_report=$(find dist/android-release-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$archive" && test -n "$export_report"
          results=dist/noveltea-certification-results-android-arm64-v8a-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$archive" \
            --canonical-evidence dist/canonical-android-arm64-fixture-evidence.json \
            --android-report "$export_report" \
            --android-alignment "$alignment" \
            --output "$results"
          report=dist/noveltea-platform-certification-android-arm64-v8a-release.json
          node scripts/platform-certification.mjs create --archive "$archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"

          debug_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-x86_64-debug.tar.gz' -print -quit)
          debug_export_report=$(find dist/android-debug-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$debug_archive" && test -n "$debug_export_report"
          debug_results=dist/noveltea-certification-results-android-x86_64-debug.json
          node scripts/platform-certification-results.mjs \
            --archive "$debug_archive" \
            --canonical-evidence dist/canonical-android-x86_64-fixture-evidence.json \
            --android-report "$debug_export_report" \
            --android-alignment "$alignment" \
            --output "$debug_results"
          debug_report=dist/noveltea-platform-certification-android-x86_64-debug.json
          node scripts/platform-certification.mjs create --archive "$debug_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$debug_results" --output "$debug_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$debug_archive" --report "$debug_report"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-release-dist
          path: dist/*
          if-no-files-found: error

  desktop-editor:
    name: Desktop editor (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, web, desktop-hosts, windows-cli, macos-cli]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            cli_artifact: noveltea-release-host-cli-linux-x64
            cli_path: build/cli/linux
            cli_executable: build/cli/linux/noveltea
          - platform: windows
            arch: x64
            runner: windows-2025
            cli_artifact: noveltea-release-host-cli-windows-x64
            cli_path: build/cli/windows
            cli_executable: build/cli/windows/noveltea.exe
          - platform: macos
            arch: arm64
            runner: macos-26
            cli_artifact: noveltea-release-host-cli-macos-arm64
            cli_path: build/cli/macos
            cli_executable: build/cli/macos/noveltea

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Linux native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native
        with:
          pkg-config: "true"
          xvfb: "true"
          extra-packages: >-
            rpm fakeroot
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libxkbcommon-dev libxdamage-dev libxfixes-dev libcups2-dev libnss3-dev libnspr4-dev
            libatk1.0-dev libatk-bridge2.0-dev libgtk-3-dev libdrm-dev libasound2-dev
            libgbm-dev libpango1.0-dev libcairo2-dev libssl-dev

      - name: Download Web editor preview
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview

      - name: Verify packaged engine preview
        shell: pwsh
        run: |
          foreach ($file in @("index.html", "index.js", "index.wasm", "index.data")) {
            if (!(Test-Path "build/web-editor-preview/apps/editor_preview/$file")) {
              throw "Missing web preview file: $file"
            }
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up MSVC for native Project authoring
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install macOS Ninja for native Project authoring
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build native Project authoring Electron addon
        if: runner.os != 'Linux'
        run: node editor/scripts/build-native-authoring-addon.mjs --addon-only

      - name: Audit native macOS Project authoring minimum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          addon="build/native-authoring-host/noveltea-authoring-node.node"
          minos="$(otool -l "$addon" | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; next } build && $1 == "minos" { print $2; exit }')"
          test "$minos" = "14.0"

      - name: Prepare version-matched Linux Electron Node-API headers
        if: runner.os == 'Linux'
        run: node editor/scripts/build-native-authoring-addon.mjs --headers-only

      - name: Build Linux authoring addon at the supported ABI floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag noveltea-linux-authoring-abi --file .github/containers/linux-player-glibc228.Dockerfile .
          electron_version="$(node -p "require('./editor/node_modules/electron/package.json').version")"
          mkdir -p .cache/container-home .cache/ccache
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env HOME=/workspace/.cache/container-home \
            --env ELECTRON_VERSION="$electron_version" \
            --env CCACHE_DIR=/workspace/.cache/ccache \
            noveltea-linux-authoring-abi \
            bash -lc '
              set -euo pipefail
              # The login shell may replace the incoming ccache environment.
              # Keep the compiler cache inside the writable mounted checkout.
              export CCACHE_DIR=/workspace/.cache/ccache
              test -w "$CCACHE_DIR"
              cmake -S tools/project_authoring -B build/native-authoring-host -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DNOVELTEA_BUILD_AUTHORING_NODE_ADDON=ON \
                -DNOVELTEA_NODE_API_INCLUDE_DIR="/workspace/build/electron-authoring-headers/$ELECTRON_VERSION/include/node" \
                "-DCMAKE_MODULE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
              cmake --build build/native-authoring-host --target noveltea-authoring-node
              cmake -DNOVELTEA_BINARY=/workspace/build/native-authoring-host/noveltea-authoring-node.node \
                -DNOVELTEA_MAX_GLIBC_VERSION=2.36 -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.30 \
                -P cmake/AuditNovelTeaLinuxCompatibility.cmake
            '

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: ${{ matrix.cli_path }}

      - name: Make NovelTea host tools executable
        if: runner.os != 'Windows'
        run: |
          chmod +x \
            "${{ matrix.cli_path }}/noveltea" \
            "${{ matrix.cli_path }}/noveltea-ui-test-runner" \
            "${{ matrix.cli_path }}/tools/ffmpeg/bin/ffmpeg"

      - name: Certify standalone native CLI disk Project validation on this host
        run: node editor/scripts/certify-native-daemon-validation.mjs "${{ github.workspace }}/${{ matrix.cli_executable }}" tests/projects/feature-lab

      - name: Certify native CLI command inventory on this host
        run: node editor/scripts/certify-native-cli-inventory.mjs

      - name: Certify native CLI record inspection parity on this host
        run: node editor/scripts/certify-native-cli-commands.mjs "${{ github.workspace }}/${{ matrix.cli_executable }}" tests/projects/feature-lab

      # The platform candidate certification materializes its canonical Web
      # export fixture via the packed node-tools entrypoint. Pack before that
      # certification, not only before the later editor cross-system test.
      - name: Build native editor certification tool bundle
        run: pnpm -C editor exec vp pack

      # Catch host-loader defects (such as missing Windows Electron
      # delay-load hook) before running the slower editor/CLI differential.
      - name: Certify Windows Electron native-addon worker loading
        if: runner.os == 'Windows'
        run: node editor/scripts/certify-native-authoring-electron-loader.mjs "${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node"

      - name: Certify native CLI candidate commands on this host
        shell: pwsh
        run: |
          $cli = "${{ github.workspace }}/${{ matrix.cli_executable }}"
          node editor/scripts/certify-native-cli-project-routing.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node editor/scripts/certify-native-cli-lifecycle.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node editor/scripts/certify-native-cli-transport.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node editor/scripts/certify-native-cli-tests.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node editor/scripts/certify-native-cli-package.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node editor/scripts/certify-native-cli-platform.mjs $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Certify native editor and installed CLI cross-system authority
        shell: pwsh
        env:
          NOVELTEA_AUTHORING_NODE_ADDON: ${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node
        run: |
          node editor/scripts/certify-native-authoring-cross-system.mjs "${{ github.workspace }}/${{ matrix.cli_executable }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify native editor artifacts
        shell: pwsh
        env:
          NOVELTEA_CLI_PATH: ${{ github.workspace }}/${{ matrix.cli_executable }}
          NOVELTEA_AUTHORING_NODE_ADDON: ${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node
        run: pnpm -C editor run artifact -- --release-tag "$env:RELEASE_TAG"

      - name: Audit packaged Linux authoring ABI floor
        if: matrix.platform == 'linux'
        run: |
          cmake \
            -DNOVELTEA_TREE="${{ github.workspace }}/editor/out/electron-builder" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.36 \
            -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.30 \
            -P cmake/AuditNovelTeaLinuxCompatibility.cmake

      - name: Verify packaged macOS authoring minimum
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          plist="$(find editor/out/electron-builder \( -path '*/noveltea-editor.app/Contents/Info.plist' -o -path '*/NovelTea Editor.app/Contents/Info.plist' \) -print -quit)"
          test -n "$plist"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")" = "14.0"

      - name: Run permanent packaged-application smoke
        shell: pwsh
        run: pnpm -C editor run package:smoke

      - name: Install, invoke, and remove Linux editor packages
        if: runner.os == 'Linux'
        run: .github/linux-editor-installer-smoke.sh

      - name: Stage editor distributables
        shell: pwsh
        env:
          NOVELTEA_RELEASE_PLATFORM: ${{ matrix.platform }}
          NOVELTEA_RELEASE_ARCH: ${{ matrix.arch }}
        run: cmake -DNOVELTEA_PACKAGE_KIND=desktop-editor -DNOVELTEA_RELEASE_TAG="$env:RELEASE_TAG" -P cmake/PackageNovelTeaRelease.cmake

      - name: Upload editor release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-editor-${{ matrix.platform }}-${{ matrix.arch }}-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Attest editor release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-editor-*

  release-inventory:
    name: Qualify exact release inventory
    runs-on: ubuntu-24.04
    needs:
      [release-metadata, desktop-hosts, macos-certify, web, android, desktop-editor, windows-cli, release-examples]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: noveltea-*-release-dist
          path: dist
          merge-multiple: true

      - name: Generate player template registry index
        run: node .github/generate-template-registry.mjs dist "$RELEASE_TAG"

      - name: Enforce platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Generate public release manifest
        run: node .github/generate-public-release-manifest.mjs dist "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Generate checksums
        run: .github/package-release.sh checksums "$RELEASE_TAG"

      - name: Verify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG"

      - name: Upload qualified release
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [release-metadata, release-inventory]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download qualified release
        uses: actions/download-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist

      - name: Reverify platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Reverify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG" release-assets.txt

      - name: Attest complete player template set
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Initialize public distribution repository when empty
        env:
          GH_TOKEN: ${{ secrets.NOVELTEA_RELEASES_TOKEN }}
        shell: bash
        run: |
          if ! gh api repos/Cruel/noveltea-releases/git/ref/heads/main >/dev/null 2>&1; then
            content="$(printf '%s\n' '# NovelTea Releases' '' 'Public binary distribution for NovelTea. Product downloads are linked from https://noveltea.dev/download/.' | base64 -w0)"
            gh api --method PUT repos/Cruel/noveltea-releases/contents/README.md \
              -f message='Initialize NovelTea release distribution' \
              -f content="$content" >/dev/null
          fi

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ secrets.NOVELTEA_RELEASES_TOKEN }}
        run: |
          mapfile -t assets < release-assets.txt
          for index in "${!assets[@]}"; do
            assets[$index]="dist/${assets[$index]}"
          done
          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --repo Cruel/noveltea-releases
            --title "NovelTea $RELEASE_TAG"
            --notes "Qualified NovelTea release $RELEASE_TAG. Download metadata is available in noveltea-release-manifest.json."
          )
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
