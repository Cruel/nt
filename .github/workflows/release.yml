name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # VERSION is resolved after checkout, so serialize release qualification/publication globally.
  group: noveltea-release
  cancel-in-progress: false

env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_MAX_CONCURRENCY: 2
  RELEASE_REF: ${{ github.ref }}
  EMSDK_VERSION: 6.0.0
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_BASEDIR: ${{ github.workspace }}
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release-identity.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Resolve and validate release identity
        id: release-identity
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=("$GITHUB_REF_NAME")
          fi
          release_tag="$(node .github/validate-release-version.mjs "${args[@]}")"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  shader-assets:
    name: Shader assets
    runs-on: ubuntu-24.04
    needs: release-metadata
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ninja-build cmake pkg-config curl zip unzip tar git autoconf automake autoconf-archive libtool libltdl-dev bison flex libx11-dev libgl1-mesa-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Share downloads and vcpkg binary artifacts with the platform jobs. The
      # installed tree and host-tool build outputs remain release-host specific.
      - name: Cache shared vcpkg SDK and binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: ubuntu-24.04-x64-vcpkg-common-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            ubuntu-24.04-x64-vcpkg-common-

      - name: Cache host CLI dependencies and embedded shaderc
        uses: actions/cache@v5
        with:
          path: |
            build/linux-release/vcpkg_installed
            build/linux-release/_deps/noveltea_bgfx_shaderc_source-src
            build/linux-release/_deps/noveltea_bgfx_shaderc_source-build
            build/linux-release/tools/editor_tool/CMakeFiles/noveltea_bgfx_shaderc_embedded.dir
            build/linux-release/tools/editor_tool/libnoveltea_bgfx_shaderc_embedded.a
          key: ${{ runner.os }}-x64-release-shader-host-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**', 'cmake/NovelTeaEmbeddedShaderc.cmake', 'engine/src/render/embedded_bgfx_resources.hpp.in') }}
          restore-keys: |
            ${{ runner.os }}-x64-release-shader-host-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Build NovelTea host CLI
        run: pnpm -C editor run noveltea:build

      - name: Certify NovelTea host CLI
        run: pnpm -C editor run noveltea:certify

      - name: Compile and verify shader assets
        run: |
          cmake -DNOVELTEA_CLI_EXECUTABLE="${{ github.workspace }}/build/cli/linux/noveltea" -DNOVELTEA_SHADER_SOURCE_DIR="${{ github.workspace }}/engine/shaders/bgfx" -DNOVELTEA_SHADER_OUTPUT_ROOT="${{ github.workspace }}/build/generated-assets/shaders" '-DNOVELTEA_SHADER_VARIANTS=glsl-120;essl-100;essl-300;metal' -DNOVELTEA_BGFX_SHADER_INCLUDE_DIR="${{ github.workspace }}/build/linux-release/vcpkg_installed/x64-linux-noveltea/include/bgfx" -P "${{ github.workspace }}/cmake/CompileNovelTeaShaders.cmake"
          cmake -DNOVELTEA_VERIFY_ONLY=ON -DNOVELTEA_SHADER_OUTPUT_ROOT="${{ github.workspace }}/build/generated-assets/shaders" '-DNOVELTEA_SHADER_VARIANTS=glsl-120;essl-100;essl-300;metal' -P "${{ github.workspace }}/cmake/CompileNovelTeaShaders.cmake"

      - name: Upload shader assets
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/generated-assets/shaders
          if-no-files-found: error

      - name: Upload NovelTea host CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux/noveltea
          if-no-files-found: error

      - name: Stage standalone NovelTea CLI release asset
        run: |
          mkdir -p build/release-cli
          install -m 0755 \
            build/cli/linux/noveltea \
            "build/release-cli/noveltea-${RELEASE_TAG}-linux-x64"

      - name: Attest standalone NovelTea CLI
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64

      - name: Upload standalone NovelTea CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-linux-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-linux-x64
          if-no-files-found: error

  windows-cli:
    name: Standalone CLI (windows-x64)
    runs-on: windows-2025
    needs: release-metadata
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache vcpkg SDK and binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: windows-x64-cli-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: windows-x64-cli-vcpkg-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT/.git")) { git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT" }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
      - name: Set up Zig for ScriptC Windows target
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - name: Verify Windows GNU CLI tools
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          llvm-strip --version
          zig version
      - name: Build Windows CLI
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
          SCRIPTC_CC: zigcc
          SCRIPTC_TARGET: x86_64-windows-gnu
        run: pnpm -C editor run noveltea:build
      - name: Set up PE inspection environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify PE inspection tool
        shell: pwsh
        run: Get-Command dumpbin | Out-Null
      - name: Certify Windows CLI
        run: pnpm -C editor run noveltea:certify
      - name: Stage standalone Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release-cli | Out-Null
          Copy-Item build/cli/windows/noveltea.exe "build/release-cli/noveltea-$env:RELEASE_TAG-windows-x64.exe"
      - name: Upload Windows host CLI
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-release-host-cli-windows-x64
          path: build/cli/windows/noveltea.exe
          if-no-files-found: error
      - name: Attest standalone Windows CLI
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.exe
      - name: Upload standalone Windows CLI release asset
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-windows-release-dist
          path: build/release-cli/noveltea-${{ env.RELEASE_TAG }}-windows-x64.exe
          if-no-files-found: error

  desktop-hosts:
    name: Desktop hosts (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            preset: linux-release
            triplet: x64-linux-noveltea
            host_triplet: x64-linux
          - platform: windows
            arch: x64
            runner: windows-2025
            preset: windows-release
            triplet: x64-windows-static-noveltea
            host_triplet: x64-windows
          - platform: macos
            arch: arm64
            runner: macos-15
            preset: macos-release
            triplet: arm64-osx-noveltea
            host_triplet: arm64-osx

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build ccache cmake pkg-config curl zip unzip tar git libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols weston libltdl-dev libxtst-dev autoconf automake autoconf-archive libtool bison flex

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Cache shared vcpkg SDK and binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-common-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-common-

      - name: Cache vcpkg installed
        uses: actions/cache@v5
        with:
          path: build/${{ matrix.preset }}/vcpkg_installed
          key: ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-installed-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/NovelTeaLua.cmake') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.arch }}-vcpkg-installed-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT/.git")) {
            git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          }
          if ("${{ runner.os }}" -eq "Windows") {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh"
          }

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore NovelTea vcpkg root after MSVC setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_ROOT=${{ github.workspace }}/.cache/vcpkg'

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Download NovelTea host CLI
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        if: matrix.platform == 'linux'
        run: chmod +x build/cli/linux/noveltea

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ matrix.preset }}-

      - name: Build desktop player and tools
        shell: pwsh
        run: |
          $ccacheArgs = @()
          if ("${{ runner.os }}" -ne "Windows") { $ccacheArgs = @("-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache") }
          cmake --preset ${{ matrix.preset }} -G Ninja `
            -DNOVELTEA_BUILD_HOST_TOOLS=ON `
            -DNOVELTEA_COMPILE_SHADERS=OFF `
            -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" `
            -DNOVELTEA_PROJECT_ASSET_SOURCE="${{ github.workspace }}/apps/sandbox/assets" `
            -DNOVELTEA_CMAKE_STAGE_RUNTIME_ASSETS=ON `
            -DBUILD_TESTING=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} `
            @ccacheArgs
          cmake --build --preset ${{ matrix.preset }} --target noveltea-player
          cmake --build --preset ${{ matrix.preset }} --target noveltea-tooling-bridge
          cmake --build --preset ${{ matrix.preset }} --target cxx-policy

      - name: Audit Linux player dependency closure
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake \
            "-DNOVELTEA_PLAYER=${{ github.workspace }}/build/${{ matrix.preset }}/apps/player/noveltea-player" \
            "-DNOVELTEA_AUDIT_REPORT=${{ github.workspace }}/dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            "-DNOVELTEA_MAX_GLIBC_VERSION=2.39" \
            -P cmake/AuditNovelTeaPlayerDependencies.cmake

      - name: Audit non-Linux player dependency closure
        if: matrix.platform != 'linux'
        shell: pwsh
        run: cmake -DNOVELTEA_PLAYER="${{ github.workspace }}/build/${{ matrix.preset }}/apps/player/noveltea-player${{ matrix.platform == 'windows' && '.exe' || '' }}" -DNOVELTEA_AUDIT_REPORT="${{ github.workspace }}/dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json" -P cmake/AuditNovelTeaPlayerDependencies.cmake

      - name: Package player template and symbols
        shell: pwsh
        run: cmake -DNOVELTEA_TEMPLATE_PRESET=${{ matrix.preset }} -DNOVELTEA_TEMPLATE_PLATFORM=${{ matrix.platform }} -DNOVELTEA_TEMPLATE_ARCH=${{ matrix.arch }} -DNOVELTEA_RELEASE_TAG="$env:RELEASE_TAG" -P cmake/PackageNovelTeaPlayerTemplate.cmake

      - name: Set up pnpm for desktop export smoke
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for desktop export smoke
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root workspace dependencies for desktop export smoke
        run: pnpm install --frozen-lockfile

      - name: Install appimagetool for Linux export smoke
        if: matrix.platform == 'linux'
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Finalize and launch Windows portable export
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: editor
        env:
          NOVELTEA_WINDOWS_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-release.zip
          NOVELTEA_WINDOWS_RUNTIME_PACKAGE: ${{ github.workspace }}\build\windows-release\runtime-assets\project\projects\runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: windows
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}\dist\noveltea-player-template-${{ env.RELEASE_TAG }}-windows-x64-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}\noveltea-canonical-windows
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\canonical-windows-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}\dist\noveltea-native-smoke-windows-x64.json
          NOVELTEA_PLAYER_HEADLESS_ERRORS: "1"
          NOVELTEA_NATIVE_TOOL_BRIDGE: ${{ github.workspace }}\build\windows-release\tools\editor_tool\noveltea-tooling-bridge.exe
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Finalize and launch Linux portable export on X11
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/linux-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          NOVELTEA_CANONICAL_EXPORT_TARGET: linux
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-linux
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-linux-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-x11.json
          NOVELTEA_NATIVE_TOOL_BRIDGE: ${{ github.workspace }}/build/linux-release/tools/editor_tool/noveltea-tooling-bridge
        run: xvfb-run -a pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Finalize and launch Linux portable export on Wayland
        if: matrix.platform == 'linux'
        working-directory: editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NOVELTEA_LINUX_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-linux-x64-release.tar.gz
          NOVELTEA_LINUX_RUNTIME_PACKAGE: ${{ github.workspace }}/build/linux-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_LINUX_APPIMAGE_TOOL: ${{ runner.temp }}/appimagetool.AppImage
          SDL_VIDEODRIVER: wayland
          WAYLAND_DISPLAY: wayland-noveltea
          XDG_RUNTIME_DIR: ${{ runner.temp }}/noveltea-weston-runtime
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-linux-wayland.json
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts

      - name: Finalize and launch macOS app bundle export
        if: matrix.platform == 'macos'
        working-directory: editor
        env:
          NOVELTEA_MACOS_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-release.tar.gz
          NOVELTEA_MACOS_RUNTIME_PACKAGE: ${{ github.workspace }}/build/macos-release/runtime-assets/project/projects/runtime_presentation_package.ntpkg
          NOVELTEA_CANONICAL_EXPORT_TARGET: macos
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-macos-arm64-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-macos
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/Platform Export Acceptance.app
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-macos-fixture-evidence.json
          NOVELTEA_NATIVE_SMOKE_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/noveltea-native-smoke-macos-arm64.json
          NOVELTEA_NATIVE_TOOL_BRIDGE: ${{ github.workspace }}/build/macos-release/tools/editor_tool/noveltea-tooling-bridge
        run: pnpm exec vp test run src/renderer/test/platform-staging-service.test.ts src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Generate desktop platform certification report
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/noveltea-player-template-*-${{ matrix.platform }}-${{ matrix.arch }}-release.*" | Where-Object { $_.Name -notmatch 'symbols' } | Select-Object -First 1
          if (!$archive) { throw "Player template archive was not found" }
          $results = "dist/noveltea-certification-results-${{ matrix.platform }}-${{ matrix.arch }}-release.json"
          $collector = @(
            "scripts/platform-certification-results.mjs",
            "--archive", $archive.FullName,
            "--canonical-evidence", "dist/canonical-${{ matrix.platform }}-fixture-evidence.json",
            "--dependency-audit", "dist/noveltea-dependency-audit-${{ matrix.platform }}-${{ matrix.arch }}.json",
            "--output", $results
          )
          if ("${{ matrix.platform }}" -eq "windows") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-windows-x64.json")
          } elseif ("${{ matrix.platform }}" -eq "linux") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-linux-x11.json", "--smoke", "dist/noveltea-native-smoke-linux-wayland.json")
          } elseif ("${{ matrix.platform }}" -eq "macos") {
            $collector += @("--smoke", "dist/noveltea-native-smoke-macos-arm64.json")
          }
          & node @collector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = "dist/noveltea-platform-certification-${{ matrix.platform }}-${{ matrix.arch }}-release.json"
          node scripts/platform-certification.mjs create --archive $archive.FullName --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results $results --output $report --source-revision "$env:GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive $archive.FullName --report $report

      - name: Attest player template archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Upload desktop host release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-host-${{ matrix.platform }}-${{ matrix.arch }}-release-dist
          path: dist/*
          if-no-files-found: error

  web:
    name: Web release
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build ccache cmake curl zip unzip tar git autoconf automake autoconf-archive libtool bison flex

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v5
        with:
          path: .cache/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${{ github.workspace }}/.cache/emsdk"
          cd "${{ github.workspace }}/.cache/emsdk"
          ./emsdk install $EMSDK_VERSION
          ./emsdk activate $EMSDK_VERSION

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-emscripten-${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-emscripten-${{ env.EMSDK_VERSION }}-

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Build Web release
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake --preset web-release -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-release --target noveltea-player
          cmake --build --preset web-release --target cxx-policy
          emcmake cmake --preset web-release-no-threads -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-release-no-threads --target noveltea-player
          emcmake cmake --preset web-editor-preview -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-editor-preview --target noveltea-editor-preview

      - name: Verify release player surface
        run: |
          ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)' build/web-release/apps/player/player.js
          ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)|MessageChannel' build/web-release-no-threads/apps/player/player.js

      - name: Package Web player template
        run: |
          cmake -DNOVELTEA_TEMPLATE_PRESET=web-release -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake
          cmake -DNOVELTEA_TEMPLATE_PRESET=web-release-no-threads -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake

      - name: Attest Web player template
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/noveltea-player-template-*-web-wasm32*-release.zip

      - name: Install editor test dependencies for certification fixture
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for certification fixture
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea

      - name: Validate canonical export fixture for Web certification
        working-directory: editor
        env:
          NOVELTEA_CANONICAL_EXPORT_TARGET: web
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-web-wasm32-threads-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-web
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-web-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-web-fixture-evidence.json
        run: |
          pnpm exec vp test run src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Export canonical fixture at nested Web base path
        working-directory: editor
        env:
          NOVELTEA_CANONICAL_EXPORT_TARGET: web
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-web-wasm32-threads-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-web-nested
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-web-nested-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-web-nested-fixture-evidence.json
          NOVELTEA_WEB_BASE_PATH: /nested/game/
        run: pnpm exec vp test run src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Validate canonical single-threaded Web export fixture
        working-directory: editor
        env:
          NOVELTEA_CANONICAL_EXPORT_TARGET: web
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-web-wasm32-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-web-single
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-web-single-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-web-single-fixture-evidence.json
          NOVELTEA_WEB_THREADED: "false"
        run: pnpm exec vp test run src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Export canonical single-threaded fixture at nested Web base path
        working-directory: editor
        env:
          NOVELTEA_CANONICAL_EXPORT_TARGET: web
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-web-wasm32-release.zip
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-web-single-nested
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-web-single-nested-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-web-single-nested-fixture-evidence.json
          NOVELTEA_WEB_BASE_PATH: /nested/game/
          NOVELTEA_WEB_THREADED: "false"
        run: pnpm exec vp test run src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Certify finalized Web exports in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm web:certify-export \
            --case threads-root:/:dist/canonical-web-export \
            --case threads-nested:/nested/game/:dist/canonical-web-nested-export \
            --output dist/noveltea-web-browser-certification-threads.json
          pnpm web:certify-export \
            --case single-root:/:dist/canonical-web-single-export \
            --case single-nested:/nested/game/:dist/canonical-web-single-nested-export \
            --output dist/noveltea-web-browser-certification-single.json

      - name: Generate Web platform certification reports
        run: |
          threads_browser=dist/noveltea-web-browser-certification-threads.json
          single_browser=dist/noveltea-web-browser-certification-single.json

          threads_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print -quit)
          test -n "$threads_archive"
          threads_results=dist/noveltea-certification-results-web-wasm32-threads-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$threads_archive" \
            --canonical-evidence dist/canonical-web-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-nested-fixture-evidence.json \
            --web-browser "$threads_browser" \
            --web-case-prefix threads \
            --output "$threads_results"
          threads_report=dist/noveltea-platform-certification-web-wasm32-threads-release.json
          node scripts/platform-certification.mjs create --archive "$threads_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$threads_results" --output "$threads_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$threads_archive" --report "$threads_report"

          single_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-web-wasm32-release.zip' -print -quit)
          test -n "$single_archive"
          single_results=dist/noveltea-certification-results-web-wasm32-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$single_archive" \
            --canonical-evidence dist/canonical-web-single-fixture-evidence.json \
            --nested-canonical-evidence dist/canonical-web-single-nested-fixture-evidence.json \
            --web-browser "$single_browser" \
            --web-case-prefix single \
            --output "$single_results"
          single_report=dist/noveltea-platform-certification-web-wasm32-release.json
          node scripts/platform-certification.mjs create --archive "$single_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$single_results" --output "$single_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$single_archive" --report "$single_report"

      - name: Upload Web release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload Web editor preview
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview
          if-no-files-found: error

  android:
    name: Android release
    runs-on: ubuntu-24.04
    needs: [release-metadata, shader-assets]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build ccache cmake curl zip unzip tar git autoconf automake autoconf-archive libtool bison flex

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-android-sdk-android${{ env.ANDROID_API_LEVEL }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Cache SDL3 Android AAR
        id: cache-sdl3-aar
        uses: actions/cache@v5
        with:
          path: android/app/libs/SDL3-3.4.10.aar
          key: ${{ runner.os }}-sdl3-aar-3.4.10

      - name: Download SDL3 Android AAR
        if: steps.cache-sdl3-aar.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs .cache/sdl3-android
          curl -L -o .cache/sdl3-android/SDL3-devel-3.4.10-android.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-android.zip
          unzip -p .cache/sdl3-android/SDL3-devel-3.4.10-android.zip SDL3-3.4.10.aar > android/app/libs/SDL3-3.4.10.aar

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-android-ndk${{ env.ANDROID_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-ndk${{ env.ANDROID_NDK_VERSION }}-

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-shader-assets
          path: build/prebuilt-shader-assets

      - name: Build unsigned Android player template source
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PnovelteaAbi=arm64-v8a -PnovelteaCompileShaders=OFF -PnovelteaPrebuiltShaderAssetRoot="${{ github.workspace }}/build/prebuilt-shader-assets" -PnovelteaUseCcache=true
          ./gradlew --no-daemon :app:assembleDebug -PnovelteaAbi=x86_64 -PnovelteaCompileShaders=OFF -PnovelteaPrebuiltShaderAssetRoot="${{ github.workspace }}/build/prebuilt-shader-assets" -PnovelteaUseCcache=true

      - name: Download checksum-pinned bundletool
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/bundletool-all-1.18.1.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -

      - name: Package official Android player templates
        run: |
          cmake -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -DNOVELTEA_ANDROID_ABI=arm64-v8a -DNOVELTEA_ANDROID_FLAVOR=release -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake
          cmake -DNOVELTEA_RELEASE_TAG="$RELEASE_TAG" -DNOVELTEA_ANDROID_ABI=x86_64 -DNOVELTEA_ANDROID_FLAVOR=debug -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake

      - name: Verify Android native 16 KiB load alignment
        run: |
          readelf="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          node scripts/verify-android-load-alignment.mjs \
            --readelf "$readelf" \
            --root build/package/android-arm64-v8a-release/source/android/prebuilt-native \
            --root build/package/android-x86_64-debug/source/android/prebuilt-native \
            --output dist/noveltea-android-load-alignment.json

      - name: Install pnpm and editor dependencies
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for Android certification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-release-host-cli-linux-x64
          path: build/cli/linux

      - name: Make NovelTea host CLI executable
        run: chmod +x build/cli/linux/noveltea

      - name: Export and inspect release APK plus AAB through public CLI
        env:
          NOVELTEA_ANDROID_ABI: arm64-v8a
          NOVELTEA_ANDROID_FLAVOR: release
          NOVELTEA_ANDROID_ARTIFACT: both
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-arm64-v8a-release.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-release
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-release-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-arm64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-release-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-release-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi arm64-v8a --flavor release --artifact both
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-arm64"
          "${{ github.workspace }}/build/cli/linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-arm64-v8a-release.tar.gz" --force
          "${{ github.workspace }}/build/cli/linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-release \
            --output "${{ github.workspace }}/dist/android-release-fixture" \
            --config "$config" \
            --allow-untrusted-template
          pnpm -C editor exec vp test run src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Export and inspect x86_64 debug APK through public CLI
        env:
          NOVELTEA_ANDROID_ABI: x86_64
          NOVELTEA_ANDROID_FLAVOR: debug
          NOVELTEA_ANDROID_ARTIFACT: apk
          NOVELTEA_CANONICAL_EXPORT_TARGET: android
          NOVELTEA_CANONICAL_TEMPLATE_ARCHIVE: ${{ github.workspace }}/dist/noveltea-player-template-${{ env.RELEASE_TAG }}-android-x86_64-debug.tar.gz
          NOVELTEA_CANONICAL_INTEGRATION_ROOT: ${{ runner.temp }}/noveltea-canonical-android-debug
          NOVELTEA_CANONICAL_EXPORT_OUTPUT: ${{ github.workspace }}/dist/canonical-android-debug-export
          NOVELTEA_CANONICAL_EVIDENCE_OUTPUT: ${{ github.workspace }}/dist/canonical-android-x86_64-fixture-evidence.json
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_CMAKE_ROOT="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          config="$RUNNER_TEMP/noveltea-android-debug-export-config.json"
          pnpm android:export-config -- --output "$config"
          fixture_root="$RUNNER_TEMP/noveltea-android-debug-fixture"
          pnpm -C editor run android:fixture -- --root "$fixture_root" --abi x86_64 --flavor debug --artifact apk
          export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry-x64"
          "${{ github.workspace }}/build/cli/linux/noveltea" --json platform template install "${{ github.workspace }}/dist/noveltea-player-template-${RELEASE_TAG}-android-x86_64-debug.tar.gz" --force
          "${{ github.workspace }}/build/cli/linux/noveltea" --project "$fixture_root" --json platform export \
            --profile canonical-android-debug \
            --output "${{ github.workspace }}/dist/android-debug-fixture" \
            --config "$config" \
            --allow-untrusted-template
          pnpm -C editor exec vp test run src/renderer/test/platform-export-acceptance-fixture.test.ts src/renderer/test/platform-export-canonical-integration.test.ts

      - name: Generate Android platform certification reports
        run: |
          alignment=dist/noveltea-android-load-alignment.json

          archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-arm64-v8a-release.tar.gz' -print -quit)
          export_report=$(find dist/android-release-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$archive" && test -n "$export_report"
          results=dist/noveltea-certification-results-android-arm64-v8a-release.json
          node scripts/platform-certification-results.mjs \
            --archive "$archive" \
            --canonical-evidence dist/canonical-android-arm64-fixture-evidence.json \
            --android-report "$export_report" \
            --android-alignment "$alignment" \
            --output "$results"
          report=dist/noveltea-platform-certification-android-arm64-v8a-release.json
          node scripts/platform-certification.mjs create --archive "$archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$results" --output "$report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$archive" --report "$report"

          debug_archive=$(find dist -maxdepth 1 -name 'noveltea-player-template-*-android-x86_64-debug.tar.gz' -print -quit)
          debug_export_report=$(find dist/android-debug-fixture -type f -name '*-export-report.json' -print -quit)
          test -n "$debug_archive" && test -n "$debug_export_report"
          debug_results=dist/noveltea-certification-results-android-x86_64-debug.json
          node scripts/platform-certification-results.mjs \
            --archive "$debug_archive" \
            --canonical-evidence dist/canonical-android-x86_64-fixture-evidence.json \
            --android-report "$debug_export_report" \
            --android-alignment "$alignment" \
            --output "$debug_results"
          debug_report=dist/noveltea-platform-certification-android-x86_64-debug.json
          node scripts/platform-certification.mjs create --archive "$debug_archive" --fixture editor/src/shared/project-schema/platform-export-acceptance-fixture.ts --results "$debug_results" --output "$debug_report" --source-revision "$GITHUB_SHA"
          node scripts/platform-certification.mjs verify --archive "$debug_archive" --report "$debug_report"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-release-dist
          path: dist/*
          if-no-files-found: error

  desktop-editor:
    name: Desktop editor (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release-metadata, web, desktop-hosts, windows-cli]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            cli_artifact: noveltea-release-host-cli-linux-x64
            cli_path: build/cli/linux
            cli_executable: build/cli/linux/noveltea
          - platform: windows
            arch: x64
            runner: windows-2025
            cli_artifact: noveltea-release-host-cli-windows-x64
            cli_path: build/cli/windows
            cli_executable: build/cli/windows/noveltea.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake pkg-config curl zip unzip tar git xvfb rpm fakeroot libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxdamage-dev libxfixes-dev libcups2-dev libnss3-dev libnspr4-dev libatk1.0-dev libatk-bridge2.0-dev libgtk-3-dev libdrm-dev libasound2-dev libgbm-dev libpango1.0-dev libcairo2-dev libssl-dev

      - name: Download Web editor preview
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview

      - name: Verify packaged engine preview
        shell: pwsh
        run: |
          foreach ($file in @("index.html", "index.js", "index.wasm", "index.data")) {
            if (!(Test-Path "build/web-editor-preview/apps/editor_preview/$file")) {
              throw "Missing web preview file: $file"
            }
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: ${{ matrix.cli_path }}

      - name: Make NovelTea host CLI executable
        if: runner.os == 'Linux'
        run: chmod +x build/cli/linux/noveltea

      - name: Build and verify native editor artifacts
        shell: pwsh
        env:
          NOVELTEA_CLI_PATH: ${{ github.workspace }}/${{ matrix.cli_executable }}
        run: pnpm -C editor run artifact -- --release-tag "$env:RELEASE_TAG"

      - name: Run permanent packaged-application smoke
        shell: pwsh
        run: pnpm -C editor run package:smoke

      - name: Install, invoke, and remove Linux editor packages
        if: runner.os == 'Linux'
        run: .github/linux-editor-installer-smoke.sh

      - name: Stage editor distributables
        shell: pwsh
        env:
          NOVELTEA_RELEASE_PLATFORM: ${{ matrix.platform }}
          NOVELTEA_RELEASE_ARCH: ${{ matrix.arch }}
        run: cmake -DNOVELTEA_PACKAGE_KIND=desktop-editor -DNOVELTEA_RELEASE_TAG="$env:RELEASE_TAG" -P cmake/PackageNovelTeaRelease.cmake

      - name: Upload editor release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-desktop-editor-${{ matrix.platform }}-${{ matrix.arch }}-release-dist
          path: dist/*
          if-no-files-found: error

      - name: Attest editor release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-editor-*

  release-inventory:
    name: Qualify exact release inventory
    runs-on: ubuntu-24.04
    needs: [release-metadata, desktop-hosts, web, android, desktop-editor, windows-cli]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: noveltea-*-release-dist
          path: dist
          merge-multiple: true

      - name: Generate player template registry index
        run: node .github/generate-template-registry.mjs dist "$RELEASE_TAG"

      - name: Enforce platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Generate checksums
        run: .github/package-release.sh checksums "$RELEASE_TAG"

      - name: Verify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG"

      - name: Upload qualified release
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [release-metadata, release-inventory]
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download qualified release
        uses: actions/download-artifact@v7
        with:
          name: noveltea-qualified-release
          path: dist

      - name: Reverify platform certification reports
        run: node scripts/platform-certification.mjs verify-set --directory dist

      - name: Reverify exact release inventory
        run: node .github/verify-release-inventory.mjs dist "$RELEASE_TAG" release-assets.txt

      - name: Attest complete player template set
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/noveltea-player-template-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < release-assets.txt
          for index in "${!assets[@]}"; do
            assets[$index]="dist/${assets[$index]}"
          done
          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --verify-tag
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
