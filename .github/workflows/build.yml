  production-desktop-launch-linux:
    name: Actual production player launch (${{ matrix.platform }}-${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    needs: [production-desktop-player-linux, production-linux-release-cli]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            variant: release
            candidate: linux-player-x64-release
            artifact: noveltea-candidate-linux-player-x64-release
            cli_candidate: linux-release-cli-x64
            cli_artifact: noveltea-candidate-linux-release-cli-x64
            cli_path: build/cli/linux
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            variant: devtools
            candidate: linux-player-x64-devtools
            artifact: noveltea-candidate-linux-player-x64-devtools
            cli_candidate: linux-release-cli-x64
            cli_artifact: noveltea-candidate-linux-release-cli-x64
            cli_path: build/cli/linux
    steps: &production-desktop-launch-steps
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Set up Linux display/graphics dependencies for actual player launch
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native
        with:
          graphics: "true"
          xvfb: "true"
      - name: Set up Python 3 for standalone native CLI export smoke
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore exact production player template candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/package/noveltea-player-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
      - name: Restore exact native platform export CLI candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: ${{ matrix.cli_path }}
      - name: Restore Unix executable permissions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "${{ matrix.cli_path }}/noveltea" "${{ matrix.cli_path }}/noveltea-ui-test-runner"
          chmod +x "${{ matrix.cli_path }}/tools/ffmpeg/bin/ffmpeg"
          chmod +x "build/package/noveltea-player-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}/bin/noveltea-player"
      - name: Rebuild test archive from the manifest-verified, byte-identical candidate tree
        env:
          CANDIDATE_ID: ${{ matrix.candidate }}
        run: |
          node scripts/ci/release-candidate.mjs verify --candidate ${{ matrix.cli_candidate }} --stage qualify
          node scripts/ci/materialize-candidate-template.mjs ${{ matrix.candidate }}
      - name: Provision pinned software OpenGL to test real Windows launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-software-opengl.ps1
      - name: Export and launch actual Linux production player
        if: matrix.platform == 'linux'
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/linux/noveltea-ui-test-runner
          NOVELTEA_PLAYER_HEADLESS_ERRORS: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          xvfb-run -a python3 tests/native_cli/linux_release_smoke.py \
            "$PWD/build/cli/linux/noveltea" \
            "$PWD/dist/noveltea-player-template-dev-$GITHUB_SHA-linux-x64-${{ matrix.variant }}.tar.gz" \
            "$PWD"
      - name: Export and launch actual Windows production player
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/windows/noveltea-ui-test-runner.exe
          NOVELTEA_PLAYER_HEADLESS_ERRORS: '1'
        run: |
          python tests/native_cli/windows_release_smoke.py `
            "${{ github.workspace }}/build/cli/windows/noveltea.exe" `
            "${{ github.workspace }}/dist/noveltea-player-template-dev-$env:GITHUB_SHA-windows-x64-${{ matrix.variant }}.zip" `
            "${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export and launch actual macOS production player
        if: matrix.platform == 'macos'
        shell: bash
        env:
          NOVELTEA_LICENSE_VIEWER_RUNNER: ${{ github.workspace }}/build/cli/macos/noveltea-ui-test-runner
          NOVELTEA_PLAYER_HEADLESS_ERRORS: '1'
        run: |
          python3 tests/native_cli/macos_release_smoke.py \
            "$PWD/build/cli/macos/noveltea" \
            "$PWD/dist/noveltea-player-template-dev-$GITHUB_SHA-macos-arm64-${{ matrix.variant }}.tar.gz" \
            "$PWD"

