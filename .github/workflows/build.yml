name: Build

on:
  push:
    branches: [master, main, fix-ci, ci/build-release-refactor-641]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
  EMSDK_VERSION: 6.0.0
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 256M
  CCACHE_BASEDIR: ${{ github.workspace }}
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_NDK_VERSION: "28.2.13676358"
  NOVELTEA_SHADERC_TOOLCHAIN_TAG: r6
  NOVELTEA_BUILD_IDENTITY: git:${{ github.sha }}

permissions:
  contents: read

# CI coverage split:
# - shader-assets compiles the shared glsl-330, essl-300, and metal shader tree.
# - Platform jobs consume the artifact with local shader compilation disabled.
# - Linux desktop, host CLI, and cooperative/no-thread coverage run independently.
# - Web player and editor-preview builds run independently so Electron can start from the preview artifact early.
# - Android cooperative coverage runs independently from the APK/export path used by emulator smoke tests.
# - Android export and Electron packaging consume the host CLI artifact without waiting for Linux tests.

jobs:
  cache-observation:
    name: Observe Actions cache at Build start
    if: github.repository == 'Cruel/nt' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record cache identities and occupied bytes before builds publish
        run: |
          gh cache list --repo Cruel/nt --limit 1000 --json id,key,ref,sizeInBytes,lastAccessedAt,createdAt
          gh api repos/Cruel/nt/actions/cache/usage

  editor-preflight:
    name: Editor independent typecheck and unit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Editor TypeScript and independent policy
        run: pnpm -C editor run check
      - name: Certify independent Editor schema and localization unit contracts
        run: >-
          pnpm -C editor exec vp test run
          src/renderer/test/authoring-project-schema.test.ts
          src/renderer/test/cldr-cardinal-rules.test.ts

  cxx-format:
    name: C++ formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Check C++ formatting
        run: >-
          cmake
          -DSOURCE_ROOT="$GITHUB_WORKSPACE"
          -DMODE=check
          -P "$GITHUB_WORKSPACE/cmake/RunClangFormat.cmake"

  cxx-runtime-policy:
    name: C++ runtime policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Audit prohibited runtime C++ constructs
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -DALLOWLIST="$GITHUB_WORKSPACE/cmake/cxx-policy-allowlist.txt" -P "$GITHUB_WORKSPACE/cmake/CheckCxxRuntimePolicy.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/VerifyCxxRuntimePolicyChecker.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -DALLOWLIST="$GITHUB_WORKSPACE/cmake/json-boundary-allowlist.txt" -P "$GITHUB_WORKSPACE/cmake/CheckJsonBoundaryPolicy.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/VerifyJsonBoundaryPolicyChecker.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -DCLASSIFICATION="$GITHUB_WORKSPACE/cmake/NovelTeaModuleFileClassification.cmake" -DALLOWLIST="$GITHUB_WORKSPACE/cmake/module-boundary-allowlist.txt" -P "$GITHUB_WORKSPACE/cmake/CheckModuleBoundaryPolicy.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/VerifyModuleBoundaryPolicyChecker.cmake"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pnpm for CI contract fixtures
        uses: pnpm/action-setup@v6
      - name: Install workspace dependencies for YAML contract tests
        run: pnpm install --frozen-lockfile
      - name: Verify Material contract projections
        run: node scripts/generate-material-contract-registry.mjs --check
      - name: Build host contracts with generated schema outputs
        run: |
          cmake -S tools/project_authoring -B build/native-authoring -DCMAKE_BUILD_TYPE=Release -DNOVELTEA_BUILD_AUTHORING_NODE_ADDON=ON
          node editor/scripts/generate-native-schema.mjs --output build/native-authoring/generated --check
          cmake --build build/native-authoring
          ctest --test-dir build/native-authoring --output-on-failure
      - name: Certify native and Zod Project contract parity
        env:
          NOVELTEA_SCHEMA_CERTIFY: ${{ github.workspace }}/build/native-authoring/noveltea-schema-certify
          NOVELTEA_YAML_CERTIFY: ${{ github.workspace }}/build/native-authoring/noveltea-yaml-certify
          NOVELTEA_ROOM_MAP_CERTIFY: ${{ github.workspace }}/build/native-authoring/noveltea-room-map-certify
        run: pnpm -C editor exec vp test run src/renderer/test/native-schema-generation.test.ts src/renderer/test/native-schema-parity.test.ts src/renderer/test/native-yaml-parity.test.ts src/renderer/test/native-room-map-parity.test.ts
      - name: Certify native Project worker and Node-API ownership
        env:
          NOVELTEA_AUTHORING_NODE_ADDON: ${{ github.workspace }}/build/native-authoring/noveltea-authoring-node.node
        run: |
          pnpm -C editor exec vp pack
          pnpm -C editor exec vp test run src/renderer/test/native-authoring-worker.test.ts
      - name: Set up coverage contract reporter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Test CI contracts
        run: node --test tests/ci/*.mjs
      - name: Test benchmark launcher configuration transport
        run: node --test scripts/run-benchmark-android.test.mjs scripts/run-benchmark-web.test.mjs
      - name: Verify compiler feature policy header
        run: |
          if c++ -std=c++20 -Iengine/include -x c++ -c engine/include/noveltea/core/compiler_policy.hpp -o /tmp/policy.o; then
            echo "policy header accepted an exception/RTTI-enabled compiler" >&2
            exit 1
          fi
          c++ -std=c++20 -fno-exceptions -fno-rtti -Iengine/include -x c++ -c engine/include/noveltea/core/compiler_policy.hpp -o /tmp/policy.o

  native-authoring-hosts:
    name: Native Project authoring (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Set up Linux Electron libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native
        with:
          graphics: "true"
          xvfb: "true"
      - name: Install macOS Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Build pinned native authoring host and Electron addon
        run: node editor/scripts/build-native-authoring-addon.mjs
      - name: Certify real native Project operations and source transactions
        run: ctest --test-dir build/native-authoring-host --output-on-failure -R '^native_authoring_(contracts|yaml|room_session|room_map|yaml_transaction)$'
      - name: Certify cross-platform source observation and clean-cache proofs
        run: >-
          ctest --test-dir build/native-authoring-host --output-on-failure
          -R '^native_authoring_(project_session|typed_reference_invalidation|source_watcher_races|clean_cache_path_alias|clean_cache_recovery|clean_cache_correctness|clean_cache_offline|cache_writer_processes)$'
      - name: Bundle dedicated Project worker
        run: pnpm -C editor exec vp pack
      - name: Certify native worker session / external watcher / revision / recovery
        env:
          NOVELTEA_AUTHORING_NODE_ADDON: ${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node
        run: |
          # Keep addon-backed suites in separate Vitest invocations: a native
          # worker crash must identify the failing suite instead of taking down
          # a second test-file worker without attribution.
          pnpm -C editor exec vp test run src/renderer/test/native-authoring-worker.test.ts
          pnpm -C editor exec vp test run src/renderer/test/native-authoring-reconciliation.test.ts --reporter=verbose
      - name: Diagnose Windows native authoring worker failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Native addon crashes may terminate a Vitest fork before it can
          # emit a JS exception. Capture recent Windows crash records.
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') } |
            Select-Object -First 12 TimeCreated, Id, ProviderName, Message |
            Format-List | Out-String -Width 240 | Write-Host
      - name: Certify addon inside Electron's worker runtime
        env:
          NOVELTEA_AUTHORING_NODE_ADDON: ${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node
        run: node editor/scripts/certify-native-authoring-electron.mjs

  shader-assets:
    name: Shader assets
    runs-on: ubuntu-24.04
    # Formatting is an independent required Build check, not a shader input.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: bash scripts/ci/install-apt-packages.sh cmake curl tar

      - name: Download standalone shaderc
        run: |
          shaderc_root="${{ github.workspace }}/.cache/shaderc"
          mkdir -p "$shaderc_root"
          curl -fL \
            -o "$shaderc_root/noveltea-bgfx-shaderc-linux-x64.tar.gz" \
            "https://github.com/Cruel/nt-tools/releases/download/$NOVELTEA_SHADERC_TOOLCHAIN_TAG/noveltea-bgfx-shaderc-linux-x64.tar.gz"
          tar -xzf "$shaderc_root/noveltea-bgfx-shaderc-linux-x64.tar.gz" -C "$shaderc_root"
          test -x "$shaderc_root/bin/shaderc"
          test -f "$shaderc_root/resources/bgfx_shader.sh"
          test -f "$shaderc_root/resources/bgfx_compute.sh"
          echo "SHADERC=$shaderc_root/bin/shaderc" >> "$GITHUB_ENV"
          echo "BGFX_SHADER_INCLUDE=$shaderc_root/resources" >> "$GITHUB_ENV"

      - name: Compile and verify shader assets
        run: |
          cmake \
            -DNOVELTEA_SHADERC_EXECUTABLE="$SHADERC" \
            -DNOVELTEA_SHADER_SOURCE_DIR="${{ github.workspace }}/engine/shaders/bgfx" \
            -DNOVELTEA_SHADER_OUTPUT_ROOT="${{ github.workspace }}/build/generated-assets/shaders" \
            '-DNOVELTEA_SHADER_VARIANTS=glsl-330;essl-300;metal' \
            -DNOVELTEA_BGFX_SHADER_INCLUDE_DIR="$BGFX_SHADER_INCLUDE" \
            -P "${{ github.workspace }}/cmake/CompileNovelTeaShaders.cmake"
          cmake \
            -DNOVELTEA_VERIFY_ONLY=ON \
            -DNOVELTEA_SHADER_OUTPUT_ROOT="${{ github.workspace }}/build/generated-assets/shaders" \
            '-DNOVELTEA_SHADER_VARIANTS=glsl-330;essl-300;metal' \
            -P "${{ github.workspace }}/cmake/CompileNovelTeaShaders.cmake"

      - name: Upload shader assets
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/generated-assets/shaders
          if-no-files-found: error

  linux-native-build:
    name: Linux Debug native build and policy
    runs-on: ubuntu-24.04
    needs: shader-assets
    # Retain cold-run headroom independently of the warm-cache speed target.
    timeout-minutes: 150
    outputs:
      test-build-id: ${{ steps.test-build.outputs.artifact-id }}
      feature-lab-id: ${{ steps.feature-lab-build.outputs.artifact-id }}
    env:
      # Debug C++ objects previously evicted almost the entire useful working set.
      CCACHE_MAXSIZE: 1536M

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reclaim unused toolchains before Linux native build
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Node native testing driver
        run: pnpm -C editor exec vp pack

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          xvfb: "true"
          extra-packages: libgl1-mesa-dri zstd

      - name: Set up vcpkg
        uses: ./.github/actions/setup-linux-vcpkg
        with:
          installed-dir: build/linux-debug/vcpkg_installed
          scope: linux-debug
          binary-scope: linux-debug

      - name: Set up compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: linux-debug

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Download prebuilt embedded bgfx tool closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/prebuilt-shaderc-download build/prebuilt-shaderc-toolchain
          gh release download "$NOVELTEA_SHADERC_TOOLCHAIN_TAG" \
            --repo Cruel/nt-tools \
            --pattern 'noveltea-bgfx-shaderc-linux-x64.tar.gz' \
            --pattern 'noveltea-bgfx-shaderc-linux-x64.tar.gz.sha256' \
            --dir build/prebuilt-shaderc-download
          (
            cd build/prebuilt-shaderc-download
            sha256sum -c noveltea-bgfx-shaderc-linux-x64.tar.gz.sha256
          )
          tar -xzf build/prebuilt-shaderc-download/noveltea-bgfx-shaderc-linux-x64.tar.gz \
            -C build/prebuilt-shaderc-toolchain
          echo "NOVELTEA_PREBUILT_SHADERC_ROOT=${{ github.workspace }}/build/prebuilt-shaderc-toolchain" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-debug -G Ninja \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DNOVELTEA_ENABLE_COVERAGE=OFF \
            -DNOVELTEA_BUILD_HOST_TOOLS=ON \
            -DNOVELTEA_PREBUILT_SHADERC_ROOT="$NOVELTEA_PREBUILT_SHADERC_ROOT" \
            -DNOVELTEA_COMPILE_SHADERS=OFF \
            -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Clang-certify standalone host Narrative sources
        run: python3 scripts/check-host-narrative-clang.py build/linux-debug/compile_commands.json

      # The authoring CLI certification executable is EXCLUDE_FROM_ALL, but
      # CTest still registers its named test. Build it before running CTest.
      - name: Build excluded native CLI certification target
        run: cmake --build --preset linux-debug --target noveltea-cli-native-certify

      - name: Verify native devtools composition
        run: |
          bash scripts/check-native-devtools-symbols.sh build/linux-debug/apps/sandbox/noveltea-sandbox on
          bash scripts/check-native-devtools-symbols.sh build/linux-debug/apps/player/noveltea-player on

      - name: Save compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Enforce C++ runtime and dependency policy
        run: cmake --build --preset linux-debug --target cxx-policy

      - name: Plan exact native CTest shards
        run: python3 scripts/ci/linux-native-shards.py plan

      - name: Package exact Linux Debug test build
        run: bash scripts/ci/linux-native-build-artifact.sh pack "$RUNNER_TEMP/noveltea-linux-native-test-build"

      - name: Upload exact Linux Debug test build
        id: test-build
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-linux-native-test-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noveltea-linux-native-test-build
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Remove uploaded full native archive
        run: rm -rf "$RUNNER_TEMP/noveltea-linux-native-test-build"

      - name: Package exact Linux Feature Lab runtime closure
        run: bash scripts/ci/linux-native-build-artifact.sh pack "$RUNNER_TEMP/noveltea-linux-feature-lab-build" feature-lab
      - name: Upload exact Linux Feature Lab runtime closure
        id: feature-lab-build
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-linux-feature-lab-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noveltea-linux-feature-lab-build
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Remove uploaded Feature Lab archive
        run: rm -rf "$RUNNER_TEMP/noveltea-linux-feature-lab-build"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  linux-native-ctest:
    name: Linux Debug CTest (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: linux-native-build
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [native-1, native-2, native-3, native-4, cli-1, cli-2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore native test build
        uses: ./.github/actions/restore-linux-native-build
        with:
          artifact-id: ${{ needs.linux-native-build.outputs.test-build-id }}
      - name: Run exact native CTest shard
        env:
          SHARD: ${{ matrix.shard }}
        run: xvfb-run -a python3 scripts/ci/linux-native-shards.py run "$SHARD"

  linux-native-feature-lab:
    name: Linux Debug Feature Lab authored Tests
    runs-on: ubuntu-24.04
    needs: linux-native-build
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore native test build
        uses: ./.github/actions/restore-linux-native-build
        with:
          artifact-id: ${{ needs.linux-native-build.outputs.feature-lab-id }}
          profile: feature-lab

      - name: Stage pinned FFmpeg for Feature Lab
        run: |
          node editor/scripts/private-media-tools.mjs build/coverage-media
          chmod +x build/coverage-media/tools/ffmpeg/bin/ffmpeg

      - name: Feature Lab authored Tests
        env:
          NOVELTEA_FFMPEG: ${{ github.workspace }}/build/coverage-media/tools/ffmpeg/bin/ffmpeg
          NOVELTEA_UI_TEST_RUNNER: ${{ github.workspace }}/build/linux-debug/tools/editor_tool/native-cli/noveltea-ui-test-runner
        run: |
          xvfb-run -a build/linux-debug/tools/editor_tool/native-cli/noveltea \
            --no-daemon --project tests/projects/feature-lab --json test run \
            > "$RUNNER_TEMP/noveltea-feature-lab-results.json"

  linux:
    name: Linux desktop native correctness
    runs-on: ubuntu-24.04
    needs: [linux-native-build, linux-native-ctest, linux-native-feature-lab]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require all native correctness witnesses
        env:
          BUILD_RESULT: ${{ needs.linux-native-build.result }}
          CTEST_RESULT: ${{ needs.linux-native-ctest.result }}
          FEATURE_LAB_RESULT: ${{ needs.linux-native-feature-lab.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CTEST_RESULT" = success
          test "$FEATURE_LAB_RESULT" = success

  linux-cli:
    name: Linux host CLI
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 120
    outputs:
      cli-id: ${{ steps.host-cli-upload.outputs.artifact-id }}
      cli-attempt: ${{ steps.cli-attempt.outputs.attempt }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          clang: "true"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-linux-vcpkg
        with:
          installed-dir: build/linux-authoring-release/vcpkg_installed
          scope: linux-authoring-release
          binary-scope: linux-authoring-release
          binary-fallback-scope: linux-debug

      - name: Cache embedded bgfx host-tool build
        uses: actions/cache@v5
        with:
          path: |
            build/linux-authoring-release/_deps/bgfx.cmake-src
            build/linux-authoring-release/_deps/bgfx.cmake-build
            build/linux-authoring-release/tools/editor_tool/CMakeFiles/noveltea_bgfx_shaderc_embedded.dir
            build/linux-authoring-release/tools/editor_tool/libnoveltea_bgfx_shaderc_embedded.a
            build/linux-authoring-release/tools/editor_tool/CMakeFiles/noveltea_bimg_texturec_embedded.dir
            build/linux-authoring-release/tools/editor_tool/libnoveltea_bimg_texturec_embedded.a
          key: ${{ runner.os }}-x64-embedded-bgfx-tools-${{ hashFiles('cmake/NovelTeaEmbeddedShaderc.cmake', 'cmake/patch-bimg-texturec-entry.cmake', 'cmake/ApplyGitPatchOnce.cmake', 'cmake/patches/bgfx-shaderc-fcpp-value-stack.patch', 'engine/src/render/embedded_bgfx_resources.hpp.in', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}

      - name: Set up compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: linux-authoring-release

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Download prebuilt embedded bgfx tool closure
        if: env.NOVELTEA_SHADERC_TOOLCHAIN_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/prebuilt-shaderc-download build/prebuilt-shaderc-toolchain
          gh release download "$NOVELTEA_SHADERC_TOOLCHAIN_TAG" \
            --repo Cruel/nt-tools \
            --pattern 'noveltea-bgfx-shaderc-linux-x64.tar.gz' \
            --pattern 'noveltea-bgfx-shaderc-linux-x64.tar.gz.sha256' \
            --dir build/prebuilt-shaderc-download
          (
            cd build/prebuilt-shaderc-download
            sha256sum -c noveltea-bgfx-shaderc-linux-x64.tar.gz.sha256
          )
          tar -xzf build/prebuilt-shaderc-download/noveltea-bgfx-shaderc-linux-x64.tar.gz \
            -C build/prebuilt-shaderc-toolchain
          echo "NOVELTEA_PREBUILT_SHADERC_ROOT=${{ github.workspace }}/build/prebuilt-shaderc-toolchain" >> "$GITHUB_ENV"

      - name: Build NovelTea host CLI
        run: node scripts/ci/time-command.mjs linux-cli-build-and-link pnpm -C editor run noveltea:build

      - name: Certify optimized incremental, dependency mutation and external stage parity
        run: |
          python3 tests/native_cli/incremental_validation_certification.py "$PWD/build/cli/linux/noveltea" "$PWD"
          python3 tests/native_cli/dependency_mutation_certification.py "$PWD/build/cli/linux/noveltea" "$PWD"
          python3 tests/native_cli/shader_validation_cache.py "$PWD/build/cli/linux/noveltea" "$PWD/tests/projects/feature-lab"
          python3 tests/native_cli/portable_validation_cache.py "$PWD/build/cli/linux/noveltea" "$PWD/tests/projects/feature-lab"

      - name: Certify exhaustive native CLI public command inventory
        run: node editor/scripts/certify-native-cli-inventory.mjs "$PWD/build/cli/linux/noveltea"

      - name: Certify native CLI Project mutation parity
        run: |
          cmake --build --preset linux-authoring-release --target noveltea-cli-native-certify
          # The host CLI release preset does not register CTests. Invoke the
          # optimized certification executable directly, so this cannot
          # silently succeed with "No tests were found".
          build/linux-authoring-release/tools/editor_tool/noveltea-cli-native-certify \
            "$PWD/tests/projects/feature-lab"
          node editor/scripts/certify-native-cli-mutations.mjs \
            "$PWD/build/cli/linux/noveltea" \
            "$PWD/build/linux-authoring-release/tools/editor_tool/noveltea-cli-native-certify" \
            tests/projects/feature-lab

      - name: Certify staged native CLI Project routing parity
        run: node editor/scripts/certify-native-cli-project-routing.mjs "$PWD/build/cli/linux/noveltea"

      - name: Certify native CLI Project lifecycle and negative archive admission
        run: node editor/scripts/certify-native-cli-lifecycle.mjs "$PWD/build/cli/linux/noveltea"

      - name: Certify native CLI transport and error parity
        run: node editor/scripts/certify-native-cli-transport.mjs "$PWD/build/cli/linux/noveltea"

      - name: Certify concurrent source membership and mount containment
        run: |
          python3 tests/native_cli/source_observation_race.py "$PWD/build/cli/linux/noveltea" "$PWD"
          python3 tests/native_cli/source_observation_mount.py "$PWD/build/cli/linux/noveltea" "$PWD"

      - name: Certify native CLI platform preflight and publication parity
        run: node editor/scripts/certify-native-cli-platform.mjs "$PWD/build/cli/linux/noveltea"

      - name: Certify installed native platform template and config commands
        env:
          NOVELTEA_NATIVE_CLI_BINARY: ${{ github.workspace }}/build/cli/linux/noveltea
        run: pnpm -C editor exec vp test src/renderer/test/native-platform-command-contracts.test.ts

      - name: Certify cross-host native macOS and Android export and publication recovery
        run: |
          cmake --preset linux-authoring-release -DNOVELTEA_CLI_CROSS_HOST_EXPORT_CERTIFY=ON -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets"
          cmake --build --preset linux-authoring-release --target noveltea-cli-macos-export-certify noveltea-cli-android-export-certify noveltea-cli-platform-publication-certify
          ctest --test-dir build/linux-authoring-release --output-on-failure -R '^native_cli_(macos_export|android_export|platform_publication)$'

      - name: Certify native CLI Test and Runtime Package candidates
        run: |
          node editor/scripts/certify-native-cli-tests.mjs "$PWD/build/cli/linux/noveltea"
          node editor/scripts/certify-native-cli-package.mjs "$PWD/build/cli/linux/noveltea"

      - name: Save compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Audit Linux host CLI ABI floor
        run: |
          cmake \
            -DNOVELTEA_BINARY="$PWD/build/cli/linux/noveltea" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.39 \
            -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.32 \
            -P cmake/AuditNovelTeaLinuxCompatibility.cmake

      - name: Produce source-owned Linux CLI candidate manifest
        run: node scripts/ci/release-candidate.mjs produce --candidate linux-host-cli-x64

      - name: Verify CLI shader output matches canonical shader assets
        run: |
          cmake \
            -DNOVELTEA_CLI_EXECUTABLE="${{ github.workspace }}/build/cli/linux/noveltea" \
            -DNOVELTEA_SHADER_SOURCE_DIR="${{ github.workspace }}/engine/shaders/bgfx" \
            -DNOVELTEA_SHADER_OUTPUT_ROOT="${{ github.workspace }}/build/cli-shader-assets" \
            '-DNOVELTEA_SHADER_VARIANTS=glsl-330;essl-300;metal' \
            -DNOVELTEA_BGFX_SHADER_INCLUDE_DIR="${{ github.workspace }}/build/linux-authoring-release/_deps/bgfx.cmake-src/bgfx/src" \
            -P "${{ github.workspace }}/cmake/CompileNovelTeaShaders.cmake"
          diff --recursive --brief \
            build/prebuilt-shader-assets/shaders \
            build/cli-shader-assets/shaders

      - name: Upload CLI certification shader headers
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-cli-certification-shader-headers
          path: build/linux-authoring-release/_deps/bgfx.cmake-src/bgfx/src
          if-no-files-found: error

      - name: Record host CLI producer attempt
        id: cli-attempt
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload NovelTea host CLI
        id: host-cli-upload
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-host-cli-linux-x64
          path: build/cli/linux
          if-no-files-found: error

      - name: Build renderer required by native production closure
        run: pnpm -C editor exec vp build

      - name: Build Electron bundles required by native production closure
        run: pnpm -C editor exec vp pack

      # The ordinary shipped editor and standalone CLI are native-only. Their
      # proof must bind the installed native executable and UI Test runner;
      # Electron's emitted module roots are certified separately.
      - name: Certify native production closure
        run: |
          pnpm -C editor run check:native-production-closure
          pnpm -C editor run noveltea:certify:native-cli-inventory

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  linux-cli-certify:
    name: Linux native production CLI certification
    runs-on: ubuntu-24.04
    needs: linux-cli
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Download CLI certification shader headers
        uses: actions/download-artifact@v7
        with:
          name: noveltea-cli-certification-shader-headers
          path: build/linux-authoring-release/_deps/bgfx.cmake-src/bgfx/src

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-host-cli-linux-x64
          path: build/cli/linux

      - name: Restore executable bits for artifact verification
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner build/cli/linux/tools/ffmpeg/bin/ffmpeg

      - name: Verify exact Build-produced Linux CLI candidate
        run: node scripts/ci/release-candidate.mjs verify --candidate linux-host-cli-x64 --stage qualify

      - name: Build native editor production bundles
        run: pnpm -C editor exec vp pack

      - name: Build renderer required by installed CLI production certification
        run: pnpm -C editor exec vp build

      - name: Certify installed native CLI production
        run: pnpm -C editor run noveltea:certify -- "$PWD/build/cli/linux/noveltea" --cli-only

  windows-native-build:
    name: Windows MSVC native test build
    runs-on: windows-2025
    needs: shader-assets
    # A cold MSVC/vcpkg build plus the full native CLI cache certifications can
    # exceed 90 minutes on GitHub-hosted runners. Keep this temporary headroom
    # until the Windows build and test stages can be shortened.
    timeout-minutes: 150
    outputs:
      test-id: ${{ steps.native-test-build.outputs.artifact-id }}
    env:
      WINDOWS_NATIVE_LANE: build
      WINDOWS_NATIVE_CACHE_SCOPE: windows-msvc-release
      CCACHE_MAXSIZE: 1280M

    steps: &windows-native-build-steps
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up repository Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies for native Agent Kit generation
        run: pnpm install --frozen-lockfile

      - name: Set up identical CTest Python interpreter
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Set up MSVC developer environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore repository-managed vcpkg environment
        shell: pwsh
        run: |
          # The MSVC developer environment may expose Visual Studio's bundled
          # vcpkg. Keep CI on the cached checkout used by this repository.
          "VCPKG_ROOT=${{ github.workspace }}/.cache/vcpkg" >> $env:GITHUB_ENV

      - name: Install compiler cache
        shell: pwsh
        run: choco install ccache --yes --no-progress

      # Cache only compressed compiled packages: the installed .lib tree is
      # derived from them and may contain multi-gigabyte uncompressed archives.
      # Windows production players restore this same compatible closure.
      - name: Cache Windows compiled vcpkg dependencies
        if: env.WINDOWS_NATIVE_LANE == 'build'
        uses: actions/cache@v5
        with: &windows-vcpkg-cache
          path: .cache/vcpkg-binary
          key: windows-2025-x64-vcpkg-compiled-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            windows-2025-x64-vcpkg-compiled-v2-

      - name: Restore Windows compiled vcpkg dependencies for policy
        if: env.WINDOWS_NATIVE_LANE == 'policy'
        uses: actions/cache/restore@v5
        with: *windows-vcpkg-cache

      - name: Restore Windows compiler outputs
        id: windows-ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: ${{ env.WINDOWS_NATIVE_CACHE_SCOPE }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          node scripts/ci/pin-vcpkg.mjs
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Configure Windows release
        shell: pwsh
        run: cmake --preset windows-release -G Ninja -DVCPKG_MANIFEST_FEATURES=tests -DNOVELTEA_BUILD_HOST_TOOLS=ON -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Windows lightweight native tests
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: cmake --build --preset windows-release --target noveltea_daemon_tests noveltea_runtime_cache_probe_tests noveltea_windows_project_watcher_tests

      - name: Build Windows native Project transaction certifications
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: cmake --build --preset windows-release --target noveltea-yaml-transaction-certify noveltea-room-session-certify noveltea-room-map-certify noveltea-project-session-certify

      - name: Build shipped Windows targets
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: cmake --build --preset windows-release --target noveltea-player noveltea-tooling-bridge

      # Exercise the standalone *C++* exporter, not just the established
      # TypeScript host CLI or a cross-host PE writer compiled on Linux.
      - name: Build native Windows platform exporter certification targets
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: cmake --build --preset windows-release --target noveltea-native-cli noveltea-cli-windows-pe-certify noveltea-cli-platform-publication-certify noveltea-cli-macos-export-certify

      - name: Generate current Windows player template
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: |
          $tag = 'ci-${{ github.sha }}'
          cmake -DNOVELTEA_TEMPLATE_PRESET=windows-release `
            -DNOVELTEA_TEMPLATE_PLATFORM=windows -DNOVELTEA_TEMPLATE_ARCH=x64 `
            "-DNOVELTEA_RELEASE_TAG=$tag" -P cmake/PackageNovelTeaPlayerTemplate.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack exact Windows MSVC native test closure
        if: env.WINDOWS_NATIVE_LANE == 'build'
        shell: pwsh
        run: python scripts/ci/windows-native-test-build.py pack "$env:RUNNER_TEMP/windows-native-test-build"

      - name: Upload exact Windows MSVC native test closure
        id: native-test-build
        if: env.WINDOWS_NATIVE_LANE == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-windows-native-test-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-native-test-build
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Enforce Windows C++ runtime and dependency policy
        if: env.WINDOWS_NATIVE_LANE == 'policy'
        shell: pwsh
        run: cmake --build --preset windows-release --target cxx-policy

      # Each lane owns a distinct object-cache namespace. Only the native
      # build publishes the compiled vcpkg package cache; policy owns its
      # public-header probe objects and cannot overwrite the native closure.
      - name: Save Windows compiler outputs
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.windows-ccache.outputs.primary-key }}
          cache-hit: ${{ steps.windows-ccache.outputs.cache-hit }}

      - name: Report Windows compiler cache
        if: always()
        shell: pwsh
        run: ccache --show-stats


  windows-native-policy:
    name: Windows MSVC C++ runtime and dependency audit
    runs-on: windows-2025
    needs: shader-assets
    timeout-minutes: 150
    env:
      WINDOWS_NATIVE_LANE: policy
      WINDOWS_NATIVE_CACHE_SCOPE: windows-msvc-policy-release
      CCACHE_MAXSIZE: 256M
    steps: *windows-native-build-steps

  windows-native-tests:
    name: Windows MSVC native certification (${{ matrix.suite }})
    runs-on: windows-2025
    needs: windows-native-build
    timeout-minutes: 90
    env:
      # Native Project YAML, JSON, and subprocess contracts are UTF-8.
      # Python 3.12 otherwise inherits the Windows ANSI code page.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        suite: [lightweight, validation, platform, interop]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up repository Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies for native Agent Kit generation
        run: pnpm install --frozen-lockfile

      - name: Set up identical CTest Python interpreter
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Set up MSVC developer environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Require exact Windows producer artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.windows-native-build.outputs.test-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download exact Windows MSVC native test closure
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-native-build.outputs.test-id }}
          path: ${{ runner.temp }}/windows-native-test-build

      - name: Authenticate and restore Windows MSVC native test closure
        shell: pwsh
        run: |
          python scripts/ci/windows-native-test-build.py restore "$env:RUNNER_TEMP/windows-native-test-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/windows-native-test-build"

      - name: Test Windows lightweight native suites
        if: matrix.suite == 'lightweight'
        shell: pwsh
        run: ctest --test-dir build/windows-release --output-on-failure --no-tests=error -L early-windows



      - name: Diagnose Windows lightweight native crash
        if: failure() && matrix.suite == 'lightweight'
        shell: pwsh
        run: |
          # CTest reports a Windows fast-fail code but not the faulting module.
          # Preserve the crash evidence without turning the failed job green.
          ctest --test-dir build/windows-release --output-on-failure --no-tests=error --rerun-failed
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') } |
            Select-Object -First 12 TimeCreated, Id, ProviderName, Message |
            Format-List | Out-String -Width 240 | Write-Host

      - name: Certify Windows native Project transaction commit and recovery
        if: matrix.suite == 'lightweight'
        shell: pwsh
        run: ctest --test-dir build/windows-release --output-on-failure --no-tests=error -R '^native_authoring_(yaml_transaction|room_session|room_map|project_session)$'

      - name: Certify native Windows incremental validation, external stages and recovery
        if: matrix.suite == 'validation'
        shell: pwsh
        run: |
          ctest --test-dir build/windows-release --output-on-failure --no-tests=error -R '^native_cli_(incremental_validation_certification|shader_validation_cache|portable_validation_cache)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }



      - name: Certify native Windows platform exports and publication recovery
        if: matrix.suite == 'platform'
        shell: pwsh
        run: |
          ctest --test-dir build/windows-release --output-on-failure --no-tests=error -R '^native_cli_(windows_pe_resources|platform_publication|platform_commands|public_contract|macos_export)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Certify Windows installed CLI candidate repair and unsafe paths
        if: matrix.suite == 'platform'
        shell: pwsh
        run: |
          ctest --test-dir build/windows-release --output-on-failure --no-tests=error -R '^native_cli_repair_project$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned software OpenGL for Windows player launch
        if: matrix.suite == 'platform'
        shell: pwsh
        run: ./scripts/setup-windows-software-opengl.ps1

      - name: Build Windows editor validation addon for real cache-writer interop
        if: matrix.suite == 'interop'
        run: node editor/scripts/build-native-authoring-addon.mjs --addon-only

      - name: Certify Windows CLI/editor cache-writer handoff
        if: matrix.suite == 'interop'
        shell: pwsh
        run: |
          python tests/native_cli/cache_writer_cli_editor.py "${{ github.workspace }}/build/windows-release/tools/editor_tool/native-cli/noveltea.exe" "${{ github.workspace }}/build/native-authoring-host/noveltea-authoring-node.node" "${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch exact current Windows player template through native C++ export
        if: matrix.suite == 'platform'
        shell: pwsh
        run: |
          $tag = 'ci-${{ github.sha }}'
          python tests/native_cli/windows_release_smoke.py `
            "${{ github.workspace }}/build/windows-release/tools/editor_tool/native-cli/noveltea.exe" `
            "${{ github.workspace }}/dist/noveltea-player-template-$tag-windows-x64-release.zip" `
            "${{ github.workspace }}" `
            "${{ github.workspace }}/dist/noveltea-native-windows-build-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native Windows export/launch qualification evidence
        if: always() && matrix.suite == 'platform'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-native-windows-export-ci-${{ github.sha }}
          path: dist/noveltea-native-windows-build-certification.json
          if-no-files-found: warn


  windows:
    name: Windows C++ policy
    runs-on: ubuntu-24.04
    needs: [windows-native-build, windows-native-policy, windows-native-tests]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require every Windows correctness lane
        env:
          BUILD_RESULT: ${{ needs.windows-native-build.result }}
          POLICY_RESULT: ${{ needs.windows-native-policy.result }}
          TEST_RESULT: ${{ needs.windows-native-tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$TEST_RESULT" = success

  web-preview:
    name: Web editor preview
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${{ github.workspace }}/.cache/emsdk"
          cd "${{ github.workspace }}/.cache/emsdk"
          ./emsdk install $EMSDK_VERSION
          ./emsdk activate $EMSDK_VERSION

      - name: Set up compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: emscripten-preview-${{ env.EMSDK_VERSION }}
          fallback-scope: emscripten-${{ env.EMSDK_VERSION }}

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Verify devtools-off transport and build editor preview
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake --preset web-editor-preview -G Ninja -DNOVELTEA_ENABLE_DEVTOOLS=OFF -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-editor-preview --target noveltea-editor-preview
          node scripts/check-web-editor-preview-exports.mjs build/web-editor-preview/apps/editor_preview/index.js off

          emcmake cmake --preset web-editor-preview -G Ninja -DNOVELTEA_ENABLE_DEVTOOLS=ON -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-editor-preview --target noveltea-editor-preview
          node scripts/check-web-editor-preview-exports.mjs build/web-editor-preview/apps/editor_preview/index.js on

      - name: Save compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify editor preview
        run: |
          test -f build/web-editor-preview/apps/editor_preview/index.data
          test -f build/web-editor-preview/apps/editor_preview/index.html
          test -f build/web-editor-preview/apps/editor_preview/index.js
          test -f build/web-editor-preview/apps/editor_preview/index.wasm
          ! grep -q '/assets/project/rmlui/lua_demo.rml' build/web-editor-preview/apps/editor_preview/index.js

      - name: Upload editor preview
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-editor-preview
          path: build/web-editor-preview/apps/editor_preview
          if-no-files-found: error

  web:
    name: Web / Emscripten
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${{ github.workspace }}/.cache/emsdk"
          cd "${{ github.workspace }}/.cache/emsdk"
          ./emsdk install $EMSDK_VERSION
          ./emsdk activate $EMSDK_VERSION

      - name: Set up compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: emscripten-release-${{ env.EMSDK_VERSION }}
          fallback-scope: emscripten-${{ env.EMSDK_VERSION }}

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Canonical threaded Web release player coverage
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake --preset web-release -G Ninja -DNOVELTEA_COMPILE_SHADERS=OFF -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset web-release --target noveltea-player
          node scripts/check-web-release-wasm.mjs build/web-release/apps/player/player.wasm build/web-release/apps/player/player.wasm.debug.wasm

      - name: Save compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Package canonical threaded Web player
        env:
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          cmake -DNOVELTEA_TEMPLATE_PRESET=web-release -DNOVELTEA_RELEASE_TAG="dev-$GITHUB_SHA" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake

      - name: Upload canonical threaded Web player
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-web-player-threads-release
          path: |
            dist/noveltea-player-template-dev-*-web-wasm32-threads-release.zip
            dist/web-wasm32-threads-release.template.json
          if-no-files-found: error

      - name: Include build-matched Web DWARF symbols in the canonical candidate
        run: |
          mkdir -p build/package/noveltea-player-web-wasm32-threads-release/symbols
          cp build/web-release/apps/player/player.wasm.debug.wasm \
            build/package/noveltea-player-web-wasm32-threads-release/symbols/player.wasm.debug.wasm
      - name: Manifest and qualify canonical threaded Web production template
        uses: ./.github/actions/produce-candidate
        with:
          candidate: web-player-threads-release

  production-web-variants:
    name: Web production candidate (${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - web-player-no-threads-release
          - web-player-threads-devtools
          - web-player-no-threads-devtools
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Set up native and Emscripten build tools
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"
      - name: Install exact Emscripten SDK release
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$GITHUB_WORKSPACE/.cache/emsdk"
          cd "$GITHUB_WORKSPACE/.cache/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Restore compatible compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: ${{ matrix.candidate }}-emsdk-${{ env.EMSDK_VERSION }}
      - name: Download certified shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets
      - name: Compile and qualify optimized Web variant
        env:
          CANDIDATE_ID: ${{ matrix.candidate }}
          EMSDK: ${{ github.workspace }}/.cache/emsdk
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          preset="$(node scripts/ci/release-candidate.mjs describe --candidate "$CANDIDATE_ID" --field preset)"
          emcmake cmake --preset "$preset" -G Ninja \
            -DNOVELTEA_COMPILE_SHADERS=OFF \
            -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="$GITHUB_WORKSPACE/build/prebuilt-shader-assets" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          node scripts/ci/time-command.mjs "$preset-build-and-link" \
            cmake --build --preset "$preset" --target noveltea-player
          node scripts/check-web-release-wasm.mjs "build/$preset/apps/player/player.wasm" "build/$preset/apps/player/player.wasm.debug.wasm"
          if [[ "$preset" == *no-threads* ]]; then
            ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)|MessageChannel' "build/$preset/apps/player/player.js"
          else
            ! grep -aE 'noveltea_preview_|noveltea_runtime_(set_variable|give_object|teleport_room|debug_snapshot)' "build/$preset/apps/player/player.js"
          fi
          cmake -DNOVELTEA_TEMPLATE_PRESET="$preset" -DNOVELTEA_RELEASE_TAG="dev-$GITHUB_SHA" -P cmake/PackageNovelTeaWebPlayerTemplate.cmake
      - name: Save compatible compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
      - name: Include exact build-matched Web DWARF symbols for release packaging
        env:
          CANDIDATE_ID: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          preset="$(node scripts/ci/release-candidate.mjs describe --candidate "$CANDIDATE_ID" --field preset)"
          root="$(node scripts/ci/release-candidate.mjs describe --candidate "$CANDIDATE_ID" --field root)"
          mkdir -p "$root/symbols"
          cp "build/$preset/apps/player/player.wasm.debug.wasm" "$root/symbols/player.wasm.debug.wasm"
      - name: Manifest and upload qualified Web candidate
        uses: ./.github/actions/produce-candidate
        with:
          candidate: ${{ matrix.candidate }}
      - name: Report compiler-cache statistics
        if: always()
        run: ccache --show-stats

  examples:
    name: Development examples qualification
    runs-on: ubuntu-24.04
    needs: [linux-cli, web]
    timeout-minutes: 30

    steps:
      - name: Checkout NovelTea
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pinned examples revision
        id: examples-pin
        run: |
          revision="$(node -e 'const fs=require("fs"); const value=fs.readFileSync("examples/noveltea-examples.revision", "utf8").trim(); if (!/^[0-9a-f]{40}$/.test(value)) process.exit(1); process.stdout.write(value)')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned public examples
        uses: actions/checkout@v6
        with:
          repository: Cruel/noveltea-examples
          ref: ${{ steps.examples-pin.outputs.revision }}
          path: build/noveltea-examples
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Linux runtime dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          name: noveltea-host-cli-linux-x64
          path: build/examples-toolchain

      - name: Download canonical threaded Web player
        uses: actions/download-artifact@v7
        with:
          name: noveltea-web-player-threads-release
          path: build/examples-toolchain/player

      - name: Qualify pinned examples
        run: |
          chmod +x build/examples-toolchain/noveltea build/examples-toolchain/tools/ffmpeg/bin/ffmpeg
          mapfile -t player_templates < <(find build/examples-toolchain/player -maxdepth 1 -type f -name 'noveltea-player-template-*-web-wasm32-threads-release.zip' -print)
          test "${#player_templates[@]}" -eq 1
          node scripts/qualify-examples.mjs \
            --examples-root build/noveltea-examples \
            --nt-revision "$GITHUB_SHA" \
            --cli build/examples-toolchain/noveltea \
            --player-template "${player_templates[0]}" \
            --player-descriptor build/examples-toolchain/player/web-wasm32-threads-release.template.json \
            --output build/qualified-examples

      - name: Upload qualified development examples
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-development-examples
          path: build/qualified-examples
          if-no-files-found: error

  # Site is an independent workflow_run consumer of the exact Build examples.
  # Cloudflare/Pages failures must never fail otherwise successful Build.
  android-debug-build:
    name: Android x86_64 debug build
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 90
    outputs:
      template-id: ${{ steps.debug-template.outputs.artifact-id }}
      candidate-id: ${{ steps.diagnostic-candidate.outputs.artifact-id }}
      candidate-attempt: ${{ steps.android-attempt.outputs.attempt }}
    env:
      CCACHE_MAXSIZE: 512M

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-android-sdk-android${{ env.ANDROID_API_LEVEL }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK packages
        run: scripts/ci/install-android-sdk-packages.sh

      - name: Download SDL3 Android AAR
        run: |
          mkdir -p android/app/libs .cache/sdl3-android
          curl -L \
            -o .cache/sdl3-android/SDL3-devel-3.4.10-android.zip \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-android.zip
          unzip -p \
            .cache/sdl3-android/SDL3-devel-3.4.10-android.zip \
            SDL3-3.4.10.aar \
            > android/app/libs/SDL3-3.4.10.aar

      - name: Set up compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: android-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Download shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download checksum-pinned bundletool
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/bundletool-all-1.18.1.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -

      - name: Build Android debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: bash ../scripts/ci/retry-gradle-network.sh ./gradlew --no-daemon :app:assembleDebug -PnovelteaAbi=x86_64 -PnovelteaCompileShaders=OFF -PnovelteaPrebuiltShaderAssetRoot="${{ github.workspace }}/build/prebuilt-shader-assets" -PnovelteaUseCcache=true

      - name: Save compiler cache
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Enforce Android C++ runtime and dependency policy
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -DALLOWLIST="$GITHUB_WORKSPACE/cmake/cxx-policy-allowlist.txt" -P "$GITHUB_WORKSPACE/cmake/CheckCxxRuntimePolicy.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/VerifyCxxRuntimePolicyChecker.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -DALLOWLIST="$GITHUB_WORKSPACE/cmake/json-boundary-allowlist.txt" -P "$GITHUB_WORKSPACE/cmake/CheckJsonBoundaryPolicy.cmake"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/cmake/VerifyJsonBoundaryPolicyChecker.cmake"
          build_dir=$(find android/app/.cxx/Debug -path '*/x86_64/compile_commands.json' -printf '%T@ %h\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$build_dir"
          cmake -DBUILD_DIR="$build_dir" -DPLATFORM_NAME=Android -P cmake/VerifyDependencyCompilerPolicy.cmake

      - name: Verify Android packaged assets
        working-directory: android
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/system/shaders/bgfx/essl-300/triangle.vs.bin'
          for shader in triangle quad text imgui rmlui; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/system/shaders/bgfx/essl-300/${shader}\.vs\.bin"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/system/shaders/bgfx/essl-300/${shader}\.fs\.bin"
          done
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/x86_64/libnoveltea-player.so'
          ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eiq 'sandbox|assets/project|lua_demo'

      - name: Package immutable x86_64 Android player template
        run: cmake -DNOVELTEA_RELEASE_TAG=ci-${GITHUB_SHA} -DNOVELTEA_ANDROID_ABI=x86_64 -DNOVELTEA_ANDROID_FLAVOR=debug -DNOVELTEA_BUNDLETOOL_JAR="${{ github.workspace }}/build/tools/bundletool-all-1.18.1.jar" -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake

      - name: Verify prebuilt Android player template
        run: |
          template_root="build/package/android-x86_64-debug/source/android"
          test -f "$template_root/prebuilt-native/x86_64/libnoveltea-player.so"
          test -f "$template_root/prebuilt-native/x86_64/libSDL3.so"
          test -f "$template_root/prebuilt-system/fonts/LiberationSans.ttf"
          test ! -e "build/package/android-x86_64-debug/source/CMakeLists.txt"
          test ! -e "build/package/android-x86_64-debug/source/engine"
          test ! -e "build/package/android-x86_64-debug/source/apps"
          node -e '
            const descriptor = require("./build/package/android-x86_64-debug/template.json");
            if (descriptor.host.tools.includes("android-ndk") || descriptor.host.tools.includes("cmake")) process.exit(1);
            if (!descriptor.host.tools.includes("java") || !descriptor.host.tools.includes("android-sdk")) process.exit(1);
          '
      - name: Record Android candidate producer attempt
        id: android-attempt
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Manifest and qualify distinct Android x86_64 diagnostic candidate
        id: diagnostic-candidate
        uses: ./.github/actions/produce-candidate
        with:
          candidate: android-player-x64-debug
      - name: Upload immutable debug template and export reports
        id: debug-template
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-debug-export
          path: |
            dist/noveltea-player-template-*-android-x86_64-debug.tar.gz
            dist/android-x86_64-debug.*
          if-no-files-found: error


  android:
    name: Android
    runs-on: ubuntu-24.04
    needs: [android-debug-build, linux-cli]
    if: ${{ always() }}
    timeout-minutes: 30
    steps:
      - name: Require successful exact Android and CLI producers
        env:
          ANDROID_RESULT: ${{ needs.android-debug-build.result }}
          CLI_RESULT: ${{ needs.linux-cli.result }}
          TEMPLATE_ID: ${{ needs.android-debug-build.outputs.template-id }}
          CANDIDATE_ID: ${{ needs.android-debug-build.outputs.candidate-id }}
          CLI_ID: ${{ needs.linux-cli.outputs.cli-id }}
        run: |
          test "$ANDROID_RESULT" = success
          test "$CLI_RESULT" = success
          for id in "$TEMPLATE_ID" "$CANDIDATE_ID" "$CLI_ID"; do [[ "$id" =~ ^[1-9][0-9]*$ ]]; done
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          pkg-config: "true"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android export SDK packages (no NDK or CMake)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$ANDROID_API_LEVEL" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download NovelTea host CLI
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.linux-cli.outputs.cli-id }}
          path: build/cli/linux

      - name: Make NovelTea host CLI executables executable
        run: chmod +x build/cli/linux/noveltea build/cli/linux/noveltea-ui-test-runner build/cli/linux/tools/ffmpeg/bin/ffmpeg

      - name: Restore exact diagnostic candidate
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.android-debug-build.outputs.candidate-id }}
          path: build/package/android-x86_64-debug
      - name: Verify exact diagnostic candidate and Linux host CLI
        env:
          ANDROID_ATTEMPT: ${{ needs.android-debug-build.outputs.candidate-attempt }}
          CLI_ATTEMPT: ${{ needs.linux-cli.outputs.cli-attempt }}
        run: |
          for attempt in "$ANDROID_ATTEMPT" "$CLI_ATTEMPT"; do
            [[ "$attempt" =~ ^[1-9][0-9]*$ ]] && (( attempt <= GITHUB_RUN_ATTEMPT )) || exit 1
          done
          GITHUB_RUN_ATTEMPT="$ANDROID_ATTEMPT" node scripts/ci/release-candidate.mjs verify --candidate android-player-x64-debug --stage qualify
          GITHUB_RUN_ATTEMPT="$CLI_ATTEMPT" node scripts/ci/release-candidate.mjs verify --candidate linux-host-cli-x64 --stage qualify
      - name: Restore exact original debug template archive and reports
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.android-debug-build.outputs.template-id }}
          path: dist

      - name: Export fixture revisions through public project export CLI
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -f "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"
          config="$RUNNER_TEMP/noveltea-android-export-config.json"
          pnpm android:export-config -- --output "$config"

          template="${{ github.workspace }}/dist/noveltea-player-template-ci-${GITHUB_SHA}-android-x86_64-debug.tar.gz"
          for revision in 1 2; do
            fixture_root="$RUNNER_TEMP/noveltea-android-fixture-v${revision}"
            output="${{ github.workspace }}/dist/android-fixture-v${revision}"
            pnpm -C editor run android:fixture -- \
              --root "$fixture_root" \
              --revision "$revision" \
              --abi x86_64 \
              --flavor debug
            export NOVELTEA_TEMPLATE_REGISTRY_ROOT="$RUNNER_TEMP/noveltea-template-registry"
            "${{ github.workspace }}/build/cli/linux/noveltea" --json platform template install "$template" --force
            "${{ github.workspace }}/build/cli/linux/noveltea" --project "$fixture_root" --json platform export \
              --profile canonical-android-debug \
              --output "$output" \
              --config "$config" \
              --allow-untrusted-template \
              --allow-localization-warnings
          done

      - name: Upload first exported APK revision
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-fixture-v1
          path: dist/android-fixture-v1
          if-no-files-found: error

      - name: Upload updated exported APK revision
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-android-fixture-v2
          path: dist/android-fixture-v2
          if-no-files-found: error


  production-linux-release-cli:
    name: Linux Debian 12 production authoring CLI
    runs-on: ubuntu-24.04
    container:
      image: node:24.18.0-bookworm@sha256:4e9cb555d708e0829c9d93e5eeae9dfab0617b832ca436a690680e0fca735ef5
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Authorize exact checked-out source for Git inside the Debian container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Debian 12 native host dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          clang: "true"
          extra-packages: zstd python3-venv
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Verify pinned Node runtime
        run: test "$(node --version)" = 'v24.18.0'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore pinned Debian authoring dependencies
        uses: ./.github/actions/setup-linux-vcpkg
        with:
          installed-dir: build/linux-authoring-release/vcpkg_installed
          scope: linux-authoring-release
          binary-scope: linux-authoring-release
          cache-prefix: debian-12-glibc-2.36-x64
      - name: Restore Debian release CLI compiler objects
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: debian12-authoring-release
          compiler: g++
      - name: Compile actual Debian glibc 2.36 release CLI
        env:
          NOVELTEA_CLI_USE_CCACHE: "1"
        run: node scripts/ci/time-command.mjs linux-debian12-release-cli-build-and-link pnpm -C editor run noveltea:build
      - name: Save Debian release CLI compiler objects
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
      - name: Report Debian release CLI compiler-cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build required renderer and Electron native certification bundles
        run: |
          pnpm -C editor exec vp build
          pnpm -C editor exec vp pack
      - name: Certify shipped native Linux CLI public and functional contracts
        run: pnpm -C editor run noveltea:certify -- --cli-only
      - name: Audit Debian release CLI ABI and GNU C++ compatibility ceiling
        run: |
          cmake -DNOVELTEA_BINARY="$PWD/build/cli/linux/noveltea" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.36 -DNOVELTEA_MAX_GLIBCXX_VERSION=3.4.30 \
            -P cmake/AuditNovelTeaLinuxCompatibility.cmake
      - name: Manifest and upload Debian production CLI
        uses: ./.github/actions/produce-candidate
        with:
          candidate: linux-release-cli-x64

  production-host-cli-windows:
    name: Production host CLI build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    outputs:
      cli-id: ${{ steps.cli-candidate.outputs.artifact-id }}
    env:
      CCACHE_MAXSIZE: ${{ matrix.platform == 'windows' && '512M' || '256M' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            candidate: windows-release-cli-x64
            preset: windows-cli-gnu
    steps: &production-host-cli-steps
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install macOS build tools
        if: matrix.platform == 'macos'
        run: brew install ninja ccache
      - name: Install Windows compiler cache
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ccache --yes --no-progress
      - name: Restore compiled host vcpkg packages
        id: macos-vcpkg
        if: matrix.platform == 'macos'
        uses: actions/cache/restore@v5
        with:
          path: .cache/vcpkg-binary
          key: ${{ matrix.runner }}-host-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            ${{ matrix.runner }}-host-vcpkg-
      - name: Cache compiled Windows GNU CLI dependencies
        if: matrix.platform == 'windows'
        uses: actions/cache@v5
        with:
          path: .cache/vcpkg-binary
          key: windows-2025-x64-gnu-vcpkg-compiled-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**') }}
      - name: Bootstrap verified vcpkg revision
        shell: pwsh
        run: |
          node scripts/ci/pin-vcpkg.mjs
          if ("${{ matrix.platform }}" -eq "windows") {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MinGW GNU release compilers (not MSVC)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          llvm-strip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prefetch checksum-verified Windows Lua
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/ci/prefetch-lua-source.ps1
      - name: Restore production CLI compiler objects
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: ${{ matrix.platform == 'windows' && 'windows-gnu-cli-release' || 'macos-authoring-release' }}
          compiler: ${{ matrix.platform == 'windows' && 'g++' || 'clang++' }}
      - name: Compile actual GNU/AppleClang production CLI
        env:
          NOVELTEA_CLI_USE_CCACHE: "1"
        run: node scripts/ci/time-command.mjs ${{ matrix.preset }}-build-and-link pnpm -C editor run noveltea:build
      - name: Certify Windows GNU CLI has no unshipped dynamic runtime DLLs
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          foreach ($exe in @('build/cli/windows/noveltea.exe', 'build/cli/windows/noveltea-ui-test-runner.exe')) {
            $imports = & objdump -p $exe
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Windows PE imports: $exe" }
            $unsafe = @($imports | Select-String -Pattern 'DLL Name: (libgcc_s_.*|libstdc\+\+-6|libwinpthread-1)\.dll')
            if ($unsafe.Count) { throw "Unshipped GNU runtime DLL imports in $exe" }
          }
      - name: Audit macOS authoring deployment floor
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          minos="$(otool -l build/cli/macos/noveltea | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { seen=1; next } seen && $1 == "minos" { print $2; exit }')"
          test "$minos" = '14.0'
      - name: Manifest and upload actual native host CLI
        id: cli-candidate
        uses: ./.github/actions/produce-candidate
        with:
          candidate: ${{ matrix.candidate }}
      - name: Save qualified macOS CLI compiled vcpkg packages
        if: >-
          matrix.platform == 'macos' && github.event_name == 'push' &&
          github.ref == 'refs/heads/master' && github.repository == 'Cruel/nt' &&
          steps.macos-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/vcpkg-binary
          key: ${{ steps.macos-vcpkg.outputs.cache-primary-key }}
      - name: Save bounded production CLI compiler objects
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
      - name: Report production CLI compiler-cache statistics
        if: always()
        run: ccache --show-stats

  production-host-cli-macos:
    name: Production host CLI build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    outputs:
      cli-id: ${{ steps.cli-candidate.outputs.artifact-id }}
    env:
      CCACHE_MAXSIZE: ${{ matrix.platform == 'windows' && '512M' || '256M' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            candidate: macos-release-cli-arm64
            preset: macos-authoring-release
    steps: *production-host-cli-steps

  production-host-cli-certify-windows:
    name: Production host CLI (windows)
    runs-on: windows-2025
    needs: production-host-cli-windows
    if: ${{ always() }}
    timeout-minutes: 45
    env:
      CLI_BUILD_RESULT: ${{ needs.production-host-cli-windows.result }}
      CLI_ARTIFACT_ID: ${{ needs.production-host-cli-windows.outputs.cli-id }}
      CLI_CANDIDATE: windows-release-cli-x64
      CLI_ROOT: build/cli/windows
      CLI_EXECUTABLE: build/cli/windows/noveltea.exe
    steps: &production-host-cli-certify-steps
      - name: Require successful exact host CLI build
        shell: bash
        run: |
          test "$CLI_BUILD_RESULT" = success
          [[ "$CLI_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore exact compiled host CLI
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ env.CLI_ARTIFACT_ID }}
          path: ${{ env.CLI_ROOT }}
      - name: Restore macOS CLI executable modes
        if: runner.os == 'macOS'
        shell: bash
        run: chmod +x "$CLI_ROOT/noveltea" "$CLI_ROOT/noveltea-ui-test-runner" "$CLI_ROOT/tools/ffmpeg/bin/ffmpeg"
      - name: Verify exact host CLI candidate before certification
        shell: bash
        run: node scripts/ci/release-candidate.mjs verify --candidate "$CLI_CANDIDATE" --stage qualify
      - name: Certify production CLI native Project transactions and public commands
        shell: pwsh
        run: |
          pnpm -C editor exec vp build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C editor exec vp pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C editor run noveltea:certify -- "${{ github.workspace }}/${{ env.CLI_EXECUTABLE }}" --cli-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify certified host CLI bytes remain identical
        shell: bash
        run: node scripts/ci/release-candidate.mjs verify --candidate "$CLI_CANDIDATE" --stage qualify

  production-host-cli-certify-macos:
    name: Production host CLI (macos)
    runs-on: macos-26
    needs: production-host-cli-macos
    if: ${{ always() }}
    timeout-minutes: 45
    env:
      CLI_BUILD_RESULT: ${{ needs.production-host-cli-macos.result }}
      CLI_ARTIFACT_ID: ${{ needs.production-host-cli-macos.outputs.cli-id }}
      CLI_CANDIDATE: macos-release-cli-arm64
      CLI_ROOT: build/cli/macos
      CLI_EXECUTABLE: build/cli/macos/noveltea
    steps: *production-host-cli-certify-steps

  production-android-arm64:
    name: Android ARM64 production candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    needs: shader-assets
    timeout-minutes: 100
    env:
      CCACHE_MAXSIZE: 512M
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            candidate: android-player-arm64-release
          - variant: devtools
            candidate: android-player-arm64-devtools
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reclaim space before NDK/Gradle compilation
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h "$GITHUB_WORKSPACE"
      - name: Set up Node for template generation and certification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Set up pinned Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependency and wrapper cache
        uses: gradle/actions/setup-gradle@v5
        with:
          # Keep development-branch cache writes bounded to this integration branch.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/ci/build-release-refactor-641' }}
          gradle-home-cache-excludes: |
            caches/build-cache-1
      - name: Install Linux native dependencies
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          autotools: "true"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Restore version-pinned Android SDK and NDK tools
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: ${{ runner.os }}-android-sdk-android${{ env.ANDROID_API_LEVEL }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}
      - name: Install exact Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Download SDL3 Android native libraries
        run: |
          mkdir -p android/app/libs .cache/sdl3-android
          curl -fL --retry 3 -o .cache/sdl3-android/SDL3-devel-3.4.10-android.zip \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-android.zip
          unzip -p .cache/sdl3-android/SDL3-devel-3.4.10-android.zip SDL3-3.4.10.aar > android/app/libs/SDL3-3.4.10.aar
      - name: Download checksum-verified bundletool
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 -o build/tools/bundletool-all-1.18.1.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  build/tools/bundletool-all-1.18.1.jar' | sha256sum -c -
      - name: Restore ARM64 candidate-specific native compiler objects
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: android-arm64-${{ matrix.variant }}-ndk${{ env.ANDROID_NDK_VERSION }}
      - name: Download certified shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets
      - name: Build the actual optimized ARM64 native player
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          devtools=()
          if [[ "$VARIANT" == devtools ]]; then devtools+=(-PnovelteaEnableDevtools=true); fi
          bash ../scripts/ci/retry-gradle-network.sh \
            node ../scripts/ci/time-command.mjs "android-arm64-$VARIANT-build-and-link" \
            ./gradlew --no-daemon :app:assembleRelease -PnovelteaAbi=arm64-v8a \
            "${devtools[@]}" -PnovelteaCompileShaders=OFF \
            -PnovelteaPrebuiltShaderAssetRoot="$GITHUB_WORKSPACE/build/prebuilt-shader-assets" \
            -PnovelteaUseCcache=true
      - name: Package complete Android source/native template
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cmake -DNOVELTEA_RELEASE_TAG="dev-$GITHUB_SHA" \
            -DNOVELTEA_ANDROID_ABI=arm64-v8a -DNOVELTEA_ANDROID_FLAVOR=release \
            -DNOVELTEA_ANDROID_TEMPLATE_VARIANT="$VARIANT" \
            -DNOVELTEA_BUNDLETOOL_JAR="$GITHUB_WORKSPACE/build/tools/bundletool-all-1.18.1.jar" \
            -P cmake/PackageNovelTeaAndroidPlayerTemplate.cmake
      - name: Audit ARM64 native load alignment and template flavor
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          root="build/package/android-arm64-v8a-$VARIANT"
          test -f "$root/source/android/prebuilt-native/arm64-v8a/libnoveltea-player.so"
          node -e 'const d = require("./" + process.argv[1] + "/template.json"); if (d.abi !== "arm64-v8a") process.exit(1); if (d.playerVariant !== (process.argv[2] === "devtools" ? "devtools" : "standard")) process.exit(1)' "$root" "$VARIANT"
          node scripts/verify-android-load-alignment.mjs \
            --readelf "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --root "$root/source/android/prebuilt-native" \
            --output "dist/noveltea-android-load-alignment-$VARIANT.json"
      - name: Manifest and upload exact qualified ARM64 candidate
        uses: ./.github/actions/produce-candidate
        with:
          candidate: ${{ matrix.candidate }}
      - name: Save bounded native compiler objects
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}

  production-desktop-player-linux:
    name: Production desktop player (${{ matrix.platform }}-${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    needs: shader-assets
    timeout-minutes: 90
    env:
      CCACHE_MAXSIZE: ${{ matrix.platform == 'windows' && '512M' || '256M' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            preset: linux-release
            variant: release
            triplet: x64-linux-noveltea
            host_triplet: x64-linux
            candidate: linux-player-x64-release
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            preset: linux-release-devtools
            variant: devtools
            triplet: x64-linux-noveltea
            host_triplet: x64-linux
            candidate: linux-player-x64-devtools
    steps: &production-desktop-player-steps
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Linux native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native
        with:
          ccache: "true"
          pkg-config: "true"
          autotools: "true"
          graphics: "true"
          xvfb: "true"
      - name: Set up pnpm for native Windows export and template generation
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install workspace dependencies for native tooling
        run: pnpm install --frozen-lockfile
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: Install Windows desktop compiler cache
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ccache --yes --no-progress
      - name: Restore exact Linux glibc 2.28 compiled vcpkg packages
        id: linux-player-vcpkg
        if: matrix.platform == 'linux'
        uses: actions/cache/restore@v5
        with:
          # Both variants use the same pinned ABI/triplet. vcpkg checks each
          # binary package ABI; never cache the downloaded SDK or installed tree.
          path: .cache/vcpkg-binary-player-glibc228
          key: manylinux-2.28-x64-player-compiled-v2-${{ hashFiles('.github/containers/linux-player-glibc228.Dockerfile', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/x64-linux-noveltea.cmake', 'cmake/NovelTeaLua.cmake') }}
          restore-keys: |
            manylinux-2.28-x64-player-compiled-v2-
      - name: Restore compiled non-Linux vcpkg packages
        id: desktop-vcpkg
        if: matrix.platform != 'linux'
        uses: actions/cache/restore@v5
        with:
          path: .cache/vcpkg-binary
          key: ${{ matrix.platform == 'windows' && format('windows-2025-x64-vcpkg-compiled-v2-{0}', hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-triplets/**')) || format('{0}-{1}-vcpkg-common-{2}', matrix.runner, matrix.arch, hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**')) }}
          restore-keys: |
            ${{ matrix.platform == 'windows' && 'windows-2025-x64-vcpkg-compiled-v2-' || format('{0}-{1}-vcpkg-common-', matrix.runner, matrix.arch) }}
      - name: Bootstrap source-pinned vcpkg SDK
        if: matrix.platform != 'linux'
        shell: pwsh
        run: |
          node scripts/ci/pin-vcpkg.mjs
          if ("${{ runner.os }}" -eq "Windows") {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up MSVC developer environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore source-owned vcpkg root after MSVC setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_ROOT=${{ github.workspace }}/.cache/vcpkg'
      - name: Prefetch checksum-verified Windows Lua source
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/ci/prefetch-lua-source.ps1
      - name: Restore compatible compiler objects
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          scope: desktop-${{ matrix.arch }}-${{ matrix.preset }}
          compiler: ${{ matrix.platform == 'windows' && 'cl.exe' || '' }}
      - name: Download certified shader assets
        uses: actions/download-artifact@v7
        with:
          name: noveltea-shader-assets
          path: build/prebuilt-shader-assets
      - name: Prepare pinned glibc 2.28 Linux production container
        if: matrix.platform == 'linux'
        shell: bash
        run: docker build --tag noveltea-linux-player-glibc228 --file .github/containers/linux-player-glibc228.Dockerfile .
      - name: Compile Linux release player in its required glibc 2.28 userspace
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/container-home .cache/vcpkg-player-glibc228 .cache/vcpkg-binary-player-glibc228
          node scripts/ci/time-command.mjs "${{ matrix.preset }}-build-and-link" docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/workspace/.cache/container-home \
            --env VCPKG_ROOT=/workspace/.cache/vcpkg-player-glibc228 \
            --env 'VCPKG_BINARY_SOURCES=clear;files,/workspace/.cache/vcpkg-binary-player-glibc228,readwrite' \
            --env CCACHE_DIR=/workspace/.cache/ccache \
            --env CCACHE_MAXSIZE=256M \
            --env CCACHE_BASEDIR=/workspace \
            --env NOVELTEA_VCPKG_PIN="$(node scripts/ci/pin-vcpkg.mjs print)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            noveltea-linux-player-glibc228 \
            bash -lc '
              set -euo pipefail
              if [[ ! -d "$VCPKG_ROOT/.git" ]]; then git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"; fi
              git -C "$VCPKG_ROOT" checkout --detach "$NOVELTEA_VCPKG_PIN"
              test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$NOVELTEA_VCPKG_PIN"
              "$VCPKG_ROOT/bootstrap-vcpkg.sh"
              cmake --preset ${{ matrix.preset }} -G Ninja \
                -DNOVELTEA_BUILD_HOST_TOOLS=OFF -DNOVELTEA_COMPILE_SHADERS=OFF \
                -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT=/workspace/build/prebuilt-shader-assets \
                -DNOVELTEA_PROJECT_ASSET_SOURCE=/workspace/apps/sandbox/assets \
                -DNOVELTEA_CMAKE_STAGE_RUNTIME_ASSETS=ON -DBUILD_TESTING=OFF \
                -DVCPKG_TARGET_TRIPLET=x64-linux-noveltea -DVCPKG_HOST_TRIPLET=x64-linux \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake --build --preset ${{ matrix.preset }} --target noveltea-player cxx-policy
              closure="$(ldd build/${{ matrix.preset }}/apps/player/noveltea-player)"
              if grep -q "not found" <<<"$closure"; then echo "$closure"; exit 1; fi
            '
      - name: Compile non-Linux release player with its production compiler
        if: matrix.platform != 'linux'
        shell: pwsh
        run: |
          $launchers = @("-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          $hostTools = if ("${{ matrix.platform }}" -eq "windows") { "ON" } else { "OFF" }
          cmake --preset ${{ matrix.preset }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNOVELTEA_BUILD_HOST_TOOLS=$hostTools `
            -DNOVELTEA_COMPILE_SHADERS=OFF `
            -DNOVELTEA_PREBUILT_SHADER_ASSET_ROOT="${{ github.workspace }}/build/prebuilt-shader-assets" `
            -DNOVELTEA_PROJECT_ASSET_SOURCE="${{ github.workspace }}/apps/sandbox/assets" `
            -DNOVELTEA_CMAKE_STAGE_RUNTIME_ASSETS=ON -DBUILD_TESTING=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} `
            @launchers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @('noveltea-player', 'cxx-policy')
          if ('${{ matrix.platform }}' -eq 'windows') { $targets += 'noveltea-tooling-bridge' }
          node scripts/ci/time-command.mjs "${{ matrix.preset }}-build-and-link" `
            cmake --build --preset ${{ matrix.preset }} --target @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Certify Linux runtime floor and devtools composition
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          bash scripts/check-native-devtools-symbols.sh build/${{ matrix.preset }}/apps/player/noveltea-player ${{ matrix.variant == 'release' && 'off' || 'on' }}
          cmake -DNOVELTEA_PLAYER="$PWD/build/${{ matrix.preset }}/apps/player/noveltea-player" \
            -DNOVELTEA_MAX_GLIBC_VERSION=2.28 -DNOVELTEA_REQUIRE_STATIC_GNU_CXX_RUNTIME=ON \
            -P cmake/AuditNovelTeaPlayerDependencies.cmake
      - name: Certify Windows and macOS production player dependency closure
        if: matrix.platform != 'linux'
        shell: pwsh
        run: |
          cmake -DNOVELTEA_PLAYER="${{ github.workspace }}/build/${{ matrix.preset }}/apps/player/noveltea-player${{ matrix.platform == 'windows' && '.exe' || '' }}" `
            -P cmake/AuditNovelTeaPlayerDependencies.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify macOS player minimum deployment target
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          minos="$(otool -l build/${{ matrix.preset }}/apps/player/noveltea-player | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { seen=1; next } seen && $1 == "minos" { print $2; exit }')"
          test "$minos" = "11.0"
      - name: Stage full player template with its compiled executable and assets
        shell: pwsh
        run: |
          cmake -DNOVELTEA_TEMPLATE_PRESET=${{ matrix.preset }} `
            -DNOVELTEA_TEMPLATE_PLATFORM=${{ matrix.platform }} `
            -DNOVELTEA_TEMPLATE_ARCH=${{ matrix.arch }} `
            -DNOVELTEA_TEMPLATE_VARIANT=${{ matrix.variant }} `
            -DNOVELTEA_RELEASE_TAG="dev-$env:GITHUB_SHA" `
            -P cmake/PackageNovelTeaPlayerTemplate.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact Build-native Windows tooling bridge for Release export acceptance
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-build-windows-tooling-bridge-${{ matrix.variant }}
          path: build/${{ matrix.preset }}/tools/editor_tool/noveltea-tooling-bridge.exe
          if-no-files-found: error
      - name: Manifest and upload exact qualified desktop player
        uses: ./.github/actions/produce-candidate
        with:
          candidate: ${{ matrix.candidate }}
      # Only one successfully qualified variant publishes each compatible
      # compiled-package cache; all other variants restore it read-only.
      - name: Save qualified Linux player compiled vcpkg packages
        if: >-
          matrix.platform == 'linux' && matrix.variant == 'release' &&
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          github.repository == 'Cruel/nt' && steps.linux-player-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/vcpkg-binary-player-glibc228
          key: ${{ steps.linux-player-vcpkg.outputs.cache-primary-key }}
      - name: Save qualified macOS player compiled vcpkg packages
        if: >-
          matrix.platform == 'macos' && matrix.variant == 'release' &&
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          github.repository == 'Cruel/nt' && steps.desktop-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/vcpkg-binary
          key: ${{ steps.desktop-vcpkg.outputs.cache-primary-key }}
      - name: Save compatible compiler objects
        uses: ./.github/actions/save-ccache
        with:
          primary-key: ${{ steps.ccache.outputs.primary-key }}
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
      - name: Report compiler-cache statistics
        if: always()
        run: ccache --show-stats

  production-desktop-player-windows:
