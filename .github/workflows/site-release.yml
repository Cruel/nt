name: Site after release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: site-release
  cancel-in-progress: true

jobs:
  prepare-examples:
    name: Reuse qualified development examples
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download qualified examples from successful Build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$SOURCE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful Build workflow exists for $SOURCE_SHA; refusing to publish the site without qualified development examples." >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name noveltea-development-examples --dir build/site-examples
          test -f build/site-examples/catalog.json

      - name: Re-publish qualified examples into this workflow run
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-development-examples
          path: build/site-examples
          if-no-files-found: error

  site:
    name: Site
    needs: prepare-examples
    uses: ./.github/workflows/site.yml
    with:
      deploy: true
      production: true
    permissions:
      actions: read
      contents: read
    secrets: inherit
