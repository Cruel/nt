name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "editor/src/shared/project-schema/**"
      - "editor/src/shared/project-workspace/project-workspace-contracts.ts"
      - "scripts/run-site.sh"
      - "scripts/qualify-examples.mjs"
      - "scripts/qualify-examples-local.sh"
      - "examples/noveltea-examples.revision"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "editor/src/shared/project-schema/**"
      - "editor/src/shared/project-workspace/project-workspace-contracts.ts"
      - "scripts/run-site.sh"
      - "scripts/qualify-examples.mjs"
      - "scripts/qualify-examples-local.sh"
      - "examples/noveltea-examples.revision"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    name: Verify site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Download same-revision qualified development examples
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run="$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion,headSha --jq '.[0] // {}')"
            run_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.databaseId ? String(value.databaseId) : "")' "$run")"
            status="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.status || "")' "$run")"
            conclusion="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.conclusion || "")' "$run")"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Build workflow $run_id completed with conclusion '$conclusion'; refusing unqualified examples." >&2
                exit 1
              fi
              gh run download "$run_id" --name noveltea-development-examples --dir build/site-examples
              break
            fi
            sleep 20
          done
          test -f build/site-examples/catalog.json
          examples_revision="$(node -e 'const value=require("./build/site-examples/catalog.json"); process.stdout.write(value.source.revision)')"
          key_prefix="development/examples/$GITHUB_SHA/$examples_revision"
          echo "NOVELTEA_EXAMPLES_CATALOG_PATH=$GITHUB_WORKSPACE/build/site-examples/catalog.json" >> "$GITHUB_ENV"
          echo "NOVELTEA_EXAMPLES_R2_KEY_PREFIX=$key_prefix" >> "$GITHUB_ENV"
          echo "NOVELTEA_EXAMPLES_R2_BASE_URL=https://assets.noveltea.dev/$key_prefix" >> "$GITHUB_ENV"

      - name: Resolve latest public release
        id: release-docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="$(gh api "repos/Cruel/noveltea-releases/releases" --jq '[.[] | select(.draft == false)][0].tag_name // ""')"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$release_tag" ]; then
            mkdir -p build/site-release
            gh release download "$release_tag" \
              --repo Cruel/noveltea-releases \
              --pattern noveltea-release-manifest.json \
              --dir build/site-release
            echo "NOVELTEA_DOCS_RELEASE_VERSION=$release_tag" >> "$GITHUB_ENV"
            echo "NOVELTEA_RELEASE_MANIFEST_PATH=$GITHUB_WORKSPACE/build/site-release/noveltea-release-manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Checkout exact release documentation source
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-docs.outputs.release_tag }}
          path: .site-release-source

      - name: Install exact release documentation dependencies
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: pnpm -C .site-release-source install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Check site
        run: pnpm -C site run check

      - name: Build browser-qualified site with local example assets
        env:
          NOVELTEA_EXAMPLES_LOCAL: "1"
        run: pnpm -C site run build

      - name: Test static site contract
        run: pnpm -C site run test

      - name: Test development examples in browser
        run: pnpm -C site run test:browser

      - name: Configure public example asset CORS
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site exec wrangler r2 bucket cors set noveltea-artifacts --file r2-cors.json --force

      - name: Prepare Pages and R2 example assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site run examples:prepare

      - name: Upload oversized example assets to R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node site/scripts/upload-development-example-assets.mjs

      - name: Build deployable development documentation and site
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site exec astro build

      - name: Test deployable development examples in browser
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site run test:browser

      - name: Build exact release documentation
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        env:
          NOVELTEA_DOCS_RENDER_CHANNEL: latest
          NOVELTEA_DOCS_RELEASE_VERSION: ${{ steps.release-docs.outputs.release_tag }}
        run: pnpm -C .site-release-source/site exec astro build

      - name: Promote exact release documentation to /docs
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: >-
          node site/scripts/promote-release-docs.mjs
          .site-release-source/site/dist
          site/dist
          "${{ steps.release-docs.outputs.release_tag }}"

      - name: Test deployable static site contract
        run: pnpm -C site run test

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy site
    needs: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && 'site-preview' || 'site-production' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --frozen-lockfile

      - name: Download verified site
        uses: actions/download-artifact@v7
        with:
          name: noveltea-site
          path: site/dist

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          projects="$(pnpm -C site exec wrangler pages project list --json)"
          if ! node -e '
            const projects = JSON.parse(process.argv[1]);
            process.exit(projects.some((project) => project["Project Name"] === "noveltea") ? 0 : 1);
          ' "$projects"; then
            pnpm -C site exec wrangler pages project create noveltea --production-branch master
          fi

      - name: Deploy production
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch master

      - name: Deploy pull-request preview
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch "pr-${{ github.event.pull_request.number }}"
