name: Site

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the verified site to Cloudflare Pages.
        required: false
        default: false
        type: boolean
      production:
        description: Deploy to the production branch instead of a pull-request preview.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Install browser for example qualification
        run: pnpm exec playwright install --with-deps chromium

      - name: Download qualified development examples
        uses: actions/download-artifact@v7
        with:
          name: noveltea-development-examples
          path: build/site-examples

      - name: Resolve development example publication identity
        shell: bash
        run: |
          set -euo pipefail
          readarray -t identity < <(node -e '
            const value = require("./build/site-examples/catalog.json");
            const revision = value?.source?.revision;
            const engineVersion = value?.toolchain?.player?.engineVersion;
            if (!/^[0-9a-f]{40}$/.test(revision ?? "") || !/^dev-[0-9a-f]{40}$/.test(engineVersion ?? "")) process.exit(1);
            process.stdout.write(`${engineVersion.slice(4)}\n${revision}\n`);
          ')
          nt_revision="${identity[0]}"
          examples_revision="${identity[1]}"
          key_prefix="development/examples/$nt_revision/$examples_revision"
          echo "NOVELTEA_EXAMPLES_CATALOG_PATH=$GITHUB_WORKSPACE/build/site-examples/catalog.json" >> "$GITHUB_ENV"
          echo "NOVELTEA_EXAMPLES_R2_KEY_PREFIX=$key_prefix" >> "$GITHUB_ENV"
          echo "NOVELTEA_EXAMPLES_R2_BASE_URL=https://assets.noveltea.dev/$key_prefix" >> "$GITHUB_ENV"

      - name: Resolve latest public release
        id: release-docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="$(gh api "repos/Cruel/noveltea-releases/releases" --jq '[.[] | select(.draft == false)][0].tag_name // ""')"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$release_tag" ]; then
            mkdir -p build/site-release
            gh release download "$release_tag" \
              --repo Cruel/noveltea-releases \
              --pattern noveltea-release-manifest.json \
              --dir build/site-release
            echo "NOVELTEA_DOCS_RELEASE_VERSION=$release_tag" >> "$GITHUB_ENV"
            echo "NOVELTEA_RELEASE_MANIFEST_PATH=$GITHUB_WORKSPACE/build/site-release/noveltea-release-manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Prepare exact release examples
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.release-docs.outputs.release_tag }}"
          readarray -t example_identity < <(node -e '
            const value = require("./build/site-release/noveltea-release-manifest.json");
            const sourceRevision = value?.examples?.sourceRevision;
            const archive = value?.examples?.archive?.file;
            const buildId = value?.examples?.playerBuildId;
            const tag = value?.release?.tag;
            if (!/^[0-9a-f]{40}$/.test(sourceRevision ?? "") || archive !== `noveltea-examples-${tag}.zip` || buildId !== `${tag}-web-wasm32-threads-release`) process.exit(1);
            process.stdout.write(`${archive}\n${sourceRevision}\n`);
          ')
          archive="${example_identity[0]}"
          examples_revision="${example_identity[1]}"
          mkdir -p build/site-release-examples
          gh release download "$release_tag" \
            --repo Cruel/noveltea-releases \
            --pattern "$archive" \
            --dir build/site-release
          ARCHIVE_PATH="build/site-release/$archive" node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const manifest = require("./build/site-release/noveltea-release-manifest.json");
            const bytes = fs.readFileSync(process.env.ARCHIVE_PATH);
            const asset = manifest.examples.archive;
            const digest = crypto.createHash("sha256").update(bytes).digest("hex");
            if (bytes.length !== asset.size || digest !== asset.sha256) process.exit(1);
          '
          unzip -q "build/site-release/$archive" -d build/site-release-examples
          test -f build/site-release-examples/catalog.json
          key_prefix="releases/examples/$release_tag/$examples_revision"
          echo "NOVELTEA_RELEASE_EXAMPLES_CATALOG_PATH=$GITHUB_WORKSPACE/build/site-release-examples/catalog.json" >> "$GITHUB_ENV"
          echo "NOVELTEA_RELEASE_EXAMPLES_R2_KEY_PREFIX=$key_prefix" >> "$GITHUB_ENV"
          echo "NOVELTEA_RELEASE_EXAMPLES_R2_BASE_URL=https://assets.noveltea.dev/$key_prefix" >> "$GITHUB_ENV"

      - name: Checkout exact release documentation source
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-docs.outputs.release_tag }}
          path: .site-release-source

      - name: Install exact release documentation dependencies
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: pnpm -C .site-release-source install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Check site
        run: pnpm -C site run check

      - name: Build browser-qualified site with local example assets
        env:
          NOVELTEA_EXAMPLES_LOCAL: "1"
        run: pnpm -C site run build

      - name: Test static site contract
        run: pnpm -C site run test

      - name: Test development examples in browser
        run: pnpm -C site run test:browser

      - name: Configure public example asset CORS
        if: ${{ inputs.deploy && env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site exec wrangler r2 bucket cors set noveltea-artifacts --file r2-cors.json --force

      - name: Prepare Pages and R2 example assets
        if: ${{ inputs.deploy && env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site run examples:prepare

      - name: Upload oversized example assets to R2
        if: ${{ inputs.deploy && env.CLOUDFLARE_API_TOKEN != '' }}
        run: node site/scripts/upload-development-example-assets.mjs

      - name: Build deployable development documentation and site
        if: ${{ inputs.deploy && env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site exec astro build

      - name: Test deployable development examples in browser
        if: ${{ inputs.deploy && env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C site run test:browser

      - name: Build exact release documentation
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        env:
          NOVELTEA_DOCS_RENDER_CHANNEL: latest
          NOVELTEA_DOCS_RELEASE_VERSION: ${{ steps.release-docs.outputs.release_tag }}
        run: pnpm -C .site-release-source/site exec astro build

      - name: Promote exact release documentation to /docs
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: >-
          node site/scripts/promote-release-docs.mjs
          .site-release-source/site/dist
          site/dist
          "${{ steps.release-docs.outputs.release_tag }}"

      - name: Test deployable static site contract
        run: pnpm -C site run test

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy site
    needs: verify
    if: ${{ inputs.deploy && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.production && 'site-production' || 'site-preview' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --frozen-lockfile

      - name: Download verified site
        uses: actions/download-artifact@v7
        with:
          name: noveltea-site
          path: site/dist

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          projects="$(pnpm -C site exec wrangler pages project list --json)"
          if ! node -e '
            const projects = JSON.parse(process.argv[1]);
            process.exit(projects.some((project) => project["Project Name"] === "noveltea") ? 0 : 1);
          ' "$projects"; then
            pnpm -C site exec wrangler pages project create noveltea --production-branch master
          fi

      - name: Deploy production
        if: ${{ inputs.production }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch master

      - name: Deploy pull-request preview
        if: ${{ !inputs.production }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch "pr-${{ github.event.pull_request.number }}"
