name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "editor/src/shared/project-schema/**"
      - "editor/src/shared/project-workspace/project-workspace-contracts.ts"
      - "scripts/run-site.sh"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "editor/src/shared/project-schema/**"
      - "editor/src/shared/project-workspace/project-workspace-contracts.ts"
      - "scripts/run-site.sh"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    name: Verify site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Resolve latest public release
        id: release-docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="$(gh api "repos/Cruel/noveltea-releases/releases" --jq '[.[] | select(.draft == false)][0].tag_name // ""')"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$release_tag" ]; then
            mkdir -p build/site-release
            gh release download "$release_tag" \
              --repo Cruel/noveltea-releases \
              --pattern noveltea-release-manifest.json \
              --dir build/site-release
            echo "NOVELTEA_DOCS_RELEASE_VERSION=$release_tag" >> "$GITHUB_ENV"
            echo "NOVELTEA_RELEASE_MANIFEST_PATH=$GITHUB_WORKSPACE/build/site-release/noveltea-release-manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Checkout exact release documentation source
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-docs.outputs.release_tag }}
          path: .site-release-source

      - name: Install exact release documentation dependencies
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: pnpm -C .site-release-source install --filter @noveltea/site... --filter noveltea-editor... --frozen-lockfile

      - name: Check site
        run: pnpm -C site run check

      - name: Build development documentation and site
        run: pnpm -C site run build

      - name: Build exact release documentation
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        env:
          NOVELTEA_DOCS_RENDER_CHANNEL: latest
          NOVELTEA_DOCS_RELEASE_VERSION: ${{ steps.release-docs.outputs.release_tag }}
        run: pnpm -C .site-release-source/site run build

      - name: Promote exact release documentation to /docs
        if: ${{ steps.release-docs.outputs.release_tag != '' }}
        run: >-
          node site/scripts/promote-release-docs.mjs
          .site-release-source/site/dist
          site/dist
          "${{ steps.release-docs.outputs.release_tag }}"

      - name: Test static site contract
        run: pnpm -C site run test

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: noveltea-site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy site
    needs: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && 'site-preview' || 'site-production' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @noveltea/site... --frozen-lockfile

      - name: Download verified site
        uses: actions/download-artifact@v7
        with:
          name: noveltea-site
          path: site/dist

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          projects="$(pnpm -C site exec wrangler pages project list --json)"
          if ! node -e '
            const projects = JSON.parse(process.argv[1]);
            process.exit(projects.some((project) => project["Project Name"] === "noveltea") ? 0 : 1);
          ' "$projects"; then
            pnpm -C site exec wrangler pages project create noveltea --production-branch master
          fi

      - name: Deploy production
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch master

      - name: Deploy pull-request preview
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm -C site exec wrangler pages deploy dist --project-name noveltea --branch "pr-${{ github.event.pull_request.number }}"
