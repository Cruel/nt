packages:
  - editor
  - site

nodeLinker: isolated
injectWorkspacePackages: true
autoInstallPeers: false

minimumReleaseAgeExclude:
  - "scriptc@0.1.3"
  - "@scriptc/compiler@0.1.3"
  - "@scriptc/runtime@0.1.3"
  - '@scriptc/llvm-darwin-arm64@0.1.3'
  - '@scriptc/llvm-linux-arm64-gnu@0.1.3'
  - '@scriptc/llvm-linux-arm64-musl@0.1.3'
  - '@scriptc/llvm-linux-x64-gnu@0.1.3'
  - '@scriptc/llvm-linux-x64-musl@0.1.3'
  - '@scriptc/llvm-win32-x64-msvc@0.1.3'
  - '@scriptc/runtime-darwin-arm64@0.1.3'
  - '@scriptc/runtime-linux-arm64-gnu@0.1.3'
  - '@scriptc/runtime-linux-arm64-musl@0.1.3'
  - '@scriptc/runtime-linux-x64-gnu@0.1.3'
  - '@scriptc/runtime-linux-x64-musl@0.1.3'
  - '@scriptc/runtime-wasm32-wasi@0.1.3'
  - '@scriptc/runtime-win32-x64-msvc@0.1.3'

catalog:
  "@electron/fuses": 2.1.3
  electron: 43.1.1
  electron-builder: 26.15.3
  sharp: 0.35.4
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
  vitest: 4.1.10

overrides:
  "@electron/rebuild": 4.2.0
  js-yaml: 4.3.2
  nanoid: 3.3.18
  tmp: 0.2.7
  vite: "catalog:"
  vitest: 4.1.10

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    "@electron/fuses": 2.1.3
    vite: "*"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  scriptc: true
  sharp: true
  workerd: true
