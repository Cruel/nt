<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelTea Editor Preview Widget</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111318; color: #cbd5e1; font-family: sans-serif; }
  body { position: relative; }
  canvas { position: absolute; left: 0; top: 0; display: block; max-width: none; max-height: none; background: #111318; }
  #status { display: none; position: fixed; left: 10px; top: 10px; right: 10px; z-index: 10; padding: 8px 10px; border-radius: 4px; background: rgba(127, 29, 29, 240); color: #fee2e2; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; pointer-events: none; white-space: pre-wrap; }
  #fps-counter { display: none; position: fixed; left: 10px; bottom: 10px; z-index: 9; padding: 4px 6px; border-radius: 4px; background: rgba(15, 23, 42, 0.84); color: #cbd5e1; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status"></div>
<div id="fps-counter"></div>
<script>
  (function() {
    const protocolVersion = 1;
    const params = new URLSearchParams(window.location.search);
    const commandQueue = [];
    const sessionToken = params.get('sessionToken') || '';
    let port = null;
    let engineReady = false;
    let runtimeReady = false;
    let pendingResize = null;
    let appliedResizeKey = '';
    let forcePendingResize = false;
    let resizeScheduled = false;
    let dprMediaQuery = null;
    let previewMode = 'runtime';
    let currentRunning = true;
    let drainingCommands = false;
    let previewActivityActive = true;
    let previewActivityVisible = true;
    let lastRuntimeDebugFingerprint = '';
    let previewWheelPolicy = params.get('wheelPolicy') === 'editor-scroll' ? 'editor-scroll' : 'preview-input';
    let previewWheelRouteId = '';
    let transportGeneration = 0;
    let nativeHostGeneration = 0;
    let activeShaderVariant = '';
    let focusedApplySequence = 0;
    let focusedActiveStagingController = null;
    let focusedProjectInstanceId = '';
    let focusedResourceStageGeneration = 0;
    const focusedDocumentLimits = {
      maxRequestBytes: 16 * 1024 * 1024,
      maxSourceBytes: 4 * 1024 * 1024,
      maxStringBytes: 16 * 1024,
      maxJsonDepth: 64,
      maxLayouts: 512,
      maxResources: 16384,
      maxItemsPerArray: 8192,
      maxAdmissionItemsPerSource: 8192,
      maxResourceBytes: 128 * 1024 * 1024,
      maxTotalResourceBytes: 512 * 1024 * 1024,
    };
    const focusedCommittedResources = new Map();
    const focusedPendingRequests = new Map();
    const focusedStagingControllers = new Map();
    const editorCompiledProjectPath = '/assets/project/editor-compiled-project.json';
    const editorCompiledProjectLogicalPath = 'project:/editor-compiled-project.json';
    let showFpsCounter = params.get('showFps') === '1' || params.get('showFps') === 'true';
    let fpsCap = Math.max(0, Math.min(1000, Number.parseInt(params.get('fpsCap') || '0', 10) || 0));
    const rmluiRasterSnapModes = new Set(['none', 'geometry', 'text', 'all']);
    const requestedRmluiRasterSnap = (params.get('rmluiSnap') || 'all').toLowerCase();
    let rmluiRasterSnap = rmluiRasterSnapModes.has(requestedRmluiRasterSnap)
      ? requestedRmluiRasterSnap
      : 'all';
    const parsedDiagnosticMaxDpr = Number.parseFloat(params.get('maxDpr') || '');
    const diagnosticMaxDpr = Number.isFinite(parsedDiagnosticMaxDpr) && parsedDiagnosticMaxDpr > 0
      ? parsedDiagnosticMaxDpr
      : 0;

    const rmlUiBaseStyle = `body, div,
h1, h2, h3, h4,
h5, h6, p,
hr, pre,
tabset tabs {
  display: block;
}

body {
  width: 100%;
  height: 100%;
  color: #f8fafc;
  font-family: Liberation Sans;
}

h1 {
  font-size: 2em;
  margin: .67em 0;
}

h2 {
  font-size: 1.5em;
  margin: .75em 0;
}

h3 {
  font-size: 1.17em;
  margin: .83em 0;
}

h4, p {
  margin: 1.12em 0;
}

h5 {
  font-size: .83em;
  margin: 1.5em 0;
}

h6 {
  font-size: .75em;
  margin: 1.67em 0;
}

h1, h2, h3, h4,
h5, h6, strong {
  font-weight: bold;
}

em {
  font-style: italic;
}

pre {
  white-space: pre;
}

hr {
  border-width: 1px;
}

button {
  display: inline-block;
  margin: 4px 0;
  padding: 8px 12px;
  min-width: 96px;
  color: #f8fafc;
  background-color: #334155;
  border-width: 1px;
  border-color: #64748b;
  border-radius: 4px;
  font-family: Liberation Sans;
  font-size: 14px;
  text-align: center;
}

button:hover {
  background-color: #475569;
  border-color: #94a3b8;
}

button:active {
  background-color: #1e293b;
}

table {
  box-sizing: border-box;
  display: table;
}

tr {
  box-sizing: border-box;
  display: table-row;
}

td {
  box-sizing: border-box;
  display: table-cell;
}

col {
  box-sizing: border-box;
  display: table-column;
}

colgroup {
  display: table-column-group;
}

thead, tbody, tfoot {
  display: table-row-group;
}`;

    function showFailure(text) {
      const status = document.getElementById('status');
      if (!status) return;
      status.textContent = text;
      status.style.display = 'block';
    }

    function hideFailure() {
      const status = document.getElementById('status');
      if (status) status.style.display = 'none';
    }

    function send(message) {
      if (message && message.type === 'fps-counter' && (!previewActivityActive || !previewActivityVisible)) return;
      if (port) port.postMessage(message);
    }

    function failCommand(message, reason, diagnostic = {}) {
      showFailure(reason);
      send({ version: protocolVersion, type: 'preview-diagnostic', diagnostic: { severity: 'warning', message: reason, ...diagnostic } });
      send({
        version: protocolVersion,
        type: 'command-result',
        requestId: message.requestId,
        ok: false,
        error: reason,
        errorCode: typeof diagnostic.code === 'string' ? diagnostic.code : undefined,
      });
    }

    function isClosedShaderVariant(value) {
      return (
        value === 'glsl-120' ||
        value === 'essl-100' ||
        value === 'essl-300' ||
        value === 'metal'
      );
    }

    function focusedDiagnosticScopeKey(document) {
      return [document.projectInstanceId, document.kind, document.recordId, document.revision].join('|');
    }

    function replaceFocusedDiagnostics(document, diagnostics) {
      send({
        version: protocolVersion,
        type: 'preview-diagnostics-replaced',
        scopeKey: focusedDiagnosticScopeKey(document),
        diagnostics,
      });
    }

    function emitDiagnostic(message, diagnostic) {
      send({ version: protocolVersion, type: 'preview-diagnostic', diagnostic });
      if (message && message.requestId && diagnostic && diagnostic.severity === 'error') showFailure(diagnostic.message);
    }

    function setFpsCounterText(fps, frameTimeMs, cap) {
      const counter = document.getElementById('fps-counter');
      if (!counter) return;
      if (!previewActivityActive || !previewActivityVisible || !showFpsCounter || !Number.isFinite(fps) || fps <= 0) {
        counter.style.display = 'none';
        counter.textContent = '';
        return;
      }
      const capText = cap > 0 ? ` engine cap ${cap}, display paced` : ' display paced';
      counter.textContent = `${fps.toFixed(1)} fps · ${frameTimeMs.toFixed(2)} ms ·${capText}`;
      counter.style.display = 'block';
    }

    function effectivePreviewFpsCap() {
      // A newly claimed focused host is active while still visually unpublished. It must keep
      // advancing native jobs and owner-thread finalization until the candidate commits, even
      // though the iframe is transparent to the user.
      return fpsCap;
    }

    function applyPreviewFramePacing() {
      if (typeof Module !== 'undefined' && typeof Module._noveltea_engine_set_fps_cap === 'function') {
        Module._noveltea_engine_set_fps_cap(effectivePreviewFpsCap());
      }
    }

    function applyRmlUiRasterSnapping() {
      if (typeof Module === 'undefined' || typeof Module._noveltea_engine_set_rmlui_raster_snapping !== 'function') return;
      const geometryEnabled = rmluiRasterSnap === 'geometry' || rmluiRasterSnap === 'all';
      const textEnabled = rmluiRasterSnap === 'text' || rmluiRasterSnap === 'all';
      Module._noveltea_engine_set_rmlui_raster_snapping(geometryEnabled ? 1 : 0, textEnabled ? 1 : 0);
    }

    function applyPreviewHostActivity() {
      if (typeof Module !== 'undefined' && typeof Module._noveltea_preview_set_host_active === 'function') {
        Module._noveltea_preview_set_host_active(previewActivityActive ? 1 : 0);
      }
    }

    function applyEngineSettings(settings = {}) {
      if (typeof settings.showFpsCounter === 'boolean') {
        showFpsCounter = settings.showFpsCounter;
      }
      if (typeof settings.fpsCap === 'number' && Number.isFinite(settings.fpsCap)) {
        fpsCap = Math.max(0, Math.min(1000, Math.trunc(settings.fpsCap)));
      }
      if (typeof settings.rmluiRasterSnap === 'string' && rmluiRasterSnapModes.has(settings.rmluiRasterSnap)) {
        rmluiRasterSnap = settings.rmluiRasterSnap;
      }
      if (!showFpsCounter) setFpsCounterText(0, 0, fpsCap);
      if (typeof Module !== 'undefined') {
        if (typeof Module._noveltea_engine_set_show_fps_counter === 'function') {
          Module._noveltea_engine_set_show_fps_counter(showFpsCounter ? 1 : 0);
        }
        applyPreviewFramePacing();
        applyRmlUiRasterSnapping();
      }
    }

    function applyPreviewActivity(message) {
      if (!message || message.version !== protocolVersion || message.type !== 'set-preview-activity' || typeof message.requestId !== 'string') {
        return false;
      }
      if (typeof message.active !== 'boolean' || (message.visible !== undefined && typeof message.visible !== 'boolean')) {
        failCommand(message, 'Invalid preview activity command.', { category: 'preview-activity' });
        return true;
      }
      const wasVisible = previewActivityVisible;
      previewActivityActive = message.active;
      previewActivityVisible = message.visible === undefined ? message.active : message.visible;
      applyPreviewFramePacing();
      applyPreviewHostActivity();
      if (!previewActivityActive || !previewActivityVisible) {
        setFpsCounterText(0, 0, fpsCap);
      } else if (!wasVisible && previewActivityVisible) {
        // Reactivating an offscreen retained iframe is a presentation refresh boundary even when
        // its CSS dimensions are unchanged. Re-submit the same surface tuple so RmlUi layout and
        // native pointer transforms cannot remain tied to the pre-suspension compositor geometry.
        forcePendingResize = true;
        resizeCanvas();
        applyPendingResize();
      }
      send({ version: protocolVersion, type: 'command-result', requestId: message.requestId, ok: true });
      return true;
    }

    function applyPreviewWheelRouting(message) {
      if (!message || message.version !== protocolVersion || message.type !== 'set-preview-wheel-routing' || typeof message.requestId !== 'string') {
        return false;
      }
      if ((message.policy !== 'editor-scroll' && message.policy !== 'preview-input') ||
          typeof message.routeId !== 'string' || message.routeId.length === 0) {
        failCommand(message, 'Invalid preview wheel routing command.', { category: 'preview-wheel' });
        return true;
      }
      previewWheelPolicy = message.policy;
      previewWheelRouteId = message.routeId;
      send({ version: protocolVersion, type: 'command-result', requestId: message.requestId, ok: true });
      return true;
    }

    window.addEventListener('wheel', (event) => {
      if (previewWheelPolicy !== 'editor-scroll') return;
      if (event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (!port || !previewWheelRouteId) return;
      send({
        version: protocolVersion,
        type: 'preview-wheel',
        routeId: previewWheelRouteId,
        deltaX: event.deltaX,
        deltaY: event.deltaY,
        deltaMode: event.deltaMode,
        shiftKey: event.shiftKey,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        metaKey: event.metaKey,
      });
    }, { capture: true, passive: false });

    function sourceText(source) {
      return source && source.sourceMode === 'inline' && typeof source.sourceText === 'string' ? source.sourceText : '';
    }

    function injectHeadContent(rml, content) {
      if (!content) return rml;
      if (/<\/head\s*>/i.test(rml)) return rml.replace(/<\/head\s*>/i, `${content}\n</head>`);
      if (/<\s*rml[\s>]/i.test(rml)) return rml.replace(/<\s*rml([^>]*)>/i, `<rml$1>\n<head>\n${content}\n</head>`);
      return `<rml>\n<head>\n${content}\n</head>\n<body>\n${rml}\n</body>\n</rml>`;
    }

    function buildLayoutPreviewRml(data) {
      const rmlSource = sourceText(data && data.rml);
      const rcssSource = sourceText(data && data.rcss);
      const layoutKind = data && data.layoutKind === 'fragment' ? 'fragment' : 'document';
      const style = `<style>\n${rmlUiBaseStyle}\n${rcssSource}\n</style>`;
      if (layoutKind === 'fragment') {
        return `<rml>\n<head>\n<title>Layout Preview</title>\n${style}\n</head>\n<body>\n<div id="nt-layout-preview-root">\n<div id="nt-layout-preview-mount">\n${rmlSource}\n</div>\n</div>\n</body>\n</rml>`;
      }
      const documentSource = rmlSource.trim().length > 0 ? rmlSource : '<rml><head><title>Empty Layout Preview</title></head><body></body></rml>';
      return injectHeadContent(documentSource, style);
    }

    function escapeText(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeRcssString(value) {
      return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function projectImageSource(asset) {
      return asset && typeof asset.path === 'string' && asset.path.length > 0 ? `project:/${asset.path}` : '';
    }

    function buildShaderPreviewRml(data) {
      const materialId = data && typeof data.previewMaterialId === 'string' ? data.previewMaterialId : 'ui/noise_panel';
      const escapedMaterialId = escapeRcssString(materialId);
      return `<rml>\n<head>\n<title>Shader Preview</title>\n<style>\nbody { margin: 0; width: 100%; height: 100%; background-color: #0f172a; font-family: Liberation Sans; }\n#nt-shader-preview-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #0f172a; }\n#nt-shader-preview-square { position: absolute; left: 50%; top: 50%; width: 256px; height: 256px; margin-left: -128px; margin-top: -128px; background-color: #1e293b; border: 1px #94a3b8; decorator: shader("${escapedMaterialId}"); }\n</style>\n</head>\n<body>\n<div id="nt-shader-preview-stage"><div id="nt-shader-preview-square"></div></div>\n</body>\n</rml>`;
    }

    function buildMaterialPreviewRml(data) {
      const materialId = data && typeof data.materialId === 'string' ? data.materialId : 'ui/noise_panel';
      const escapedMaterialId = escapeRcssString(materialId);
      return `<rml>\n<head>\n<title>Material Preview</title>\n<style>\nbody { margin: 0; width: 100%; height: 100%; background-color: #111827; font-family: Liberation Sans; }\n#nt-material-preview-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #111827; }\n#nt-material-preview-card { position: absolute; left: 50%; top: 50%; width: 256px; height: 256px; margin-left: -128px; margin-top: -128px; background-color: #1f2937; border: 1px #94a3b8; decorator: shader("${escapedMaterialId}"); }\n#nt-material-preview-label { position: absolute; left: 16px; top: 16px; color: #cbd5e1; font-size: 14px; }\n</style>\n</head>\n<body>\n<div id="nt-material-preview-stage"><div id="nt-material-preview-label">${escapeText(materialId)}</div><div id="nt-material-preview-card"></div></div>\n</body>\n</rml>`;
    }

    function buildCharacterPreviewRml(data) {
      const name = data && (data.displayName || data.label || data.characterId) ? data.displayName || data.label || data.characterId : 'Character';
      const pose = data && data.pose ? data.pose : null;
      const expression = data && data.expression ? data.expression : null;
      const spriteSource = projectImageSource(data && data.resolvedSprite);
      const material = data && data.resolvedMaterial && data.resolvedMaterial.id ? data.resolvedMaterial.id : '';
      const imageMarkup = spriteSource
        ? `<img id="nt-character-preview-sprite" src="${escapeText(spriteSource)}" />`
        : '<div id="nt-character-preview-placeholder">No sprite selected</div>';
      const materialStyle = material ? ` decorator: shader("${escapeRcssString(material)}");` : '';
      return `<rml>\n<head>\n<title>Character Preview</title>\n<style>\nbody { margin: 0; width: 100%; height: 100%; background-color: #0f172a; font-family: Liberation Sans; color: #e5e7eb; }\n#nt-character-preview-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #0f172a; }\n#nt-character-preview-card { position: absolute; left: 50%; top: 50%; width: 320px; height: 420px; margin-left: -160px; margin-top: -210px; background-color: #111827; border: 1px #334155;${materialStyle} }\n#nt-character-preview-sprite { position: absolute; left: 24px; top: 48px; width: 272px; height: 272px; }\n#nt-character-preview-placeholder { position: absolute; left: 24px; top: 48px; width: 272px; height: 272px; border: 1px #475569; color: #94a3b8; text-align: center; padding-top: 122px; }\n#nt-character-preview-name { position: absolute; left: 24px; top: 336px; right: 24px; color: #f8fafc; font-size: 22px; }\n#nt-character-preview-meta { position: absolute; left: 24px; top: 368px; right: 24px; color: #94a3b8; font-size: 13px; }\n</style>\n</head>\n<body>\n<div id="nt-character-preview-stage"><div id="nt-character-preview-card">${imageMarkup}<div id="nt-character-preview-name">${escapeText(name)}</div><div id="nt-character-preview-meta">Pose: ${escapeText(pose && pose.label || pose && pose.id || 'none')} | Expression: ${escapeText(expression && expression.label || expression && expression.id || 'none')}</div></div></div>\n</body>\n</rml>`;
    }
    function buildDialoguePreviewRml(data) {
      const name = data && (data.displayName || data.label || data.dialogueId) ? data.displayName || data.label || data.dialogueId : 'Dialogue';
      const block = data && data.selectedBlock ? data.selectedBlock : null;
      const blockLabel = block && (block.label || block.id) ? block.label || block.id : 'No block selected';
      const blockType = block && block.type ? block.type : 'missing';
      const segments = block && Array.isArray(block.segments) ? block.segments : [];
      const choices = data && Array.isArray(data.choices) ? data.choices : [];
      const background = data && data.preview && data.preview.background === 'light' ? '#f8fafc' : '#0f172a';
      const foreground = data && data.preview && data.preview.background === 'light' ? '#0f172a' : '#e5e7eb';
      const segmentMarkup = segments.length > 0 ? segments.map((segment) => {
        if (!segment) return '';
        const speaker = segment.speakerMetadata && segment.speakerMetadata.displayName ? segment.speakerMetadata.displayName : '';
        const text = segment.text && typeof segment.text.source === 'string' && segment.text.source.trim().length > 0 ? segment.text.source : '[empty line]';
        const flags = [];
        if (segment.condition && segment.condition.enabled) flags.push('condition');
        if (segment.script && segment.script.enabled) flags.push('script');
        if (segment.flags && segment.flags.showOnce) flags.push('once');
        const meta = flags.length > 0 ? `<span class="nt-dialogue-preview-flags">${escapeText(flags.join(' · '))}</span>` : '';
        return `<div class="nt-dialogue-preview-segment"><div class="nt-dialogue-preview-speaker">${escapeText(speaker)}</div><div class="nt-dialogue-preview-line">${escapeText(text)}</div>${meta}</div>`;
      }).join('') : '<div class="nt-dialogue-preview-empty">No dialogue segments in this block.</div>';
      const choiceMarkup = choices.length > 0 ? choices.map((choice) => {
        const target = choice.targetLabel || choice.toBlockId || 'missing target';
        const label = choice.label || choice.kind || choice.id;
        const flags = choice.condition && choice.condition.enabled ? ' condition' : '';
        return `<button class="nt-dialogue-preview-choice">${escapeText(label)} → ${escapeText(target)}${escapeText(flags)}</button>`;
      }).join('') : '<div class="nt-dialogue-preview-no-choices">No outgoing choices.</div>';
      return `<rml>\n<head>\n<title>Dialogue Preview</title>\n<style>\nbody { margin: 0; width: 100%; height: 100%; background-color: ${background}; font-family: Liberation Sans; color: ${foreground}; }\n#nt-dialogue-preview-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 24px; background-color: ${background}; }\n#nt-dialogue-preview-card { position: absolute; left: 24px; right: 24px; top: 24px; bottom: 24px; background-color: rgba(15, 23, 42, 220); border: 1px #334155; padding: 18px; }\n#nt-dialogue-preview-title { color: #f8fafc; font-size: 22px; margin-bottom: 4px; }\n#nt-dialogue-preview-meta { color: #94a3b8; font-size: 12px; margin-bottom: 16px; }\n.nt-dialogue-preview-segment { margin-bottom: 10px; padding: 10px; background-color: rgba(30, 41, 59, 210); }\n.nt-dialogue-preview-speaker { color: #93c5fd; font-size: 12px; margin-bottom: 4px; }\n.nt-dialogue-preview-line { color: #e5e7eb; font-size: 15px; }\n.nt-dialogue-preview-flags { display: block; margin-top: 4px; color: #fbbf24; font-size: 11px; }\n#nt-dialogue-preview-choices { position: absolute; left: 18px; right: 18px; bottom: 18px; }\n.nt-dialogue-preview-choice { display: block; width: 100%; margin-top: 6px; text-align: left; }\n.nt-dialogue-preview-empty, .nt-dialogue-preview-no-choices { color: #94a3b8; font-size: 13px; }\n</style>\n</head>\n<body>\n<div id="nt-dialogue-preview-stage"><div id="nt-dialogue-preview-card"><div id="nt-dialogue-preview-title">${escapeText(name)}</div><div id="nt-dialogue-preview-meta">${escapeText(blockLabel)} · ${escapeText(blockType)}</div>${segmentMarkup}<div id="nt-dialogue-preview-choices">${choiceMarkup}</div></div></div>\n</body>\n</rml>`;
    }

    function buildScenePreviewRml(data) {
      const name = data && (data.displayName || data.label || data.sceneId) ? data.displayName || data.label || data.sceneId : 'Scene';
      const selected = data && data.selectedStep ? data.selectedStep : null;
      const selectedLabel = selected && (selected.label || selected.id) ? selected.label || selected.id : 'No step selected';
      const selectedType = selected && selected.type ? selected.type : 'missing';
      const state = data && data.state ? data.state : {};
      const background = data && data.preview && data.preview.background === 'light' ? '#f8fafc' : '#0f172a';
      const foreground = data && data.preview && data.preview.background === 'light' ? '#0f172a' : '#e5e7eb';
      const steps = data && Array.isArray(data.steps) ? data.steps : [];
      const stepMarkup = steps.slice(0, 12).map((step) => {
        const marker = step.selected ? '▶ ' : '';
        const flags = [];
        if (step.indicators && step.indicators.condition) flags.push('condition');
        if (step.indicators && step.indicators.script) flags.push('script');
        if (step.indicators && step.indicators.autosaveBefore) flags.push('autosave-before');
        if (step.indicators && step.indicators.autosaveAfter) flags.push('autosave-after');
        const meta = flags.length > 0 ? ` · ${flags.join(', ')}` : '';
        return `<div class="nt-scene-preview-step${step.selected ? ' selected' : ''}">${escapeText(marker + (step.label || step.id || 'step'))}<span>${escapeText((step.type || 'unknown') + meta)}</span></div>`;
      }).join('');
      const characters = state && Array.isArray(state.characters) ? state.characters : [];
      const characterMarkup = characters.length > 0 ? characters.map((character) => {
        const meta = [character.action, character.position, character.pose, character.expression].filter(Boolean).join(' · ');
        const name = character.characterMetadata && character.characterMetadata.displayName ? character.characterMetadata.displayName : character.character && character.character.$ref ? character.character.$ref.id : 'Character';
        return `<div class="nt-scene-preview-chip">${escapeText(name)}<span>${escapeText(meta)}</span></div>`;
      }).join('') : '<div class="nt-scene-preview-muted">No visible characters.</div>';
      const backgroundSummary = state && state.background ? state.background : null;
      const backgroundLabel = backgroundSummary && backgroundSummary.assetMetadata && backgroundSummary.assetMetadata.label ? backgroundSummary.assetMetadata.label : backgroundSummary && backgroundSummary.color ? backgroundSummary.color : 'Default background';
      const dialogue = state && state.dialogue && state.dialogue.dialogueMetadata ? state.dialogue.dialogueMetadata : null;
      const dialogueMarkup = dialogue ? `<div class="nt-scene-preview-chip">${escapeText(dialogue.displayName || dialogue.label || dialogue.id)}<span>${escapeText(dialogue.blockLabel || dialogue.blockId || 'entry')}</span></div>` : '<div class="nt-scene-preview-muted">No dialogue at selected state.</div>';
      return `<rml>\n<head>\n<title>Scene Preview</title>\n<style>\nbody { margin: 0; width: 100%; height: 100%; background-color: ${background}; font-family: Liberation Sans; color: ${foreground}; }\n#nt-scene-preview-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 20px; background-color: ${background}; }\n#nt-scene-preview-card { position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px; background-color: rgba(15, 23, 42, 220); border: 1px #334155; padding: 16px; }\n#nt-scene-preview-title { color: #f8fafc; font-size: 22px; margin-bottom: 4px; }\n#nt-scene-preview-meta { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }\n#nt-scene-preview-state { position: absolute; left: 16px; top: 76px; width: 47%; bottom: 16px; }\n#nt-scene-preview-steps { position: absolute; right: 16px; top: 76px; width: 47%; bottom: 16px; }\n.nt-scene-preview-section-title { color: #93c5fd; font-size: 13px; margin: 10px 0 6px; }\n.nt-scene-preview-chip, .nt-scene-preview-step { margin-bottom: 6px; padding: 7px 8px; background-color: rgba(30, 41, 59, 210); color: #e5e7eb; font-size: 13px; }\n.nt-scene-preview-step.selected { border: 1px #60a5fa; }\n.nt-scene-preview-chip span, .nt-scene-preview-step span { display: block; margin-top: 2px; color: #94a3b8; font-size: 11px; }\n.nt-scene-preview-muted { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }\n</style>\n</head>\n<body>\n<div id="nt-scene-preview-stage"><div id="nt-scene-preview-card"><div id="nt-scene-preview-title">${escapeText(name)}</div><div id="nt-scene-preview-meta">${escapeText(selectedLabel)} · ${escapeText(selectedType)}</div><div id="nt-scene-preview-state"><div class="nt-scene-preview-section-title">Background</div><div class="nt-scene-preview-chip">${escapeText(backgroundLabel)}<span>${escapeText(backgroundSummary && backgroundSummary.fit ? backgroundSummary.fit : '')}</span></div><div class="nt-scene-preview-section-title">Characters</div>${characterMarkup}<div class="nt-scene-preview-section-title">Dialogue</div>${dialogueMarkup}</div><div id="nt-scene-preview-steps"><div class="nt-scene-preview-section-title">Steps</div>${stepMarkup || '<div class="nt-scene-preview-muted">No scene steps.</div>'}</div></div></div>\n</body>\n</rml>`;

    function emitDocumentDiagnostics(document) {
      const data = document && document.data ? document.data : null;

      data.diagnostics.forEach((diagnostic) => {
        if (!diagnostic || typeof diagnostic.message !== 'string') return;
        send({ version: protocolVersion, type: 'preview-diagnostic', diagnostic: { severity: diagnostic.severity || 'warning', message: diagnostic.message, path: diagnostic.path } });
      });
    }

    function executePreviewLua(message, source) {
      if (!source || source.trim().length === 0) return true;
      if (typeof Module._noveltea_preview_execute_lua_script !== 'function') {
        failCommand(message, 'Preview widget build does not export noveltea_preview_execute_lua_script. Rebuild the editor preview.');
        return false;
      }
      const ok = Module.ccall('noveltea_preview_execute_lua_script', 'number', ['string'], [source]);
      if (!ok) {
        failCommand(message, 'Lua preview script failed. Check the engine console for the Lua traceback.');
        return false;
      }
      return true;
    }

    function applyPreviewRml(message, rml, luaSource) {
      if (typeof Module._noveltea_preview_load_rml_document !== 'function') {
        failCommand(message, 'Preview widget build does not export noveltea_preview_load_rml_document. Rebuild the editor preview.');
        return;
      }
      if (!executePreviewLua(message, luaSource || '')) return;
      const ok = Module.ccall('noveltea_preview_load_rml_document', 'number', ['string'], [rml]);
      if (ok) {
        hideFailure();
        send({ version: protocolVersion, type: 'command-result', requestId: message.requestId, ok: true });

        failCommand(message, 'RmlUi failed to load the preview document. Check RML/RCSS diagnostics and engine logs.');
      }

    function validateFocusedWireValue(value, depth = 0, fieldName = '') {
      if (depth > focusedDocumentLimits.maxJsonDepth) throw new Error('Focused preview request exceeds the JSON nesting limit.');
      if (typeof value === 'string') {
        const bytes = new TextEncoder().encode(value).byteLength;
        const sourceBearing = fieldName === 'rml' || fieldName === 'rcss' || fieldName === 'lua' || fieldName === 'sourceText' || fieldName === 'source';
        const limit = sourceBearing ? focusedDocumentLimits.maxSourceBytes : focusedDocumentLimits.maxStringBytes;
        if (bytes > limit) throw new Error(`Focused preview string '${fieldName}' exceeds its UTF-8 size limit.`);
        return;
      }
      if (Array.isArray(value)) {
        if (value.length > focusedDocumentLimits.maxItemsPerArray) throw new Error('Focused preview array exceeds the item limit.');
        for (const item of value) validateFocusedWireValue(item, depth + 1, fieldName);
        return;
      }
      if (!value || typeof value !== 'object') return;
      for (const [key, item] of Object.entries(value)) validateFocusedWireValue(item, depth + 1, key);
    }

    function proposedFocusedResourceGeneration(document) {
      if (focusedProjectInstanceId !== document.projectInstanceId) return 1;
      const requestedKeys = new Set(
        document.resources.map((entry) => focusedResourceKey(document.projectInstanceId, entry)),
      );
      if (
        requestedKeys.size !== focusedCommittedResources.size ||
        [...focusedCommittedResources.keys()].some((key) => !requestedKeys.has(key))
      ) {
        return focusedResourceStageGeneration + 1;
      }
      for (const entry of document.resources) {
        const committed = focusedCommittedResources.get(focusedResourceKey(document.projectInstanceId, entry));
        if (
          !committed ||
          committed.contentHash !== entry.contentHash ||
          committed.byteSize !== entry.byteSize ||
          Boolean(committed.retainAlphaCoverage) !== Boolean(entry.retainAlphaCoverage)
        ) {
          return focusedResourceStageGeneration + 1;
        }
      }
      return focusedResourceStageGeneration;
    }

    function isFocusedEditorDocumentCommand(message) {
      return message && message.type === 'apply-focused-editor-document' && typeof message.requestId === 'string';
    }

    function prepareFocusedEditorDocumentCommand(message) {
      if (!isFocusedEditorDocumentCommand(message) || focusedStagingControllers.has(message.requestId)) return;
      focusedApplySequence = Math.max(focusedApplySequence + 1, Number(message.applySequence) || 0);
      message.applySequence = focusedApplySequence;
      focusedActiveStagingController?.abort();
      const controller = new AbortController();
      focusedActiveStagingController = controller;
      focusedStagingControllers.set(message.requestId, controller);
    }

    function releaseFocusedStagingController(requestId, controller) {
      focusedStagingControllers.delete(requestId);
      if (focusedActiveStagingController === controller) focusedActiveStagingController = null;
    }

    function enqueueCommand(message) {
      prepareFocusedEditorDocumentCommand(message);
      commandQueue.push(message);
      void drainCommands();
    }

    function rejectSupersededFocusedCommand(message) {
      send({
        version: protocolVersion,
        type: 'command-result',
        requestId: message.requestId,
        ok: false,
        error: 'Focused preview request was superseded.',
        errorCode: 'focused-preview.superseded',
      });
    }

    async function applyFocusedEditorDocument(message) {
      prepareFocusedEditorDocumentCommand(message);
      const stagingController = focusedStagingControllers.get(message.requestId);
      if (!stagingController || stagingController.signal.aborted || message.applySequence !== focusedApplySequence) {
        releaseFocusedStagingController(message.requestId, stagingController);
        rejectSupersededFocusedCommand(message);
        return;
      }
      const document = message.document;
      if (!document || typeof document !== 'object') {
        releaseFocusedStagingController(message.requestId, stagingController);
        failCommand(message, 'Focused preview document is missing.', { code: 'focused-preview.invalid-document' });
        return;
      }
      if (!isClosedShaderVariant(activeShaderVariant)) {
        releaseFocusedStagingController(message.requestId, stagingController);
        failCommand(message, 'Native renderer did not report a supported active Shader variant.', { code: 'focused-preview.invalid-shader-variant' });
        return;
      }
      const proposedGeneration = proposedFocusedResourceGeneration(document);
      const envelope = {
        protocol: 'noveltea.focused-editor-document',
        protocolVersion: 1,
        requestId: message.requestId,
        applySequence: message.applySequence,
        projectInstanceId: document.projectInstanceId,
        resourceStageGeneration: proposedGeneration,
        kind: document.kind,
        recordId: document.recordId,
        revision: document.revision,
        resourceRevision: document.resourceRevision,
        resources: nativeManifestProjection(document.resources || []),
        data: document.data || {},
      };

        validateFocusedManifest(document.resources || []);
        validateFocusedWireValue(envelope);
        const encoded = JSON.stringify(envelope);
        if (new TextEncoder().encode(encoded).byteLength > focusedDocumentLimits.maxRequestBytes) {
          throw new Error('Focused preview request exceeds the native request-size limit.');
        }
        await stageFocusedManifest(message, document, proposedGeneration, stagingController.signal);
        if (message.applySequence !== focusedApplySequence) throw new Error('Focused preview request was superseded before native acceptance.');
        focusedPendingRequests.set(message.requestId, { message, document, envelope });
        const accepted = Module.ccall('noveltea_preview_apply_editor_document', 'number', ['string'], [encoded]);
        if (!accepted) {

          failCommand(message, 'Native focused preview request was synchronously rejected.', { code: 'focused-preview.rejected' });
        }
      } catch (error) {
        focusedPendingRequests.delete(message.requestId);
        if (stagingController.signal.aborted || message.applySequence !== focusedApplySequence) {
          rejectSupersededFocusedCommand(message);
          return;
        }
        const reason = error && error.message ? error.message : String(error);
        replaceFocusedDiagnostics(document, [{ severity: 'error', message: reason }]);
        failCommand(message, reason, { code: 'focused-preview.staging-failed' });
      } finally {
        releaseFocusedStagingController(message.requestId, stagingController);
      }
    }

    async function applyPreviewDocument(message) {
      const document = message.document;
      const kind = document && document.kind ? document.kind : 'unknown';
      const data = document && document.data ? document.data : {};
      emitDocumentDiagnostics(document);
      if (kind === 'layout-preview' || kind === 'shader-preview' || kind === 'room-preview') {
        failCommand(message, `${kind} must use the focused preview protocol.`, { code: 'focused-preview.protocol-required' });
      } else {
        if (!(await stagePreviewProjectAssets(message, data))) return;
        if (kind === 'material-preview') applyPreviewRml(message, buildMaterialPreviewRml(data));
        else if (kind === 'character-preview') applyPreviewRml(message, buildCharacterPreviewRml(data));
        else if (kind === 'dialogue-preview') applyPreviewRml(message, buildDialoguePreviewRml(data));
        else if (kind === 'scene-preview') applyPreviewRml(message, buildScenePreviewRml(data));
        else failCommand(message, `Preview widget cannot render document '${kind}'.`);
      }
    }

    function nativeExportAvailable(exportName) {
      return typeof Module !== 'undefined' && typeof Module[`_${exportName}`] === 'function';
    }

    function moduleFileSystem() {
      if (typeof Module !== 'undefined' && Module.FS) return Module.FS;
      if (typeof FS !== 'undefined') return FS;
      return null;
    }

    function safeProjectAssetPath(value) {
      if (typeof value !== 'string' || value.length === 0) return false;
      if (value.startsWith('/') || value.startsWith('\\') || value.includes(':') || value.includes('\\') || value.includes('//')) return false;
      return value.split('/').every((part) => part.length > 0 && part !== '.' && part !== '..');
    }

    function projectAssetFetchUrl(projectRelativePath) {
      return `/project-assets/${projectRelativePath.split('/').map((part) => encodeURIComponent(part)).join('/')}`;
    }

    function ensureFsDirectory(fs, directory) {
      if (!directory || directory === '/') return;
      const parts = directory.split('/').filter(Boolean);
      let current = '';
      for (const part of parts) {
        current += `/${part}`;
        try {
          fs.mkdir(current);
        } catch {
          // Directory already exists, or another filesystem error will be reported by the later write.
        }
      }
    }

    function fsPathExists(fs, path) {
      try {
        fs.lstat(path);
        return true;
      } catch {
        return false;
      }
    }

    function focusedLogicalRelativePath(logicalPath) {
      if (typeof logicalPath !== 'string' || !logicalPath.startsWith('project:/')) return null;
      const relative = logicalPath.slice('project:/'.length);
      return safeProjectAssetPath(relative) ? relative : null;
    }

    function focusedProjectStorageKey(projectInstanceId) {
      return Array.from(new TextEncoder().encode(projectInstanceId), (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    async function sha256Prefixed(bytes) {
      const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
      return `sha256:${Array.from(digest, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }

    async function readBoundedResponse(response, expectedByteSize, limit) {
      const contentLength = response.headers.get('content-length');
      if (contentLength !== null) {
        const declared = Number(contentLength);
        if (!Number.isSafeInteger(declared) || declared < 0 || declared !== expectedByteSize || declared > limit) {
          throw new Error(`Resource Content-Length mismatch: expected ${expectedByteSize}, received ${contentLength}.`);
        }
      }
      if (!response.body || typeof response.body.getReader !== 'function') {
        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes.byteLength !== expectedByteSize || bytes.byteLength > limit) {
          throw new Error(`Resource byte count mismatch: expected ${expectedByteSize}, received ${bytes.byteLength}.`);
        }
        return bytes;
      }
      const chunks = [];
      let total = 0;
      const reader = response.body.getReader();
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          if (!(value instanceof Uint8Array)) throw new Error('Resource stream returned a non-byte chunk.');
          total += value.byteLength;
          if (total > expectedByteSize || total > limit) {
            await reader.cancel('resource-size-limit');
            throw new Error(`Resource body exceeded its declared byte count (${expectedByteSize}).`);
          }
          chunks.push(value);
        }
      } finally {
        reader.releaseLock();
      }
      if (total !== expectedByteSize) {
        throw new Error(`Resource byte count mismatch: expected ${expectedByteSize}, received ${total}.`);
      }
      const bytes = new Uint8Array(total);
      let offset = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, offset);
        offset += chunk.byteLength;
      }
      return bytes;
    }

    function nativeManifestProjection(entries) {
      return entries.map((entry) => ({
        resourceId: entry.resourceId,
        sourceKind: entry.sourceKind,
        logicalPath: entry.logicalPath,
        contentHash: entry.contentHash,
        byteSize: entry.byteSize,
        kind: entry.kind,
        ...(entry.sampling ? { sampling: entry.sampling } : {}),
        ...(entry.sourceKind === 'authoring-asset' ? { assetId: entry.assetId } : {}),
        ...(entry.sourceKind === 'shader-compiled-output' ? {
          shaderId: entry.shaderId,
          shaderStage: entry.shaderStage,
          shaderVariant: entry.shaderVariant,
        } : {}),
      }));
    }

    function validateFocusedManifest(entries) {
      if (!Array.isArray(entries) || entries.length > focusedDocumentLimits.maxResources) {
        throw new Error('Focused preview manifest exceeds the resource-count limit.');
      }
      let total = 0;
      const resourceIds = new Set();
      const logicalPaths = new Map();
      const fetchPaths = new Map();
      const assetKinds = new Set(['image', 'audio', 'font', 'video', 'data', 'shader-source', 'rml', 'rcss', 'lua']);
      const samplingValues = new Set(['linear', 'nearest']);
      for (const entry of entries) {
        if (!entry || typeof entry !== 'object') throw new Error('Focused preview manifest entry is invalid.');
        if (typeof entry.resourceId !== 'string' || entry.resourceId.length === 0 || resourceIds.has(entry.resourceId)) {
          throw new Error(`Focused preview resourceId is missing or duplicated: '${entry.resourceId || ''}'.`);
        }
        resourceIds.add(entry.resourceId);
        const hasAssetFetchUrl = typeof entry.fetchUrl === 'string' && entry.fetchUrl.startsWith('noveltea-asset://source/');
        const hasProjectFetchPath = safeProjectAssetPath(entry.fetchProjectRelativePath);
        const hasCanonicalFetchAuthority =
          entry.sourceKind === 'authoring-asset'
            ? hasAssetFetchUrl && !hasProjectFetchPath
            : hasProjectFetchPath && !hasAssetFetchUrl;
        if (!focusedLogicalRelativePath(entry.logicalPath) || !hasCanonicalFetchAuthority) {
          throw new Error(`Focused preview resource fetch authority is invalid: ${String(entry.logicalPath || entry.fetchProjectRelativePath || entry.fetchUrl)}.`);
        }
        if (!/^sha256:[0-9a-f]{64}$/.test(entry.contentHash || '')) throw new Error('Focused preview resource hash is invalid.');
        if (!Number.isSafeInteger(entry.byteSize) || entry.byteSize < 0 || entry.byteSize > focusedDocumentLimits.maxResourceBytes) {
          throw new Error(`Focused preview resource '${entry.resourceId || ''}' exceeds the per-resource limit.`);
        }
        total += entry.byteSize;
        if (total > focusedDocumentLimits.maxTotalResourceBytes) throw new Error('Focused preview resources exceed the aggregate limit.');
        for (const [paths, path, label] of [[logicalPaths, entry.logicalPath, 'logical path'], [fetchPaths, entry.fetchProjectRelativePath || entry.fetchUrl, 'fetch authority']]) {
          const previous = paths.get(path);
          if (previous && previous !== entry.resourceId) throw new Error(`Conflicting focused preview ${label} '${path}'.`);
          paths.set(path, entry.resourceId);
        }
        if (entry.sourceKind === 'authoring-asset') {
          if (typeof entry.assetId !== 'string' || entry.assetId.length === 0 || entry.resourceId !== `asset:${entry.assetId}`) {
            throw new Error(`Focused preview authoring Asset identity is invalid: '${entry.resourceId}'.`);
          }
          if (!assetKinds.has(entry.kind)) throw new Error(`Focused preview Asset kind is invalid: '${entry.kind || ''}'.`);
          if (entry.sampling !== undefined && (entry.kind !== 'image' || !samplingValues.has(entry.sampling))) {
            throw new Error(`Focused preview Asset sampling is invalid: '${entry.sampling || ''}'.`);
          }
        } else if (entry.sourceKind === 'shader-compiled-output') {
          if (
            typeof entry.shaderId !== 'string' || entry.shaderId.length === 0 ||
            (entry.shaderStage !== 'vertex' && entry.shaderStage !== 'fragment') ||
            !isClosedShaderVariant(entry.shaderVariant) ||
            entry.kind !== 'shader-binary' ||
            entry.resourceId !== `shader:${entry.shaderId}:${entry.shaderStage}:${entry.shaderVariant}`
          ) {
            throw new Error(`Focused preview compiled Shader identity is invalid: '${entry.resourceId}'.`);
          }
          if (entry.sampling !== undefined) throw new Error('Compiled Shader resources cannot specify sampling.');
        } else {
          throw new Error(`Focused preview resource sourceKind is invalid: '${entry.sourceKind || ''}'.`);
        }
      }
      return total;
    }

    function focusedResourceKey(projectInstanceId, entry) {
      return `${projectInstanceId}|${entry.logicalPath}`;
    }

    async function stageFocusedManifest(message, document, proposedGeneration, signal) {
      validateFocusedManifest(document.resources);
      const fs = moduleFileSystem();
      if (!fs) throw new Error('Preview widget filesystem is unavailable.');
      const projectChanged = focusedProjectInstanceId !== document.projectInstanceId;
      const previous = projectChanged ? new Map() : focusedCommittedResources;
      const changed = document.resources.filter((entry) => {
        const committed = previous.get(focusedResourceKey(document.projectInstanceId, entry));
        return !committed || committed.contentHash !== entry.contentHash || committed.byteSize !== entry.byteSize;
      });
      const fetched = [];
      for (const entry of changed) {
        if (message.applySequence !== focusedApplySequence) throw new Error('Focused preview request was superseded before staging completed.');
        const fetchUrl = entry.sourceKind === 'authoring-asset'
          ? entry.fetchUrl
          : projectAssetFetchUrl(entry.fetchProjectRelativePath);
        const response = await fetch(fetchUrl, { cache: 'no-store', signal });
        if (!response.ok) throw new Error(`Focused preview resource fetch failed: ${entry.resourceId} (${response.status}).`);
        const bytes = await readBoundedResponse(response, entry.byteSize, focusedDocumentLimits.maxResourceBytes);
        const actualHash = await sha256Prefixed(bytes);
        if (actualHash !== entry.contentHash) throw new Error(`Focused preview resource hash mismatch: ${entry.resourceId}.`);
        fetched.push({ entry, bytes });
      }
      if (message.applySequence !== focusedApplySequence) throw new Error('Focused preview request was superseded before filesystem commit.');

      const fetchedByKey = new Map();

        const relative = focusedLogicalRelativePath(entry.logicalPath);
        const physicalPath = `${storageRoot}/${relative}`;
        ensureFsDirectory(fs, physicalPath.slice(0, physicalPath.lastIndexOf('/')));
        fs.writeFile(physicalPath, bytes);
        fetchedByKey.set(focusedResourceKey(document.projectInstanceId, entry), {
          contentHash: entry.contentHash,
          byteSize: entry.byteSize,
          physicalPath,
          logicalPath: entry.logicalPath,
        });
      }
      const nextMap = new Map();
      for (const entry of document.resources) {
        const key = focusedResourceKey(document.projectInstanceId, entry);
        const committed = fetchedByKey.get(key) || previous.get(key);
        if (!committed) throw new Error(`Focused preview resource was not staged: ${entry.logicalPath}.`);
        nextMap.set(key, {
          ...committed,
          logicalPath: entry.logicalPath,
          retainAlphaCoverage: entry.retainAlphaCoverage === true,
        });
      }
      if (message.applySequence !== focusedApplySequence) throw new Error('Focused preview request was superseded before generation publication.');
      const linkPlans = [];
      const desiredLogicalPaths = new Set();
      for (const entry of document.resources) {
        const relative = focusedLogicalRelativePath(entry.logicalPath);
        const committed = nextMap.get(focusedResourceKey(document.projectInstanceId, entry));
        if (!relative || !committed) throw new Error(`Focused preview resource was not staged: ${entry.logicalPath}.`);
        const logicalPhysicalPath = `/assets/project/${relative}`;
        desiredLogicalPaths.add(logicalPhysicalPath);
        linkPlans.push({
          logicalPhysicalPath,
          desiredPhysicalPath: committed.physicalPath,
          temporaryLink: `${logicalPhysicalPath}.noveltea-next-${message.applySequence}`,
          backupLink: `${logicalPhysicalPath}.noveltea-prev-${message.applySequence}`,
        });
      }
      for (const committed of focusedCommittedResources.values()) {
        const relative = focusedLogicalRelativePath(committed.logicalPath);
        const logicalPhysicalPath = relative ? `/assets/project/${relative}` : null;
        if (!logicalPhysicalPath || desiredLogicalPaths.has(logicalPhysicalPath)) continue;
        linkPlans.push({
          logicalPhysicalPath,
          desiredPhysicalPath: null,
          temporaryLink: `${logicalPhysicalPath}.noveltea-next-${message.applySequence}`,
          backupLink: `${logicalPhysicalPath}.noveltea-prev-${message.applySequence}`,
        });
      }

      const published = [];
      let preserveBackups = false;
      try {
        for (const plan of linkPlans) {
          ensureFsDirectory(fs, plan.logicalPhysicalPath.slice(0, plan.logicalPhysicalPath.lastIndexOf('/')));
          try { fs.unlink(plan.temporaryLink); } catch {}
          try { fs.unlink(plan.backupLink); } catch {}
          if (plan.desiredPhysicalPath) fs.symlink(plan.desiredPhysicalPath, plan.temporaryLink);
        }
        for (const plan of linkPlans) {
          if (message.applySequence !== focusedApplySequence) {
            throw new Error('Focused preview request was superseded during generation publication.');
          }
          const state = {
            ...plan,
            previousMoved: false,
            candidatePublished: false,
          };
          published.push(state);
          if (fsPathExists(fs, plan.logicalPhysicalPath)) {
            fs.rename(plan.logicalPhysicalPath, plan.backupLink);
            state.previousMoved = true;
          }
          if (plan.desiredPhysicalPath) {
            fs.rename(plan.temporaryLink, plan.logicalPhysicalPath);
            state.candidatePublished = true;
          }
        }
      } catch (error) {
        let rollbackFailure = null;
        for (const state of [...published].reverse()) {
          if (state.candidatePublished && fsPathExists(fs, state.logicalPhysicalPath)) {
            try {
              fs.unlink(state.logicalPhysicalPath);
            } catch (failure) {

            }
          }

        void drainCommands();
      },
      setFpsCounter(fps, frameTimeMs, cap) {
        setFpsCounterText(fps, frameTimeMs, cap);
      },
      focusedDocumentApplied(completion) {
        const pending = focusedPendingRequests.get(completion && completion.requestId);
        if (!pending) return;
        focusedPendingRequests.delete(completion.requestId);
        const diagnostics = Array.isArray(completion.diagnostics)
          ? completion.diagnostics.map((diagnostic) => ({
              severity: diagnostic && diagnostic.severity === 'info' ? 'info' : diagnostic && diagnostic.severity === 'warning' ? 'warning' : 'error',
              message: diagnostic && diagnostic.message ? diagnostic.message : 'Focused preview failed.',
              path: diagnostic && diagnostic.path ? diagnostic.path : undefined,
            }))
          : [];
        replaceFocusedDiagnostics(pending.document, diagnostics);
        const superseded = completion.applySequence !== focusedApplySequence;
        if (superseded || completion.disposition === 'superseded') {
          send({
            version: protocolVersion,
            type: 'focused-document-applied',
            requestId: completion.requestId,
            hostGeneration: completion.hostGeneration,
            applySequence: completion.applySequence,
            result: {
              disposition: 'superseded',
              projectInstanceId: completion.projectInstanceId,
              kind: completion.kind,
              recordId: completion.recordId,
              revision: completion.revision,
              resourceStageGeneration: completion.resourceStageGeneration,
            },
            diagnostics,
          });
          send({ version: protocolVersion, type: 'command-result', requestId: completion.requestId, ok: false, error: 'Focused preview request was superseded.', errorCode: 'focused-preview.superseded' });
          return;
        }
        if (completion.disposition !== 'applied' && completion.disposition !== 'unchanged') {
          send({ version: protocolVersion, type: 'command-result', requestId: completion.requestId, ok: false, error: diagnostics[0]?.message || 'Focused preview application failed.', errorCode: 'focused-preview.apply-failed' });
          return;
        }
        hideFailure();
        send({
          version: protocolVersion,
          type: 'focused-document-applied',
          requestId: completion.requestId,
          hostGeneration: completion.hostGeneration,
          applySequence: completion.applySequence,
          result: {
            disposition: completion.disposition,
            projectInstanceId: completion.projectInstanceId,
            kind: completion.kind,
            recordId: completion.recordId,
            revision: completion.revision,
            resourceStageGeneration: completion.resourceStageGeneration,
          },
          diagnostics,
        });
        send({ version: protocolVersion, type: 'command-result', requestId: completion.requestId, ok: true });
      }
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.type !== 'noveltea-preview-connect') return;
      if (!sessionToken || data.sessionToken !== sessionToken || data.version !== protocolVersion) return;
      const nextPort = event.ports && event.ports[0];
      if (nextPort) globalThis.NovelTeaPreviewBridge.setPort(nextPort);
    });

    function sendHello() {
      if (window.parent && window.parent !== window && sessionToken && !port) {
        window.parent.postMessage({ type: 'noveltea-preview-hello', version: protocolVersion, sessionToken }, '*');
      }
    }

    sendHello();
    const helloInterval = window.setInterval(() => {
      if (port) window.clearInterval(helloInterval);
      else sendHello();
    }, 250);
    window.setInterval(publishRuntimeDebugSnapshotIfChanged, 100);

    // BEGIN preview-surface-metrics
    function resolvePreviewSurfaceMetrics(cssWidth, cssHeight, devicePixelRatio, maxDpr) {
      const measuredCssWidth = Number.isFinite(cssWidth) && cssWidth > 0 ? cssWidth : 1;
      const measuredCssHeight = Number.isFinite(cssHeight) && cssHeight > 0 ? cssHeight : 1;
      const logicalWidth = Math.max(1, Math.round(measuredCssWidth));
      const logicalHeight = Math.max(1, Math.round(measuredCssHeight));
      const actualDpr = Number.isFinite(devicePixelRatio) && devicePixelRatio > 0
        ? devicePixelRatio
        : 1;
      const dpr = Number.isFinite(maxDpr) && maxDpr > 0
        ? Math.min(actualDpr, maxDpr)
        : actualDpr;
      const framebufferWidth = Math.max(1, Math.round(measuredCssWidth * dpr));
      const framebufferHeight = Math.max(1, Math.round(measuredCssHeight * dpr));
      const scaleX = framebufferWidth / logicalWidth;
      const scaleY = framebufferHeight / logicalHeight;
      return { logicalWidth, logicalHeight, framebufferWidth, framebufferHeight, scaleX, scaleY };
    }
    // END preview-surface-metrics

    function currentDevicePixelRatio() {
      const dpr = Number(window.devicePixelRatio);
      return Number.isFinite(dpr) && dpr > 0 ? dpr : 1;
    }

    function resizeCanvas() {
      const canvas = document.getElementById('canvas');
      const rect = document.body.getBoundingClientRect();
      const resize = resolvePreviewSurfaceMetrics(
        rect.width,
        rect.height,
        currentDevicePixelRatio(),
        diagnosticMaxDpr,
      );
      if (!runtimeReady) {
        if (canvas.width !== resize.framebufferWidth) canvas.width = resize.framebufferWidth;
        if (canvas.height !== resize.framebufferHeight) canvas.height = resize.framebufferHeight;
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
      }
      pendingResize = { ...resize, cssWidth: rect.width, cssHeight: rect.height };
      scheduleResizeApply();
    }

    function handleDevicePixelRatioChange() {
      armDevicePixelRatioWatcher();
      resizeCanvas();
    }

    function armDevicePixelRatioWatcher() {
      if (dprMediaQuery) {
        dprMediaQuery.removeEventListener('change', handleDevicePixelRatioChange);
        dprMediaQuery = null;
      }
      if (typeof window.matchMedia !== 'function') return;
      dprMediaQuery = window.matchMedia(`(resolution: ${currentDevicePixelRatio()}dppx)`);
      dprMediaQuery.addEventListener('change', handleDevicePixelRatioChange, { once: true });
    }

    function scheduleResizeApply() {
      if (resizeScheduled) return;
      resizeScheduled = true;
      requestAnimationFrame(() => {
        resizeScheduled = false;
        applyPendingResize();
      });
    }

    function applyCanvasPresentation(resize) {
      const canvas = document.getElementById('canvas');
      if (!resize || resize.framebufferWidth <= 0 || resize.framebufferHeight <= 0) return false;
      const capacityWidth = typeof Module._noveltea_preview_backbuffer_width === 'function'
        ? Module._noveltea_preview_backbuffer_width()
        : canvas.width;
      const capacityHeight = typeof Module._noveltea_preview_backbuffer_height === 'function'
        ? Module._noveltea_preview_backbuffer_height()
        : canvas.height;
      if (capacityWidth <= 0 || capacityHeight <= 0) return false;
      canvas.style.width = `${resize.cssWidth * capacityWidth / resize.framebufferWidth}px`;
      canvas.style.height = `${resize.cssHeight * capacityHeight / resize.framebufferHeight}px`;
      return true;
    }

    function applyPendingResize() {
      if (!pendingResize || !runtimeReady || typeof Module._noveltea_preview_resize !== 'function') return;
      const resize = pendingResize;
      const key = `${resize.logicalWidth}x${resize.logicalHeight}:${resize.framebufferWidth}x${resize.framebufferHeight}:${resize.scaleX}x${resize.scaleY}`;
      if (key === appliedResizeKey && !forcePendingResize) {
        applyCanvasPresentation(resize);
        return;
      }
      const applied = Module._noveltea_preview_resize(resize.logicalWidth, resize.logicalHeight, resize.framebufferWidth, resize.framebufferHeight, resize.scaleX, resize.scaleY);
      if (applied !== 1) {
        scheduleResizeApply();
        return;
      }
      appliedResizeKey = key;
      forcePendingResize = false;
      applyCanvasPresentation(resize);
      requestAnimationFrame(() => {
        if (pendingResize) applyCanvasPresentation(pendingResize);
      });
    }

    armDevicePixelRatioWatcher();
    resizeCanvas();
    new ResizeObserver(resizeCanvas).observe(document.body);
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('pageshow', resizeCanvas);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) resizeCanvas();
    });
    requestAnimationFrame(resizeCanvas);

    globalThis.NovelTeaPreviewRuntimeReady = function() {
      runtimeReady = true;
      resizeCanvas();
      scheduleResizeApply();
      void drainCommands();
    };
  })();

  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: (function() {
      const args = [];
      const params = new URLSearchParams(window.location.search);
      const showFps = (params.get('showFps') || '').toLowerCase();
      const audio = (params.get('audio') || '').toLowerCase();
      const fpsCap = Number.parseInt(params.get('fpsCap') || '0', 10) || 0;
      const rmluiSnap = (params.get('rmluiSnap') || 'all').toLowerCase();
      if (showFps === '1' || showFps === 'true' || showFps === 'yes') args.push('--show-fps');
      if (audio === '0' || audio === 'false' || audio === 'no') args.push('--no-audio');
      if (fpsCap > 0) args.push('--fps-cap', String(Math.min(1000, fpsCap)));
      if (new Set(['none', 'geometry', 'text', 'all']).has(rmluiSnap)) {
        args.push('--rmlui-snap', rmluiSnap);
      }
      return args;
    })(),
    onRuntimeInitialized: function() {
      if (typeof globalThis.NovelTeaPreviewRuntimeReady === 'function') globalThis.NovelTeaPreviewRuntimeReady();
    },
    print: function(text) { console.log(text); },
    printErr: function(text) { console.error(text); }
  };
</script>
