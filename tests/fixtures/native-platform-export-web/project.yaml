schema: noveltea.project.workspace
schemaVersion: 1
project:
  id: platform-export-acceptance
  name: Platform Export Acceptance
  version: 2026-10-09.1.1
  author: ""
  description: ""
settings:
  distributionNotices:
    - path: support/licenses/project.md
      displayName: Project-wide Credits
  ui:
    systemLayouts: {}
  inventory:
    defaultLayout: null
  interaction:
    defaultVerbMenuLayout: null
  text:
    defaultFont:
      $ref:
        collection: assets
        id: body-font
    fontStack: []
  titleScreen:
    titleImage: null
    showProjectTitle: true
    showAuthor: false
    subtitle: ""
    startLabel: Start
  app:
    displayName: Platform Export Acceptance
    shortName: Export Acceptance
    localized: {}
    applicationId: org.noveltea.platformexportacceptance
    saveNamespace: org.noveltea.platformexportacceptance
    versionName: 2026-10-09.1
    icon:
      $ref:
        collection: assets
        id: app-icon
    launchImage: null
    desktop: {}
    web: {}
    android: {}
  display:
    referenceResolution:
      width: 1920
      height: 1080
    worldRasterPolicy: capped
    barColor: "#000000"
  accessibility:
    uiScale:
      enabled: true
      minimum: 1
      maximum: 2
    textScale:
      enabled: true
      minimum: 1
      maximum: 2
  audio:
    purposes:
      music:
        volume: 1
        muted: false
      ambience:
        volume: 1
        muted: false
      voice:
        volume: 1
        muted: false
      sound-effect:
        volume: 1
        muted: false
      ui-sound:
        volume: 1
        muted: false
    voiceDucking:
      enabled: false
      musicGain: 0.5
      ambienceGain: 0.5
  cursors:
    defaults:
      default:
        kind: system
        cursor: default
      pointer:
        kind: system
        cursor: pointer
      hotspot:
        kind: inherit
        semantic: pointer
    named: []
  presentation:
    roomNavigationTransition:
      kind: cut
      durationMs: 0
      color: null
      skippable: true
export:
  runtime:
    id: runtime-canonical
    label: Canonical Runtime Package
    kind: runtime
    outputPath: ""
    includeChecksums: true
    stripEditorData: true
    stripShaderSources: true
    compileShadersBeforeExport: true
    shaderVariants:
      - essl-300
    excludeUnusedAssets: true
    includeShaderSources: false
    includeTests: false
    previewAfterExport: false
    localization:
      locales:
        - en
        - fr
      defaultLocale: en
      quality: development
  profiles:
    - format: noveltea.platform-export-profile
      id: canonical-web
      label: Canonical Web
      buildFlavor: debug
      compression: default
      includeDebugSymbols: false
      excludeUnusedAssets: true
      includeShaderSources: false
      assetMemory:
        kind: builtin
        preset: balanced
      localization:
        locales:
          - en
          - fr
        defaultLocale: en
        quality: development
      target: web
      architecture: wasm32
      packageAccess: web-fetch
      web:
        artifact: directory-zip
        threaded: true
        pwa: true
        display: standalone
        basePath: /
        serviceWorker: offline
  assetMemoryPolicies: []
bootstrapModule:
  $ref:
    collection: scripts
    id: bootstrap
entrypoint:
  kind: room
  id: foyer
inventories:
  - id: inventory
    label: Inventory
interactableInstances: {}
