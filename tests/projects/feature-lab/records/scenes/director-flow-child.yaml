id: director-flow-child
label: director-flow-child
data:
  displayName: director-flow-child
  stage:
    kind: inherited
  events:
    - id: input-call
      label: input-call
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: call-scene
      scene: director-input-child
      inputs:
        - inputId: enabled
          value: false
        - inputId: count
          value: 9
        - inputId: ratio
          value: 2.5
        - inputId: optional
          value: null
    - id: conversation
      label: conversation
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: call-dialogue
      dialogue: director-handoff
      startBlockId: null
    - id: first-handoff
      label: first-handoff
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: First Handoff returned to this Scene. Continue to resume the same Dialogue.
        markup: plain
      speaker: null
      wait: input
    - id: resume-one
      label: resume-one
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: resume-dialogue
    - id: second-handoff
      label: second-handoff
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: Second Handoff returned here. Continue to resume the retained third conversation part.
        markup: plain
      speaker: null
      wait: input
    - id: resume-two
      label: resume-two
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: resume-dialogue
    - id: batch
      label: batch
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: gameplay-effect-batch
      operations:
        - id: move-button
          kind: move-instance
          subject:
            kind: interactable
            interactable:
              $ref:
                registry: interactableInstances
                id: gate-lever-1
          location:
            kind: room
            room:
              kind: room
              room: scene-director
        - id: color
          kind: set-global-property
          variable: director-color
          value: blue play complete
    - id: interaction
      label: interaction
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: call-interaction
      verb: use
      bindings:
        - slotId: target
          subject:
            kind: interactable
            interactable:
              $ref:
                registry: interactableInstances
                id: gate-lever-1
    - id: structure
      label: structure
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: runtime-world-transaction
      operations:
        - kind: retarget-room-exit
          room: director-annex
          exitId: finish
          target: director-finish
    - id: relocate
      label: relocate
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: directed-room-change
      room: director-annex
    - id: annex
      label: annex
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: The effect batch moved the exact button and the ordinary Interaction unlocked the gate. A structural transaction updated the annex Exit; directed Room Change kept this Scene alive. Continue to navigate.
        markup: plain
      speaker: null
      wait: input
    - id: navigate
      label: navigate
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: navigation-attempt
      room: director-finish
      exitId: finish
    - id: done
      label: done
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: Navigation returned to the same Scene in the finish Room. Continue to release to exploration. Use its exits for explicit Continue Scene/Dialogue, Complete Game, or waits/signal demos.
        markup: plain
      speaker: null
      wait: input
  terminal:
    kind: return
    outcome: null
