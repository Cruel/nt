id: cursor-gameplay
label: cursor-gameplay
data:
  displayName: cursor-gameplay
  stage:
    kind: inherited
  events:
    - id: set
      label: set
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: run-lua
      source: assert(noveltea.presentation.cursor.set('progress'))
      mayYield: false
    - id: hold
      label: hold
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: Gameplay cursor is progress. Clear Mount requests and move outside RmlUi. Continue clears only the gameplay request.
        markup: plain
      speaker: null
      wait: input
    - id: clear
      label: clear
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: run-lua
      source: assert(noveltea.presentation.cursor.clear())
      mayYield: false
  terminal:
    kind: return
    outcome: null
