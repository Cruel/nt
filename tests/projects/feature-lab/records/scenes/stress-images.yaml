id: stress-images
label: stress-images
data:
  displayName: stress-images
  stage:
    kind: inherited
  events:
    - id: profile
      label: profile
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: "Prerequisite: export/run with a disclosed small asset pool, e.g. 24 MiB; record actual profile and device. Three 2048² RGBA images cost 16 MiB each before mips. Continue individually; mandatory images must stay coherent, visible loading must recover, speculative misses cannot change gameplay. No fixed FPS claim."
        markup: plain
      speaker: null
      wait: input
    - id: stress-image-1
      label: stress-image-1
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: run-lua
      source: assert(noveltea.presentation.set_background({owner='scene',asset='stress-image-1',fit='contain',color='#151827'}))
      mayYield: false
    - id: view-1
      label: view-1
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: show-text
      text:
        source:
          kind: inline
          text: "Image 1/3: inspect complete colored grid, then Continue. Restart cancels this workload."
        markup: plain
      speaker: null
      wait: input
    - id: stress-image-2
      label: stress-image-2
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: run-lua
