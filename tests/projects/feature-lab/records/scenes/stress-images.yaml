          text: "Image 2/3: inspect complete colored grid, then Continue. Restart cancels this workload."
        markup: plain
      speaker: null
      wait: input
    - id: stress-image-3
      label: stress-image-3
      timeline:
        trackId: main
        startMs: 0
        durationMs: 0
      type: run-lua
      source: assert(noveltea.presentation.set_background({owner='scene',asset='stress-image-3',fit='contain',color='#151827'}))
      mayYield: false
    - id: view-3
