id: room-lifecycle-child
label: Lifecycle Child Flow
archetype: null
archetypeOverrides: {}
traits: []
localProperties: []
data:
  displayName: Lifecycle Child Flow
  background:
    asset: pilot-room-backdrop
    color: "#15202a"
  description:
    source:
      kind: inline
      text: The after-enter lifecycle starts the normal Dialogue child flow before exploration resumes.
  presentationSpace:
    size:
      width: 1920
      height: 1080
    defaultView:
      center:
        x: 960
        "y": 540
  lifecycle:
    afterEnter:
      - id: announce-child
        kind: notify
        message:
          source:
            kind: inline
            text: After-enter is starting a child Dialogue.
          markup: plain
      - id: start-child-dialogue
        kind: call-dialogue
        dialogue: room-lifecycle-child-dialogue
      - id: child-returned
        kind: notify
        message:
          source:
            kind: inline
            text: Child Dialogue returned to Room lifecycle.
          markup: plain
  exits:
    - id: return-roundtrip
      label: Return to round trip
      direction: west
      target: room-lifecycle-roundtrip
