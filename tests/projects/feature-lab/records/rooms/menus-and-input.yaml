id: menus-and-input
label: Layer menus over the game
localProperties: []
data:
  displayName: Layer menus over the game
  background:
    asset: pilot-room-backdrop
    color: "#151827"
  description:
    source:
      kind: inline
      text: Use the control board and real Pause / menus toolbar. Inspect world activation notifications and independent UI actions. Tab through controls and scroll to the last row.
    markup: plain
  presentationSpace:
    size:
      width: 1920
      height: 1080
    defaultView:
      center:
        x: 960
        "y": 540
  interactables:
    - id: world-button
      interactable:
        $ref:
          registry: interactableInstances
          id: input-world-button
      placementId: world-button
      order: 1
  lifecycle:
    afterEnter:
      - id: mount
        kind: run-lua
        source: assert(noveltea.layouts.mount('menu-board', 'menu-control-board', {clock='unscaled-presentation'}))
  exits:
    - id: leave
      label: Leave and return from home
      direction: west
      target: world-composition
  placements:
    - id: world-button
      bounds:
        x: 0.72
        "y": 0.44
        width: 0.12
        height: 0.17
      presentation:
        label: null
        layout: null
