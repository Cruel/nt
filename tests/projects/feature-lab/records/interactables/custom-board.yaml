id: custom-board
label: Custom board
archetype: null
archetypeOverrides: {}
traits: []
defaultProperties: []
data:
  displayName: Custom board
  stackable: false
  stackLimit: null
  presentation:
    visual:
      kind: animation
      animation: custom-board-loop
      motionId: null
      playback: null
    cursor:
      kind: system
      cursor: crosshair
    hotspots:
      kind: custom
      hotspots:
        - id: owner
          label: owner
          condition: always
          inputOrder: 0
          highlight:
            kind: default
          target:
            kind: owner
          shape:
            kind: rect
            bounds:
              x: 0
              "y": 0
              width: 1
              height: 1
        - id: badge-left
          label: badge-left
          condition: always
          inputOrder: 10
          highlight:
            kind: material
            materialApplication:
              material: board-highlight
              parameters: {}
              textures: {}
          target:
            kind: owner-feature
            featureId: badge
          shape:
            kind: rect
            bounds:
              x: 0
              "y": 0.25
              width: 0.25
              height: 0.5
        - id: badge-right
          label: badge-right
          condition: always
          inputOrder: 10
          highlight:
            kind: default
          target:
            kind: owner-feature
            featureId: badge
          shape:
            kind: rect
            bounds:
              x: 0.75
              "y": 0.25
              width: 0.25
              height: 0.5
        - id: conditioned-other
          label: conditioned-other
          condition:
            kind: variable-comparison
            variable: hotspot-alternate
            operator: truthy
          inputOrder: 20
          highlight:
            kind: none
          cursor:
            kind: named
            id: lab-marked
          target:
            kind: subject
            subject:
              kind: interactable
              interactable:
                $ref:
                  registry: interactableInstances
                  id: alpha-board
          shape:
            kind: rect
            bounds:
              x: 0.35
              "y": 0.35
              width: 0.3
              height: 0.3
        - id: motion-probe
          label: motion-probe
          condition: always
          inputOrder: 40
          highlight:
            kind: none
          target:
            kind: owner-feature
            featureId: badge
          shape:
            kind: rect
            bounds:
              x: 0.1
              "y": 0.8
              width: 0.1
              height: 0.15
            motionTracks:
              - motionId: sweep
                keyframes:
                  - timeMs: 0
                    interpolation: linear
                    active: true
                    bounds:
                      x: 0.1
                      "y": 0.8
                      width: 0.1
                      height: 0.15
                  - timeMs: 1000
                    interpolation: hold
                    active: true
                    bounds:
                      x: 0.8
                      "y": 0.8
                      width: 0.1
                      height: 0.15
                  - timeMs: 1500
                    interpolation: hold
                    active: false
                    bounds:
                      x: 0.8
                      "y": 0.8
                      width: 0.1
                      height: 0.15
                  - timeMs: 1800
                    interpolation: hold
                    active: true
                    bounds:
                      x: 0.1
                      "y": 0.8
                      width: 0.1
                      height: 0.15
        - id: inert-on-top
          label: inert-on-top
          condition: always
          inputOrder: 100
          highlight:
            kind: none
          target:
            kind: none
          shape:
            kind: rect
            bounds:
              x: 0.35
              "y": 0.35
              width: 0.3
              height: 0.3
  features:
    - id: badge
      label: Shared badge
