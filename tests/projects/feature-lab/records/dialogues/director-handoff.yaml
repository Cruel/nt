          type: handoff
        - id: line-2
          type: line
          text:
            source:
              kind: inline
              text: "Conversation part 2: Continue. The Scene resumes between Handoffs without starting another conversation."
            markup: plain
        - id: handoff-2
          type: handoff
        - id: line-3
          type: line
          text:
            source:
              kind: inline
              text: "Conversation part 3: Continue. The Scene resumes between Handoffs without starting another conversation."
            markup: plain
  completion:
    kind: return
