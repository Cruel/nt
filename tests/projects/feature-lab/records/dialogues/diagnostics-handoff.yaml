id: diagnostics-handoff
label: diagnostics-handoff
data:
  displayName: diagnostics-handoff
  defaultSpeaker: pilot-guide
  settings:
    showDisabledChoices: false
    logMode: only-lines
  entryBlockId: intro
  blocks:
    - id: intro
      type: sequence
      label: intro
      segments:
        - id: line-1
          type: line
          text:
            source:
              kind: inline
              text: "Direct Dialogue, no Scene caller. Continue through Handoff: expect a warning, then exactly the next line."
            markup: plain
        - id: handoff-1
          type: handoff
        - id: line-2
          type: line
          text:
            source:
              kind: inline
              text: Handoff advanced once and ordinary continuation reached this line, without stranding the invocation. Continue to exploration.
            markup: plain
  completion:
    kind: return
