id: interview-hidden
label: Interview Hidden
data:
  displayName: Interview Hidden
  defaultSpeaker: pilot-guide
  settings:
    showDisabledChoices: false
    logMode: only-choices
  entryBlockId: intro
  blocks:
    - id: intro
      type: sequence
      label: intro
      segments:
        - id: hidden-policy
          type: line
          text:
            source:
              kind: inline
              text: "Hidden policy: the unavailable choice is absent (restart then finish without unlocking to compare). This line is excluded from the log. Select finish after inspecting History."
            markup: plain
    - id: menu
      type: choice
      label: Hidden choices
    - id: done
      type: sequence
      label: done
      segments:
        - id: done-line
          type: line
          text:
            source:
              kind: inline
              text: Continue to the completion tour.
            markup: plain
  edges:
    - id: menu
      kind: next
      fromBlockId: intro
      toBlockId: menu
    - id: hidden-topic
      kind: choice
      fromBlockId: menu
      toBlockId: done
      label:
        source:
          kind: inline
          text: Optional unlocked topic
        markup: plain
      condition:
        kind: variable-comparison
        variable: interview-topic
        operator: equal
        value: true
      logged: false
    - id: hidden-finish
      kind: choice
      fromBlockId: menu
      toBlockId: done
      label:
        source:
          kind: inline
          text: Finish hidden-choice conversation
        markup: plain
  completion:
    kind: scene
    id: interview-completion
