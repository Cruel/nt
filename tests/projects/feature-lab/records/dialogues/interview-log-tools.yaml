id: interview-log-tools
label: Interview Log Tools
data:
  displayName: Interview Log Tools
  defaultSpeaker: pilot-guide
  settings:
    showDisabledChoices: false
    logMode: nothing
  entryBlockId: intro
  blocks:
    - id: intro
      type: sequence
      label: intro
      segments:
        - id: log-tools-line
          type: line
          text:
            source:
              kind: inline
              text: "Interview complete. Open Menu → History: admitted rich entries remain, private lines do not. Append a system entry, inspect History, then clear it."
            markup: plain
    - id: tools
      type: choice
      label: History tools
    - id: appended
      type: sequence
      label: appended
      segments:
        - id: appended-line
          type: line
          text:
            source:
              kind: inline
              text: System receipt appended. Open History before continuing.
            markup: plain
    - id: cleared
      type: sequence
      label: cleared
      segments:
        - id: cleared-line
          type: line
          text:
            source:
              kind: inline
              text: History cleared. This conversation uses logMode Nothing, so the log stays empty.
            markup: plain
    - id: end
      type: sequence
      label: end
      segments:
        - id: end-line
          type: line
          text:
            source:
              kind: inline
              text: End completion ends foreground Flow; the Interview complete Room remains current.
            markup: plain
  edges:
    - id: tools
      kind: next
      fromBlockId: intro
      toBlockId: tools
    - id: append-log
      kind: choice
      fromBlockId: tools
      toBlockId: appended
      label:
        source:
          kind: inline
          text: Append system receipt
        markup: plain
      effects:
        - id: append-system-log
          kind: run-lua
          source: assert(noveltea.text_log.append("notification", "system", "[b]System receipt[/b]", "active-text"))
    - id: clear-log
      kind: choice
      fromBlockId: tools
      toBlockId: cleared
      label:
        source:
          kind: inline
          text: Clear History
        markup: plain
      effects:
        - id: clear-system-log
          kind: run-lua
          source: assert(noveltea.text_log.clear())
    - id: end-log
      kind: choice
      fromBlockId: tools
      toBlockId: end
      label:
        source:
          kind: inline
          text: End conversation
        markup: plain
    - id: appended-tools
      kind: next
      fromBlockId: appended
      toBlockId: tools
    - id: cleared-tools
      kind: next
      fromBlockId: cleared
      toBlockId: tools
