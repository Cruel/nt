id: ui-control-board
label: UI control board targets
data:
  rules:
    - id: pick-world
      verb: use
      slots:
        - slotId: target
          selectors:
            - kind: exact
              subject:
                kind: interactable
                interactable:
                  $ref:
                    registry: interactableInstances
                    id: input-world-button
      offer:
        slotId: target
        rank: 10
        primary: true
      priority: 10
      program:
        instructions:
          - id: count
            kind: run-lua
            source: local count, _, err = Game.prop('world-activations'); if err then error(err) end; assert(Game.set_prop('world-activations', count + 1))
          - id: notify
            kind: notify
            message:
              source:
                kind: inline
                text: World button activated.
              markup: plain
    - id: pick-alpha
      verb: inspect-ui
      slots:
        - slotId: target
          selectors:
            - kind: exact
              subject:
                kind: interactable
                interactable:
                  $ref:
                    registry: interactableInstances
                    id: alpha-board
      offer:
        slotId: target
        rank: 10
        primary: true
      priority: 10
      program:
        instructions:
          - id: notify
            kind: notify
            message:
              source:
                kind: inline
                text: Picked alpha semantic target.
              markup: plain
          - id: inventory
            kind: present-inventory
            inventory:
              kind: player-inventory
            layout: trigger-panel
            useTriggerAnchor: true
    - id: pick-custom
      verb: inspect-ui
      slots:
        - slotId: target
          selectors:
            - kind: exact
              subject:
                kind: interactable
                interactable:
