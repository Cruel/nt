                    registry: interactableInstances
                    id: custom-board
      offer:
        slotId: target
        rank: 10
        primary: true
      priority: 10
      program:
        instructions:
          - id: notify
            kind: notify
            message:
              source:
                kind: inline
                text: Picked custom semantic target.
              markup: plain
          - id: inventory
            kind: present-inventory
            inventory:
              kind: player-inventory
            layout: trigger-panel
            useTriggerAnchor: true
    - id: pick-badge
      verb: inspect-ui
      slots:
        - slotId: target
          selectors:
            - kind: exact
              subject:
                kind: feature
                feature:
                  ownerKind: interactable
                  interactable:
                    $ref:
                      registry: interactableInstances
                      id: custom-board
                  featureId: badge
      offer:
        slotId: target
        rank: 10
        primary: true
      priority: 10
      program:
        instructions:
          - id: notify
            kind: notify
            message:
              source:
                kind: inline
                text: Picked badge semantic target.
              markup: plain
          - id: inventory
            kind: present-inventory
            inventory:
              kind: player-inventory
            layout: trigger-panel
            useTriggerAnchor: true
    - id: pick-strip
      verb: inspect-ui
      slots:
        - slotId: target
          selectors:
            - kind: exact
              subject:
                kind: feature
                feature:
                  ownerKind: room
                  room: hotspots-and-cursors
                  featureId: board-label
      offer:
        slotId: target
        rank: 10
        primary: true
      priority: 10
      program:
        instructions:
          - id: notify
            kind: notify
