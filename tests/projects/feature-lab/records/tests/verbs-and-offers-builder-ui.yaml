id: verbs-and-offers-builder-ui
label: Verbs & Offers Command Builder
data:
  displayName: Verbs & Offers Command Builder
  steps:
    - id: start
      input: tick
      label: Fresh Lab home
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject: null
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_game
        mountInstanceId: null
        selector: "#target"
    - id: category
      input: ui-click
      label: Bring Commands & Discovery into view
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject: null
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_game
        mountInstanceId: null
        selector: "#feature-lab-category-commands-discovery"
    - id: launch
      input: ui-click
      label: Launch Verbs & Offers
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject: null
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_game
        mountInstanceId: null
        selector: "#feature-lab-launch-verbs-and-offers"
    - id: open-builder-menu
      input: open-verb-menu
      label: Open menu on the recipient to begin Deliver
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject:
          kind: character
          character: verbs-recipient
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_game
        mountInstanceId: null
        selector: "#target"
    - id: choose-deliver
      input: ui-click
      label: Choose Deliver from the real menu
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject: null
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_verb_menu
        mountInstanceId: null
        selector: "#nt-verb-menu-action-deliver"
    - id: bind-inventory-parcel
      input: primary-activate
      label: Bind the remaining parcel slot from Inventory
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject:
          kind: interactable
          interactable:
            $ref:
              registry: interactableInstances
              id: builder-inventory-parcel
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_game
        mountInstanceId: null
        selector: "#target"
    - id: submit-builder
      input: ui-click
      label: Submit through the real Command Builder
      expectations:
        - id: delivered
          type: property
          operator: eq
          property:
            scope: global
            ownerId: ""
            propertyId: commands-result
            value: delivered
          currentRoom:
            roomId: ""
          location:
            entityKind: interactable
            entityId: ""
            locationKind: unplaced
            roomId: ""
            inventoryOwnerKind: project
            inventoryOwnerId: ""
            inventoryId: ""
          quantity:
            interactableId: ""
            value: 0
          trait:
            ownerKind: interactable
            ownerId: ""
            traitId: trait
          entityState:
            entityKind: interactable
            entityId: ""
            field: enabled
            value: true
          activeFlow:
            kind: scene
            flowId: ""
          layout:
            layoutId: ""
            field: mounted
            value: null
          uiElement:
            documentId: runtime_game
            mountInstanceId: null
            selector: "#target"
            field: present
            value: true
          event:
            kind: notification
            value: ""
          diagnostic:
            code: ""
      dialogueChoice:
        edgeId: choice
      sceneChoice:
        optionId: choice
      navigate:
        exitId: exit
      subjectAction:
        subject: null
      runInteraction:
        verb: null
        bindings: []
      saveSlot:
        slotId: autosave
      uiClick:
        documentId: runtime_command_builder
        mountInstanceId: null
        selector: "#command_builder_submit"
  preview:
    selectedStepId: start
    selectedObservationIndex: null
    autoOpenReport: true
