data:
  contract:
    inputs:
      caption:
        defaultValue: Flow panel
        type: string
      current_room:
        defaultValue: null
        nullable: true
        type: string
      mode:
        defaultValue: playing
        type: string
      owner_label:
        defaultValue: Scene defaults
        type: string
      paused:
        defaultValue: false
        type: boolean
      scope:
        defaultValue: flow
        type: string
      stock:
        defaultValue: 3
        type: integer
    signals:
      accepted:
        fields:
          count:
            type: integer
    state:
      defaultValue:
        count: 0
        details:
          label: default
          optional: null
        samples:
          - 1
          - null
          - 2.5
      fields:
        count:
          shape:
            type: integer
        details:
          shape:
            fields:
              label:
                shape:
                  type: string
              optional:
                shape:
                  nullable: true
                  type: string
            type: object
        samples:
          shape:
            items:
              nullable: true
              type: number
            type: array
      type: object
  dependencies:
    data:
      - notice-board-data
    fonts:
      - dejavusans
    images:
      - ui-pattern
    scripts:
      - scripts/layout-counter-ui.lua
    stylesheets:
      - counter-shared-style
    templates:
      - counter-template
  lua:
    sourceMode: file
  rcss:
    sourceAsset: counter-style
    sourceMode: asset
  rml:
    sourceAsset: counter-document
    sourceMode: asset
  sampleState:
    inputs:
      caption: Flow panel
      scope: flow
  script:
    enabled: true
    namespace: layout_counter_ui
id: flow-counter
label: Flow counter
